    if(gid==='formula-match'){startMatch(1); return go('#/match');}
    if(gid==='detective'){startCase('case'); return go('#/case');}
    if(gid==='ht-battle'){startCase('ht'); return go('#/case');}
    if(gid==='daily'){seedRNG(Number(today().replace(/-/g,'')));}
    const mode=gid==='daily'?'daily':gid==='weekly'?'weekly':gid==='tourney'?'tournament':'game';
    const timed=GAMES.find(x=>x.id===gid)&&GAMES.find(x=>x.id===gid).secs;
    const limit=gid==='daily'?8:gid==='weekly'?15:gid==='tourney'?25:(timed?null:10);
    startGame(gid,gid==='daily'?2:lv,mode,limit?{limit}:{});
    if(G){G.t0=Date.now(); if(gid==='daily') RNG=Math.random;}
    if(location.hash!=='#/play') location.hash='#/play'; else render();
    return;
  }
  const bs=t.closest('[data-boss]');
  if(bs){
    const b=BOSSES.find(x=>x.id===bs.getAttribute('data-boss'));
    startGame(b.id,3,'boss',{boss:b,limit:12});
    if(G) G.t0=Date.now();
    if(location.hash!=='#/play') location.hash='#/play'; else render();
    return;
  }
  const gopt=t.closest('[data-gopt]');
  if(gopt&&G){ gameAnswer(gopt.getAttribute('data-gopt')); return; }
  if(t.id==='gnext'&&G){ gameNext(); return; }
  if(t.id==='ghint'&&G&&!G.shown){
    const wrongIdx=G.q.o.map((_,i)=>i).filter(i=>i!==G.q.c);
    G.hint=[pick(wrongIdx)]; addXP(-4); render(); return;
  }
  if(t.id==='gquit'&&G){ if(confirm('End this round? Your answers so far are kept.')) endGame(); return; }
  if(t.id==='gagain'&&G){ const gid=G.gid,lv=G.lv,mode=G.mode,boss=G.boss,limit=G.limit;
    startGame(gid,lv,mode,{boss,limit}); if(G)G.t0=Date.now(); return; }

  /* ---- dice lab ---- */
  const dv=t.closest('[data-dice]');
  if(dv){DL={ev:DICE_EVENTS.find(x=>x.id===dv.getAttribute('data-dice')),trials:0,succ:0,run:[],pred:null,predShown:false};render();return;}
  const dp=t.closest('[data-dpred]');
  if(dp&&DL){DL.pred=Number(dp.getAttribute('data-dpred')); DL.predShown=true;
    if(DL.pred===DL.opts.c) addXP(10); touchStreak(); render(); return;}
  const rl=t.closest('[data-roll]');
  if(rl&&DL){
    const n=parseInt(rl.getAttribute('data-roll'),10);
    if(!n){DL.trials=0;DL.succ=0;DL.run=[];render();return;}
    for(let i=0;i<n;i++){
      const r=[rint(1,6),rint(1,6)];
      DL.trials++; if(DL.ev.f(r)) DL.succ++;
      if(DL.trials%Math.max(1,Math.floor(DL.trials/120)+1)===0||DL.trials<40) DL.run.push(DL.succ/DL.trials);
    }
    if(DL.run.length>260) DL.run=DL.run.filter((_,i)=>i%2===0);
    addXP(2); render(); return;
  }
  /* ---- CLT explorer ---- */
  const cp=t.closest('[data-clpop]');
  if(cp){CL=CL||{};CL.pop=CLT_POPS.find(p=>p.id===cp.getAttribute('data-clpop'));CL.scored=false;CL.means=null;render();return;}
  const cn=t.closest('[data-cln]');
  if(cn){CL=CL||{pop:CLT_POPS[0]};CL.n=parseInt(cn.getAttribute('data-cln'),10);CL.scored=false;CL.means=null;render();return;}
  if(t.id==='clrun'&&CL){
    ['cp1','cp2','cp3','cp4'].forEach(k=>{const el=document.getElementById(k); CL.preds[k]=el?el.value:'';});
    if(Object.values(CL.preds).some(v=>!v)){alert('Answer all four predictions first — committing to a prediction is the point.');return;}
    CL.means=Array.from({length:2000},()=>mn(Array.from({length:CL.n},CL.pop.f)));
    CL.scored=true;
    const keys=[['cp1','normal'],['cp2','mu'],['cp3','se'],['cp4','shrink']];
    addXP(keys.filter(k=>CL.preds[k[0]]===k[1]).length*15);
    touchStreak(); checkBadges();
    S.gstat=S.gstat||{}; const g=S.gstat['clt-game']=S.gstat['clt-game']||{n:0,c:0,best:0,plays:0};
    const pct=Math.round(100*keys.filter(k=>CL.preds[k[0]]===k[1]).length/4);
    g.best=Math.max(g.best||0,pct); g.plays++; g.n+=4; g.c+=Math.round(pct/25);
    save(); render(); return;
  }
  if(t.id==='clreset'&&CL){CL.scored=false;CL.means=null;CL.preds={};render();return;}
  /* ---- CI simulator ---- */
  const cil=t.closest('[data-cil]');
  if(cil){CIS=CIS||{n:50};CIS.level=parseFloat(cil.getAttribute('data-cil'));CIS.runs=null;CIS.pred=null;render();return;}
  const cin=t.closest('[data-cin]');
  if(cin){CIS=CIS||{level:0.95};CIS.n=parseInt(cin.getAttribute('data-cin'),10);CIS.runs=null;CIS.pred=null;render();return;}
  const cipd=t.closest('[data-cipred]');
  if(cipd&&CIS){CIS.pred=parseInt(cipd.getAttribute('data-cipred'),10);addXP(5);touchStreak();render();return;}
  if(t.id==='cirun'&&CIS){CIS.runs=null;render();return;}
  if(t.id==='cireset'&&CIS){CIS.runs=null;CIS.pred=null;render();return;}
  /* ---- formula match ---- */
  const ml=t.closest('[data-mleft]'); if(ml){matchPick('left',ml.getAttribute('data-mleft'));return;}
  const mr=t.closest('[data-mright]'); if(mr){matchPick('right',mr.getAttribute('data-mright'));return;}
  const mn2=t.closest('[data-mnext]'); if(mn2){startMatch(parseInt(mn2.getAttribute('data-mnext'),10));return;}
  /* ---- cases ---- */
  const co=t.closest('[data-copt]'); if(co&&CG){caseAnswer(Number(co.getAttribute('data-copt')));return;}
  if(t.id==='cnext'&&CG){caseNext();return;}
  const cst=t.closest('[data-case]');
  if(cst){const [kind,id]=cst.getAttribute('data-case').split(':'); startCase(kind,id||null); return;}
  /* ---- teach me ---- */
  const to=t.closest('[data-topt]');
  if(to&&TM){ if(TM.shown) return;
    TM.resp=Number(to.getAttribute('data-topt')); TM.shown=true; TM.asked++;
    const ok=TM.resp===TM.q.c; if(ok){TM.right++; addXP(8);}
    S.gq=S.gq||{}; S.gq[TM.q.a]=S.gq[TM.q.a]||{n:0,c:0}; S.gq[TM.q.a].n++; if(ok)S.gq[TM.q.a].c++;
    logErrKind(TM.q.a,TM.q.k||'concept',ok); save(); render(); return; }
  if(t.id==='tmnext'&&TM){ if(TM.steps[TM.i].check&&!TM.shown) return;
    TM.i=Math.min(TM.i+1,TM.steps.length-1); TM.shown=false; TM.resp=null; TM.q=null; render(); return; }
  if(t.id==='tmback'&&TM){TM.i=Math.max(0,TM.i-1);TM.shown=false;TM.q=null;render();return;}
  if(t.id==='tmslow'&&TM){TM.slow=!TM.slow;render();return;}
  /* ---- teach back ---- */
  const tb=t.closest('[data-tb]');
  if(tb){const id=tb.getAttribute('data-tb');
    TB=id?{p:TBP.find(p=>p.id===id),text:'',res:null}:null; render(); return;}
  if(t.id==='tbsubmit'&&TB){
    const el=document.getElementById('tbtext'); TB.text=el?el.value:'';
    if(TB.text.trim().split(/\s+/).length<12){alert('Write at least a couple of full sentences — a phrase cannot be marked fairly.');return;}
    TB.res=gradeTeachBack(TB.p,TB.text);
    S.tb=S.tb||{}; const prev=S.tb[TB.p.id];
    S.tb[TB.p.id]={score:Math.max(TB.res.score,prev?prev.score:0),date:today()};
    S.gq=S.gq||{}; S.gq[TB.p.a]=S.gq[TB.p.a]||{n:0,c:0}; S.gq[TB.p.a].n+=2; S.gq[TB.p.a].c+=TB.res.score>=75?2:TB.res.score>=45?1:0;
    logErrKind(TB.p.a,'interp',TB.res.score>=75);
    addXP(Math.round(TB.res.score/4)); touchStreak(); checkBadges(); save(); render(); return;
  }
  if(t.id==='tbcancel'){TB=null;render();return;}
  if(t.id==='tbretry'&&TB){TB.res=null;render();return;}
  /* ---- notes queue ---- */
  const qd=t.closest('[data-qdel]'); if(qd){NQ.splice(parseInt(qd.getAttribute('data-qdel'),10),1);render();return;}
  if(t.id==='nclearq'){NQ=[];render();return;}
  if(t.id==='nimport'){
    if(!NQ.length) return;
    let n=0, firstW=null, firstId=null;
    NQ.forEach(q=>{
      const id='n'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
      NOTES[q.week]=NOTES[q.week]||[];
      NOTES[q.week].push({id,title:q.title,topics:q.topics,text:q.text,added:today()});
      if(firstW===null){firstW=q.week;firstId=id;} n++;
    });
    NQ=[]; saveNotes(); touchStreak(); toast(`${n} file${n===1?'':'s'} added — nothing existing was changed`);
    renderNav(); go('#/notes?w='+firstW); return;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='nfiles'){
    const files=[...t.files];
    let pending=files.length;
    files.forEach(f=>{
      const rd=new FileReader();
      rd.onload=()=>{
        const text=String(rd.result||'');
        const wk=guessWeek(f.name);
        NQ.push({title:f.name.replace(/\.[a-z0-9]+$/i,''),week:wk,topics:guessTopics(text,wk),text});
        if(!--pending) render();
      };
      rd.onerror=()=>{ if(!--pending) render(); toast('Could not read '+f.name+' as text'); };
      rd.readAsText(f);
    });
    return;
  }
  const qw=t.closest('[data-qweek]');
  if(qw){const i=parseInt(qw.getAttribute('data-qweek'),10); NQ[i].week=parseInt(qw.value,10); return;}
  const qt=t.closest('[data-qtop]');
  if(qt){const i=parseInt(qt.getAttribute('data-qtop'),10); NQ[i].topics=[...qt.selectedOptions].map(o=>o.value); return;}
  const pl=t.closest('[data-plan]');
  if(pl){const d=today(); S.plan=S.plan||{}; S.plan[d]=S.plan[d]||{};
    S.plan[d][pl.getAttribute('data-plan')]=pl.checked;
    if(pl.checked) addXP(10);
    save(); return;}
});
/* keep the sidebar week list open when a week is showing */
window.addEventListener('hashchange',()=>{
  const {parts}=parseHash();
  if(parts[0]==='week'&&!S._weeksOpen){S._weeksOpen=true;renderNav();}
});
renderNav();

</script>
