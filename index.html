 mistakes:['Concluding "no difference" from overlapping intervals.','Assigning probability to the parameter rather than to the procedure.','Using z* when σ is unknown and n is small.'],
 keyf:['cim','cip','moe'],
 checks:[{q:'A 99% CI for a proportion is (0.41, 0.55). What is the point estimate and margin of error, and would H₀: p = 0.5 be rejected at α = 0.01?',
   a:'Point estimate = 0.48; margin of error = 0.07. The interval contains 0.5, so H₀: p = 0.5 would not be rejected at the 1% level in a two-sided test.'}]},

'polls':{t:'Application: political polls', area:'est', w:10,
 simple:'Poll headlines are confidence intervals in disguise. The margin of error decides whether "leading" means anything.',
 formal:'A political poll estimates a population proportion from a sample, and the reported margin of error is typically the 95% margin computed at p̂ = 0.5, the most conservative case: m = 1.96√(0.25/n) ≈ 0.98/√n. Two implications follow. First, a lead smaller than roughly twice the margin of error is not statistically distinguishable from a tie. Second, the margin of error captures sampling variability only — it says nothing about coverage error, nonresponse bias or question wording, which are often larger sources of error than sampling.',
 defs:[['Margin of error (poll)','Half-width of the 95% interval, usually computed at p̂ = 0.5.'],
       ['Conservative margin','Using p̂ = 0.5 maximises p̂(1 − p̂) and so gives the widest, safest margin.'],
       ['Non-sampling error','Bias from coverage, nonresponse or wording; not reflected in the reported margin.']],
 steps:[{h:'Worked example', b:'A poll of n = 1,067 reports Candidate A at 52% and B at 48%, "margin of error ±3%".<br>Check: 0.98/√1067 = 0.030. ✔<br>A\'s interval is (49%, 55%); B\'s is (45%, 51%). They overlap and A\'s interval contains 50%, so the poll does not establish that A leads. The lead of 4 points is within the noise.'},
        {h:'Sample size for a target margin', b:'For ±2% at 95%: n ≥ 0.25(1.96/0.02)² = 2,401. Halving the margin quadruples the cost.'}],
 mistakes:['Reading a 4-point lead with a ±3-point margin as a real lead.','Assuming the margin of error accounts for all polling error.','Using the margin of error for a subgroup — smaller n means a much larger margin.'],
 keyf:['moe','nsize'],
 checks:[{q:'A poll of 400 finds 47% support with a ±5% margin. A subgroup of 100 rural voters shows 55%. Why should the subgroup number be treated more cautiously?',
   a:'The margin depends on the subgroup n, not the total. With n = 100, the margin is about 0.98/√100 = 9.8% — roughly ±10%, so rural support is only pinned down to about 45%–65%.'}]},

'univariate-graphs':{t:'Univariate graphing', area:'desc', w:10,
 simple:'One variable at a time: bar chart for categories, histogram or boxplot for numbers.',
 formal:'Univariate displays show the distribution of a single variable. Categorical: bar chart of counts or percentages, ordered meaningfully (by size, or by the natural order of an ordinal variable); pie charts are acceptable only for a few categories summing to a whole. Quantitative: histogram (shape and modality), boxplot (five-number summary and outliers, ideal for comparisons), stemplot for small datasets, density plot for a smooth view. Bin width matters: too few bins hide structure, too many produce noise. Every graph needs axis labels with units and a title stating the variable and the population.',
 defs:[['Bin width','The interval size of a histogram; changes the apparent shape.'],
       ['Boxplot','Box from Q1 to Q3, line at the median, whiskers to the most extreme non-outlier, points beyond the fences.'],
       ['Modality','Number of clear peaks: unimodal, bimodal, multimodal.']],
 steps:[{h:'Choosing the display', b:'Marital status (5 categories) → bar chart of percentages, ordered largest to smallest.<br>Household income → histogram to see the right skew, plus a boxplot to display the outliers.<br>Comparing income across four regions → four side-by-side boxplots on a common scale.'},
        {h:'Bin width in practice', b:'With ages 18–65, bins of width 1 give 48 noisy bars; width 5 gives 10 readable bars. Try two or three widths before choosing.'}],
 mistakes:['Truncating the y-axis so differences look larger than they are.','Using a pie chart for many categories, or for percentages that do not sum to 100.','Leaving default R axis labels such as "d$INCOME" in a submitted report.','Reporting only a boxplot when the distribution is bimodal — the box hides the two peaks.'],
 keyf:[],
 checks:[{q:'A boxplot of exam marks is symmetric, but the histogram shows two clear peaks. Which display do you report, and why?',
   a:'Report the histogram, or both. A boxplot only shows quartiles and cannot reveal modality, so a bimodal distribution can look perfectly symmetric in a boxplot. The two peaks are a substantive finding worth explaining.'}]},

'bivariate-graphs':{t:'Bivariate graphing', area:'rel', w:10,
 simple:'Two variables at a time. Which graph you use is decided entirely by the two variable types.',
 formal:'Bivariate displays show how the distribution of the response varies with the explanatory variable. C→Q: side-by-side boxplots or a bar chart of group means (with error bars if precision matters). C→C: segmented or grouped bar chart of conditional percentages computed within the explanatory categories. Q→Q: scatterplot with the explanatory variable on the x-axis, optionally with a fitted line; describe direction, form, strength and outliers. A third variable can be added by colour, shape or faceting, which is how moderation is displayed in Week 12.',
 defs:[['Side-by-side boxplots','The standard C→Q display; compare centres, spreads and outliers on one scale.'],
       ['Segmented bar chart','Bars scaled to 100% within each explanatory category, showing conditional distributions.'],
       ['Scatterplot','One point per unit; x is explanatory, y is response.'],
       ['Faceting','Repeating the same graph within levels of a third variable.']],
 steps:[{h:'Matching case to graph', b:'<table><tr><th>Case</th><th>Graph</th><th>Numerical summary</th></tr><tr><td>C→Q</td><td>Side-by-side boxplots</td><td>Group means/medians and SDs</td></tr><tr><td>C→C</td><td>Segmented bar chart</td><td>Conditional percentages</td></tr><tr><td>Q→Q</td><td>Scatterplot</td><td>r and regression line</td></tr></table>'},
        {h:'Percentages, not counts', b:'For C→C, always plot percentages within the explanatory categories. Raw counts confound the relationship with unequal group sizes.'}],
 mistakes:['Putting the response variable on the x-axis of a scatterplot.','Plotting counts instead of conditional percentages in a segmented bar chart.','Using a line graph for two quantitative variables that are not measured over time.'],
 keyf:['corr'],
 checks:[{q:'You want to show whether education level (4 categories) relates to employment status (employed/unemployed). What graph and what numbers?',
   a:'C→C: a segmented (100%) bar chart with one bar per education level, showing the percentage employed within each level. Support it with a two-way table of conditional row percentages.'}]},

'inference-relationships':{t:'Inference for relationships (Modules 16–17)', area:'relinf', w:11,
 simple:'You saw a relationship in your sample. Inference asks whether it is strong enough to claim it exists in the population.',
 formal:'Inference for relationships tests whether an association observed in a sample is stronger than sampling variability alone would produce. The null hypothesis is always some form of "no relationship in the population", and the procedure is chosen by the types of the two variables. C→Q with two groups: two-sample t-test on μ₁ − μ₂. C→Q with three or more groups: ANOVA, using the F statistic. C→C: chi-square test of independence on a two-way table. Q→Q: t-test on the correlation or on the regression slope, with H₀: ρ = 0 (equivalently β = 0). Every one of these tests only supports a claim of association; a causal claim still requires a randomised design.',
 defs:[['Two-sample t-test','Compares two population means; H₀: μ₁ = μ₂.'],
       ['ANOVA','Compares three or more means simultaneously; H₀: all means equal.'],
       ['Chi-square test of independence','Compares observed counts with counts expected under independence.'],
       ['Test for correlation/slope','H₀: ρ = 0, i.e. no linear relationship.']],
 steps:[{h:'The decision table', b:'<table><tr><th>Explanatory</th><th>Response</th><th>Test</th><th>H₀</th></tr><tr><td>C (2 levels)</td><td>Q</td><td>Two-sample t</td><td>μ₁ = μ₂</td></tr><tr><td>C (3+ levels)</td><td>Q</td><td>ANOVA (F)</td><td>All μ equal</td></tr><tr><td>C</td><td>C</td><td>Chi-square</td><td>Variables independent</td></tr><tr><td>Q</td><td>Q</td><td>t on r or slope</td><td>ρ = 0</td></tr></table>'},
        {h:'Reporting a result', b:'"Mean income differed significantly across regions, F(3, 496) = 6.42, p = 0.0003. Post-hoc comparisons showed Greater Accra higher than the Northern region (mean difference GH₵420, 95% CI 180 to 660)." Statistic, df, p-value, direction and effect size — all four.'}],
 mistakes:['Running many pairwise t-tests instead of ANOVA, inflating the Type I error rate.','Reporting a p-value with no effect size or direction.','Concluding causation from a significant test on observational data.'],
 keyf:['tsample','chisq'],
 checks:[{q:'You compare mean sleep hours across five academic programmes. Which test, and what is H₀?',
   a:'ANOVA, because the explanatory variable is categorical with five levels and the response is quantitative. H₀: μ₁ = μ₂ = μ₃ = μ₄ = μ₅ (all programme means equal); Hₐ: at least one mean differs.'}]},

'interpreting-bivariate':{t:'Interpreting bivariate graphs', area:'relinf', w:11,
 simple:'Say what the graph shows, in the units of the variables, before you say what it means.',
 formal:'Interpretation proceeds in a fixed order: describe the pattern, quantify it, then qualify it. For C→Q, compare centres and spreads and state the difference in the response units. For C→C, compare conditional percentages across categories and state the percentage-point difference. For Q→Q, state direction, form and strength, then interpret the slope as the expected change in y per one-unit increase in x, and r² as the proportion of variation in y explained by the linear relationship with x. Finish by noting outliers, restricted ranges and, always, that association is not causation.',
 defs:[['Slope interpretation','A one-unit increase in x is associated with a change of b units in the predicted y.'],
       ['r²','The proportion of variability in y explained by the linear relationship with x.'],
       ['Percentage-point difference','The arithmetic difference between two percentages; distinct from a percentage change.'],
       ['Influential point','An observation whose removal noticeably changes the fitted line, typically extreme in x.']],
 steps:[{h:'Interpreting a fitted line', b:'ŷ = 45 + 2.3x, where x = hours studied and y = exam mark, r = 0.62.<br>Slope: each additional hour of study is associated with a 2.3-mark increase in predicted score.<br>Intercept: a student studying 0 hours is predicted to score 45 — meaningful only if 0 is within the observed range of x.<br>r² = 0.38: about 38% of the variation in marks is explained by the linear relationship with study hours; the remaining 62% is not.'},
        {h:'Interpreting a C→C comparison', b:'"68% of urban respondents used mobile money compared with 41% of rural respondents, a difference of 27 percentage points." Not "27% more" — that is a different quantity.'}],
 mistakes:['Interpreting the intercept when x = 0 lies far outside the data range.','Extrapolating the line beyond the observed x values.','Reporting r² as the proportion of points on the line.','Confusing percentage points with percentage change.'],
 keyf:['regline','rsq'],
 checks:[{q:'For ŷ = 12 + 0.5x with r = −0.7, identify the contradiction.',
   a:'r is negative but the slope is positive. Impossible — r and the slope always share a sign, since b = r(sᵧ/sₓ) and standard deviations are positive. One of the two numbers is wrong.'}]},

'cq-inference':{t:'C → Q inference', area:'relinf', w:12,
 simple:'Categorical explanatory, quantitative response: compare group means.',
 formal:'With a categorical explanatory variable and a quantitative response, the parameter of interest is a difference in population means (two groups) or the equality of several means (three or more). Two independent groups: t = (x̄₁ − x̄₂)/√(s₁²/n₁ + s₂²/n₂), with H₀: μ₁ = μ₂, and a confidence interval for μ₁ − μ₂ that excludes 0 exactly when the two-sided test rejects. Three or more groups: one-way ANOVA partitions total variability into between-group and within-group components, F = MS(between)/MS(within), with H₀ that all means are equal; a significant F is followed by post-hoc comparisons to identify which groups differ. Conditions: independent random samples, roughly normal responses within each group or large n, and, for ANOVA, comparable group standard deviations.',
 defs:[['Two-sample t-test','Tests μ₁ = μ₂ for two independent groups.'],
       ['ANOVA F statistic','Ratio of between-group to within-group variability; large F is evidence against equal means.'],
       ['Post-hoc test','A follow-up comparison after a significant F, adjusted for multiple testing.'],
       ['Effect size','The difference in means in the response units, reported with a confidence interval.']],
 steps:[{h:'Worked two-sample test', b:'Group 1: n₁ = 40, x̄₁ = 76, s₁ = 10. Group 2: n₂ = 45, x̄₂ = 71, s₂ = 12.<br>Difference = 5. SE = √(100/40 + 144/45) = √(2.5 + 3.2) = √5.7 = 2.387.<br>t = 5/2.387 = 2.095. With df ≈ 82, two-sided p ≈ 0.039 &lt; 0.05, so reject H₀.<br>95% CI for μ₁ − μ₂: 5 ± 1.99(2.387) = (0.25, 9.75) — excludes 0, consistent with the test, and shows the difference could plausibly be as small as a quarter of a mark.'},
        {h:'In R', b:'<code>t.test(score ~ group, data = d)</code> for two groups; <code>summary(aov(score ~ group, data = d))</code> for three or more.'}],
 mistakes:['Using a paired test for independent groups, or vice versa.','Running all pairwise t-tests after an ANOVA without adjustment.','Reporting significance without the size of the difference.'],
 keyf:['tsample'],
 checks:[{q:'A two-sample t-test gives p = 0.21 with a 95% CI for μ₁ − μ₂ of (−1.8, 7.9). Write the conclusion.',
   a:'Fail to reject H₀: there is insufficient evidence of a difference in population means at the 5% level. The interval contains 0, consistent with the test, but it also extends to 7.9 — the data are compatible with a difference of up to about 8 units, so this is not evidence that the means are equal.'}]},

'cc-inference':{t:'C → C inference', area:'relinf', w:12,
 simple:'Both variables categorical: build a two-way table and check whether the observed counts stray from what independence predicts.',
 formal:'For two categorical variables the chi-square test of independence compares observed counts O with expected counts E computed under H₀ that the variables are independent: E = (row total × column total)/grand total. The statistic is χ² = Σ(O − E)²/E with df = (r − 1)(c − 1), where r and c are the numbers of rows and columns. Large χ² means the table departs from independence. The test requires a random sample and all expected counts of at least 5 (categories may be collapsed if not). A significant result establishes association only; the direction and size of the association must be described using conditional percentages.',
 defs:[['Expected count','(row total × column total)/n, the count predicted under independence.'],
       ['Degrees of freedom','(r − 1)(c − 1).'],
       ['Chi-square statistic','Σ(O − E)²/E, summed over all cells.']],
 steps:[{h:'Worked chi-square', b:'<table><tr><th></th><th>Uses MoMo</th><th>Does not</th><th>Total</th></tr><tr><th>Urban</th><td>120</td><td>80</td><td>200</td></tr><tr><th>Rural</th><td>60</td><td>140</td><td>200</td></tr><tr><th>Total</th><td>180</td><td>220</td><td>400</td></tr></table>E(Urban, Uses) = 200 × 180/400 = 90; E(Urban, Not) = 110; E(Rural, Uses) = 90; E(Rural, Not) = 110.<br>χ² = (120−90)²/90 + (80−110)²/110 + (60−90)²/90 + (140−110)²/110 = 10 + 8.18 + 10 + 8.18 = 36.36.<br>df = (2−1)(2−1) = 1; p &lt; 0.001, so reject H₀.<br>Describe it: 60% of urban respondents use mobile money versus 30% of rural respondents, a 30 percentage-point gap.'},
        {h:'In R', b:'<code>chisq.test(table(d$residence, d$momo))</code>. Inspect <code>$expected</code> to check the count condition.'}],
 mistakes:['Running chi-square on percentages instead of raw counts.','Ignoring expected counts below 5.','Reporting only χ² and p without the conditional percentages that show the direction.'],
 keyf:['chisq','expcount'],
 checks:[{q:'A 3×4 table gives χ² = 14.2. State the degrees of freedom and what a significant result would mean.',
   a:'df = (3 − 1)(4 − 1) = 6. A significant result means the two categorical variables are associated in the population — the distribution of one differs across levels of the other. It does not say which cells drive the difference; conditional percentages are needed for that.'}]},

'qq-inference':{t:'Q → Q inference', area:'relinf', w:12,
 simple:'Both variables quantitative: fit a line and test whether its slope could plausibly be zero.',
 formal:'For two quantitative variables, the correlation r measures the strength and direction of the linear relationship and the least-squares line ŷ = a + bx summarises it, with b = r(sᵧ/sₓ) and the line passing through (x̄, ȳ). Inference tests H₀: β = 0 (equivalently ρ = 0) using t = b/SE(b) with df = n − 2; the p-value in R\'s regression output tests exactly this. r² is the proportion of variation in y explained by x. Conditions are checked on the residuals: linear form, roughly constant spread across x, approximate normality of residuals, and independent observations. Significance depends heavily on n — with n = 500 an r of 0.10 is significant yet explains only 1% of the variation.',
 defs:[['Least-squares line','The line minimising the sum of squared residuals.'],
       ['Residual','y − ŷ, the vertical distance from a point to the line.'],
       ['r²','Proportion of variability in y explained by the linear relationship with x.'],

'moderation':{t:'Moderation', area:'relinf', w:12,
 simple:'A moderator changes the story. The relationship you found may exist in one group and vanish, or reverse, in another.',
 formal:'Moderation occurs when the strength or direction of the association between an explanatory variable and a response depends on the level of a third variable. It is examined by stratifying: repeat the same bivariate analysis within each level of the moderator and compare the results. If the association holds similarly in every subgroup, there is no moderation. If it differs markedly — present in one group, absent or reversed in another — the moderator is substantively important and must be reported. Moderation is distinct from confounding: a confounder produces a spurious overall association and is controlled to remove distortion, whereas a moderator is a genuine finding about how the relationship varies.',
 defs:[['Moderator','A third variable that changes the X–Y association across its levels.'],
       ['Stratified analysis','Repeating the analysis within each level of the third variable.'],
       ['Interaction','The statistical term for moderation in a regression model.'],
       ['Simpson\'s paradox','The extreme case where the subgroup direction reverses in the combined data.']],
 steps:[{h:'Worked stratification', b:'Overall: income and health rating correlate r = 0.30, p &lt; 0.001.<br>Urban stratum (n = 300): r = 0.42, p &lt; 0.001.<br>Rural stratum (n = 200): r = 0.05, p = 0.48.<br>Conclusion: residence moderates the association — income relates to health among urban respondents but shows no detectable relationship among rural respondents. Report both strata; the overall r of 0.30 conceals this.'},
        {h:'In R', b:'<code>by(d, d$residence, function(x) cor.test(x$income, x$health))</code>, or fit an interaction: <code>lm(health ~ income * residence, data = d)</code>.'}],
 mistakes:['Reporting the pooled result only, hiding a subgroup difference.','Calling a moderator a confounder — different concept, different action.','Comparing strata with very unequal or very small sample sizes without noting the difference in precision.','Concluding moderation from a difference in p-values alone; compare the effect sizes.'],
 keyf:[],
 checks:[{q:'A tutoring programme raises scores by 8 marks for first-year students but 1 mark for final-year students. Is year group a confounder or a moderator?',
   a:'A moderator. It does not create a spurious association — it changes the size of a real effect across its levels. Report the effect separately for each year group rather than a single pooled figure.'}]},

'oral-presentation':{t:'Project oral presentation', area:'proj', w:13,
 simple:'Ten minutes to say what you asked, what you did, what you found and what it means — with the graphs doing the talking.',
 formal:'A statistics project presentation follows the manuscript structure in compressed form: research question and its motivation; the dataset, population and sampling design; the variables with their types and any recoding; univariate distributions of the key variables; the bivariate result with its graph and formal test; the moderation check if performed; and the interpretation with limitations. Each slide should carry one graph and one sentence of interpretation. Numbers must be reported with direction and units, not as bare p-values.',
 defs:[['Structure','Question → data → variables → univariate → bivariate → inference → interpretation → limitations.'],
       ['One idea per slide','Each slide answers a single question the audience is holding.'],
       ['Limitations','Sampling design, missing data, confounding, generalisability.']],
 steps:[{h:'A defensible eight-slide plan', b:'1. Research question and why it matters.<br>2. Dataset, population, sampling design, n.<br>3. Variables: name, type, role, coding.<br>4. Univariate distributions of X and Y.<br>5. Bivariate graph.<br>6. Formal test: statistic, p-value, effect size, CI.<br>7. Moderation check, if any.<br>8. Interpretation and limitations.'},
        {h:'Anticipating the examiner\'s questions', b:'Expect: "Why that test?" (variable types), "What is your n after missing data?" (data management), "Can you claim causation?" (design), "What does that p-value mean?" (probability under H₀).'}],
 mistakes:['Reading dense output tables aloud instead of showing a graph.','Presenting p-values without the direction and size of the effect.','Overclaiming causation from observational project data.','Leaving default R axis labels on presentation graphs.'],

 checks:[{q:'Your bivariate test gives p = 0.002. Write one presentation sentence that reports it properly.',
   a:'"Mean weekly study time was 4.1 hours higher for students living on campus than for those commuting (95% CI: 1.6 to 6.6 hours; two-sample t-test, p = 0.002)." Direction, size, uncertainty, then the test — not the p-value alone.'}]},

'mini-manuscript':{t:'Mini manuscript (Project Assignment 4)', area:'proj', w:14,
 simple:'The written version of the whole project, in the standard sections a journal would expect.',
 formal:'The mini manuscript reports the project in the conventional research structure. Introduction: the topic, the literature motivating it, and the research question with any hypothesis. Methods: sample and sampling design, measures (variables, their coding and any derived variables), and the analysis plan naming each procedure and why the variable types require it. Results: univariate description of each variable, then the bivariate analysis with graph, statistic, p-value and effect size, then any moderation analysis — reporting findings without interpreting them. Discussion: what the findings mean relative to the literature, limitations (design, missing data, confounding, generalisability), and implications. Every number in the Results must be reproducible from the submitted code.',
 defs:[['Methods section','Enough detail for another analyst to reproduce the study exactly.'],
       ['Results section','Findings only — no interpretation, no speculation.'],
       ['Discussion section','Meaning, comparison with prior work, limitations, implications.'],
       ['Reporting standard','Statistic, df, p-value, effect size with confidence interval, in context.']],
 steps:[{h:'Where each project assignment feeds in', b:'PA1 (research question, literature) → Introduction.<br>PA2 (codebook, variables, data management) → Methods.<br>PA3 (univariate and bivariate graphs, inference) → Results.<br>PA4 assembles these and adds the Discussion.'},
        {h:'A results sentence with everything required', b:'"Mobile money use differed by residence: 60.0% of urban respondents versus 30.0% of rural respondents reported using mobile money, χ²(1) = 36.4, p &lt; 0.001, n = 400."'}],
 mistakes:['Interpreting results inside the Results section.','Omitting the number of cases lost to missing data.','Reporting only p-values with no effect sizes or intervals.','Writing causal language for an observational design.'],
 keyf:[],
 checks:[{q:'Which section states "38% of the variation in exam marks was explained by study hours", and which states "this suggests time on task matters, though other factors dominate"?',
   a:'The first is a Results statement — a finding with no interpretation. The second is a Discussion statement — it interprets meaning and acknowledges what is unexplained.'}]},

'exam-map':{t:'Final examination map', area:'ht', w:15,
 simple:'The exam samples the whole course. Work backwards from the four question styles: identify, calculate, interpret, critique.',
 formal:'Final examination preparation should cover the full arc: examining distributions and relationships (Modules 4–5); sampling and study design (6–7); probability, including conditional probability and independence (8–10); random variables and the binomial (11); continuous and normal distributions (11–12); sampling distributions and the Central Limit Theorem (12); inference, estimation and confidence intervals (13–14); hypothesis testing (15); and inference for relationships across the C→Q, C→C and Q→Q cases (16–17), plus moderation. Questions typically take four forms: identify the correct procedure from variable types, carry out a calculation, interpret a result or R output in context, and critique a flawed design or conclusion. The last two carry the most marks and are the least often practised.',

       ['Interpretation questions','Explain what a p-value, interval, slope or r² means in context.'],
       ['Critique questions','Find the flaw in a design, a claim or an interpretation.']],
 steps:[{h:'A revision order that works', b:'1. Variable types and the four cases — they unlock every "which procedure" question.<br>2. Normal calculations and z, used everywhere downstream.<br>3. Sampling distributions and standard errors — the engine of all inference.<br>4. The interpretation sentences for p-value, confidence interval, slope and r², written out and memorised in your own words.<br>5. Probability rules, especially conditional probability with two-way tables.<br>6. Timed mixed practice under exam conditions.'},
        {h:'The five sentences worth memorising', b:'p-value: the probability of data at least this extreme if H₀ were true.<br>Confidence interval: a procedure that captures the parameter in C% of repeated samples.<br>Slope: the expected change in y per one-unit increase in x.<br>r²: the proportion of variation in y explained by the linear relationship with x.<br>Failing to reject H₀: insufficient evidence of an effect, not evidence of no effect.'}],

 wrong:{0:'This reverses the convention — touching bars imply a continuous scale that categorical data does not have.'}},
{id:'d3',a:'desc',lv:2,ty:'num',q:'For the data 3, 6, 6, 8, 9, 10, 22, compute the IQR.',ans:4,tol:0.01,
 why:'Median = 8. Q1 = median of 3, 6, 6 = 6. Q3 = median of 9, 10, 22 = 10. IQR = 10 − 6 = 4.'},
{id:'d4',a:'desc',lv:2,ty:'num',q:'Compute the sample standard deviation of 4, 8, 6, 10, 12. Give your answer to 2 decimal places.',ans:3.16,tol:0.02,
 why:'x̄ = 8; squared deviations 16, 0, 4, 4, 16 sum to 40; s² = 40/4 = 10; s = √10 ≈ 3.16.'},
{id:'d5',a:'desc',lv:2,ty:'mc',q:'Scores are approximately normal with mean 72 and SD 8. Roughly what percentage of scores lie above 88?',
 o:['About 16%','About 5%','About 2.5%','About 0.15%'],c:2,
 why:'88 is two SDs above the mean. The Empirical Rule puts 95% within ±2 SD, leaving 5% split between the two tails, so about 2.5% above.',
 wrong:{0:'16% is the tail beyond one SD, not two.',1:'5% is both tails combined, not the upper tail alone.',3:'0.15% is the tail beyond three SDs.'}},
{id:'d6',a:'desc',lv:3,ty:'mc',q:'Every value in a dataset is increased by 10. What happens to the mean and the standard deviation?',
 o:['Both increase by 10','Mean increases by 10, SD is unchanged','Mean unchanged, SD increases by 10','Both are unchanged'],c:1,
 why:'Shifting every value moves the centre but not the spacing between values, and SD measures spacing.',
 wrong:{0:'The SD depends on deviations from the mean, and those deviations are identical after a shift.',2:'The mean is precisely the quantity a constant shift moves.',3:'The mean clearly moves by the size of the shift.'}},
{id:'d7',a:'desc',lv:2,ty:'tf',q:'A boxplot can reveal whether a distribution is bimodal.',o:['True','False'],c:1,
 why:'A boxplot only shows the five-number summary, so two peaks are invisible. Use a histogram or density plot to judge modality.',
 wrong:{0:'A perfectly symmetric-looking boxplot is entirely compatible with two separated peaks.'}},

{id:'r1',a:'rel',lv:1,ty:'mc',q:'You want to display the relationship between region (4 categories) and monthly income. Which display fits?',
 o:['Scatterplot','Side-by-side boxplots','Segmented bar chart','Histogram of income only'],c:1,
 why:'This is C→Q: side-by-side boxplots put the quantitative response on a common scale for each category.',
 wrong:{0:'A scatterplot needs two quantitative variables.',2:'A segmented bar chart is for two categorical variables.',3:'A single histogram ignores region entirely, so it shows no relationship.'}},
{id:'r2',a:'rel',lv:2,ty:'num',q:'Of 200 urban residents, 60 own a car; of 50 rural residents, 20 do. What percentage of rural residents own a car? (Enter the number only.)',ans:40,tol:0.5,
 why:'Condition on residence: 20/50 = 0.40 = 40%. Raw counts (60 vs 20) mislead because the groups differ in size.'},
{id:'r3',a:'rel',lv:2,ty:'mc',q:'A regression of exam mark on hours studied gives ŷ = 45 + 2.3x with r = 0.62. What does the slope mean?',
 o:['Students who study score 2.3 times better','Each extra hour of study is associated with 2.3 more predicted marks','2.3% of the variation in marks is explained','Studying causes a 2.3-mark improvement'],c:1,
 why:'The slope is the change in predicted y per one-unit increase in x, stated as an association.',
 wrong:{0:'The slope is additive, not multiplicative.',2:'Explained variation is r² = 0.38, i.e. 38%.',3:'The wording claims causation, which a regression on observational data cannot support.'}},
{id:'r4',a:'rel',lv:3,ty:'mc',q:'A fitted line has slope b = 0.8 and the reported correlation is r = −0.55. What should you conclude?',
 o:['The relationship is negative overall','r² = 0.30, so the fit is moderate','One of the two reported values is wrong','The intercept must be negative'],c:2,
 why:'Since b = r(sᵧ/sₓ) and standard deviations are positive, b and r always share a sign. A positive slope with a negative r is impossible.',
 wrong:{0:'The slope says positive, r says negative — you cannot pick one without noticing the contradiction.',1:'Computing r² from an inconsistent r compounds the error rather than resolving it.',3:'The intercept is unrelated to this inconsistency.'}},
{id:'r5',a:'rel',lv:2,ty:'num',q:'A correlation of r = 0.6 is reported. What proportion of the variation in y is explained by the linear relationship with x? (Enter a decimal.)',ans:0.36,tol:0.005,
 why:'r² = 0.6² = 0.36, so 36% of the variation in y is explained.'},

{id:'s1',a:'samp',lv:1,ty:'mc',q:'A researcher interviews the first 100 students who walk past the library. What is the main problem?',
 o:['The sample is too small','Selection bias from a convenience sample','Nonresponse bias','Confounding'],c:1,
 why:'Only students who pass that spot at that time can be selected, so the sample systematically differs from the student body and no valid inference follows.',
 wrong:{0:'n = 100 is not small; increasing it would not remove the bias.',2:'Nonresponse concerns selected people who decline, which is not the issue here.',3:'Confounding concerns a third variable distorting an association, not how the sample was drawn.'}},
{id:'s2',a:'samp',lv:2,ty:'mc',q:'A university divides students by year group and takes a simple random sample within each group. This is:',
 o:['Cluster sampling','Stratified sampling','Systematic sampling','Convenience sampling'],c:1,
 why:'Stratified sampling samples within every group, guaranteeing all year groups are represented and reducing variability when groups differ.',
 wrong:{0:'Cluster sampling would randomly choose whole year groups and survey everyone in them.',2:'Systematic sampling takes every k-th unit from a list after a random start.',3:'This design is deliberately random, not convenient.'}},
{id:'s3',a:'samp',lv:2,ty:'tf',q:'Increasing the sample size reduces bias.',o:['True','False'],c:1,
 why:'A larger sample reduces sampling variability, not bias. A biased method simply produces a more precise estimate of the wrong number.',
 wrong:{0:'This is one of the most common misconceptions in the course — size and bias are separate issues.'}},
{id:'s4',a:'samp',lv:3,ty:'mc',q:'An online poll on a news site collects 50,000 responses. Which statement is correct?',
 o:['The large n makes the estimate reliable','The margin of error will be tiny and therefore trustworthy','Voluntary response makes the estimate biased regardless of n','It is a simple random sample of readers'],c:2,
 why:'Voluntary response attracts people with strong opinions. The bias does not shrink with n, so the tiny margin of error is a precise measurement of a biased quantity.',
 wrong:{0:'Reliability requires an unbiased selection method, not merely a large n.',1:'A small margin of error only describes sampling variability, which is not the problem here.',3:'Readers self-select into the poll; no random selection took place.'}},

{id:'g1',a:'design',lv:1,ty:'mc',q:'Researchers randomly assign volunteers to a new study technique or their usual one, then compare marks. What can they claim?',
 o:['Causation, generalisable to all students','Causation, for people like the volunteers','Association only','Nothing, because volunteers were used'],c:1,
 why:'Random assignment supports a causal claim; the absence of random selection limits generalisation to the kind of people who volunteered.',
 wrong:{0:'Volunteers are not a random sample, so broad generalisation is not justified.',2:'Random assignment does more than establish association — it balances other variables across groups.',3:'The design is still a valid experiment; only its reach is limited.'}},
{id:'g2',a:'design',lv:2,ty:'mc',q:'Coffee drinkers show higher lung cancer rates. Smoking is related to both coffee drinking and lung cancer. Smoking is best described as:',
 o:['A moderator','A confounding variable','A response variable','A random error'],c:1,
 why:'Smoking is associated with both the explanatory and the response variable, so its effect cannot be separated from coffee\'s — the definition of confounding.',
 wrong:{0:'A moderator changes the strength of a real relationship across its levels; here smoking manufactures the apparent relationship.',2:'The response is lung cancer, not smoking.',3:'This is a systematic distortion, not random noise.'}},
{id:'g3',a:'design',lv:2,ty:'sa',q:'In one sentence, state the difference between random selection and random assignment.',
 alts:['selection generalization assignment causation','random selection sample population random assignment treatment groups causal'],
 why:'Random selection is how units enter the sample and supports generalisation to the population. Random assignment is how units are allocated to treatments and supports causal conclusions. A study may have either, both or neither.'},
{id:'g4',a:'design',lv:3,ty:'tf',q:'A double-blind design protects against both the placebo effect and bias in how the response is measured.',o:['True','False'],c:0,
 why:'Blinding the subjects addresses the placebo effect; blinding the assessors addresses measurement bias. Double-blind does both.',
 wrong:{1:'Both protections are exactly what "double" refers to.'}},

{id:'p1',a:'prob',lv:1,ty:'num',q:'A bag holds 4 red, 6 blue and 10 green beads. Find P(not green) as a decimal.',ans:0.5,tol:0.001,
 why:'P(green) = 10/20 = 0.5, so P(not green) = 1 − 0.5 = 0.5 by the complement rule.'},
{id:'p2',a:'prob',lv:1,ty:'mc',q:'A fair coin lands heads five times in a row. What is P(heads) on the next toss?',
 o:['Less than 0.5','0.5','More than 0.5','Cannot be determined'],c:1,
 why:'Tosses are independent, so past results carry no information about the next one. Believing otherwise is the gambler\'s fallacy.',
 wrong:{0:'This is the gambler\'s fallacy — the coin has no memory of previous tosses.',2:'This assumes a "hot streak", which independence rules out for a fair coin.',3:'Independence and fairness fully determine the answer.'}},
{id:'p3',a:'prob',lv:2,ty:'num',q:'P(A) = 0.60, P(B) = 0.45, P(A and B) = 0.25. Find P(A or B).',ans:0.8,tol:0.001,
 why:'General addition rule: 0.60 + 0.45 − 0.25 = 0.80. Omitting the overlap would give an impossible 1.05.'},
{id:'p4',a:'prob',lv:2,ty:'mc',q:'A box has 5 defective and 15 good items. Two are drawn without replacement. P(both defective) is:',
 o:['(5/20)(5/20) = 0.0625','(5/20)(4/19) ≈ 0.0526','(5/20) + (4/19) ≈ 0.461','(5/20)(15/19) ≈ 0.197'],c:1,
 why:'Without replacement the first draw changes the second: 5/20 then 4/19.',
 wrong:{0:'This is the with-replacement answer, which wrongly assumes independence.',2:'Adding gives a probability for "or", not "and", and here exceeds any sensible value.',3:'This is P(defective then good), not both defective.'}},
{id:'p5',a:'prob',lv:2,ty:'num',q:'A fair coin is tossed 3 times. Find P(at least one head) as a decimal to 3 places.',ans:0.875,tol:0.002,
 why:'Use the complement: P(no heads) = (0.5)³ = 0.125, so P(at least one) = 1 − 0.125 = 0.875.'},
{id:'p6',a:'prob',lv:3,ty:'mc',q:'Two events have P(A) = 0.5 and P(B) = 0.3. Which statement is correct?',
 o:['They can be both disjoint and independent','If disjoint, P(A and B) = 0.15','If independent, P(A or B) = 0.65','Disjoint and independent mean the same thing'],c:2,
 why:'If independent, P(A and B) = 0.15, so P(A or B) = 0.5 + 0.3 − 0.15 = 0.65.',
 wrong:{0:'Disjoint requires P(A and B) = 0 while independence requires 0.15 — impossible together for non-zero probabilities.',1:'Disjoint means the intersection is 0, not 0.15.',3:'They are different and, here, incompatible: disjointness is maximum dependence.'}},

{id:'c1',a:'cond',lv:1,ty:'num',q:'In a table, 80 students studied and 70 of them passed. Find P(Passed | Studied) as a decimal.',ans:0.875,tol:0.002,
 why:'Conditioning restricts the sample space to the 80 who studied: 70/80 = 0.875.'},
{id:'c2',a:'cond',lv:2,ty:'mc',q:'85 students passed in total, 70 of whom had studied. P(Studied | Passed) equals:',
 o:['70/80 = 0.875','70/85 ≈ 0.824','85/120 ≈ 0.708','70/120 ≈ 0.583'],c:1,
 why:'The conditioning event is "passed", so the denominator is the 85 who passed.',
 wrong:{0:'That is P(Passed | Studied) — the same cell with the other denominator.',2:'That is the unconditional P(Passed).',3:'That is P(Studied and Passed), the joint probability.'}},
{id:'c3',a:'cond',lv:3,ty:'num',q:'A disease affects 1% of people. A test has P(+|D) = 0.99 and P(+|no D) = 0.05. Find P(D|+) to 3 decimal places.',ans:0.167,tol:0.006,
 why:'P(+) = (0.01)(0.99) + (0.99)(0.05) = 0.0594. Bayes: P(D|+) = 0.0099/0.0594 ≈ 0.167. The low base rate means most positives are false positives.'},
{id:'c4',a:'cond',lv:2,ty:'num',q:'P(A) = 0.4, P(B|A) = 0.3, P(B|Aᶜ) = 0.6. Find P(B).',ans:0.48,tol:0.005,
 why:'Law of total probability: (0.4)(0.3) + (0.6)(0.6) = 0.12 + 0.36 = 0.48.'},
{id:'c5',a:'cond',lv:2,ty:'mc',q:'P(owns smartphone) = 0.8, P(uses mobile money) = 0.6, P(both) = 0.55. The two events are:',
 o:['Independent, since 0.55 is close to 0.48','Dependent, since 0.55 ≠ 0.8 × 0.6','Disjoint','Impossible to assess without more information'],c:1,
 why:'Independence requires P(A and B) = P(A)P(B) = 0.48 exactly. The observed 0.55 is higher, so the events are dependent.',
 wrong:{0:'Independence is an exact numerical condition, not an approximate one.',2:'Disjoint would require P(both) = 0, but 55% do both.',3:'The three probabilities given are exactly what the check requires.'}},
{id:'c6',a:'cond',lv:3,ty:'tf',q:'P(A|B) and P(B|A) are generally equal.',o:['True','False'],c:1,
 why:'They have different denominators, P(B) and P(A), so they are equal only in the special case P(A) = P(B). Confusing them is the base-rate fallacy.',
 wrong:{0:'The medical-testing example shows the two can differ enormously: P(+|D) = 0.99 while P(D|+) ≈ 0.17.'}},

{id:'v1',a:'rv',lv:1,ty:'num',q:'X takes values 1, 2, 3 with probabilities 0.5, 0.3, 0.2. Find E(X).',ans:1.7,tol:0.01,
 why:'E(X) = 1(0.5) + 2(0.3) + 3(0.2) = 0.5 + 0.6 + 0.6 = 1.7.'},
{id:'v2',a:'rv',lv:2,ty:'mc',q:'A game costs GH₵5. Winnings are GH₵0 (p = 0.7), GH₵5 (p = 0.25) or GH₵50 (p = 0.05). What is the expected profit per play?',
 o:['GH₵3.75','−GH₵1.25','GH₵1.25','GH₵0'],c:1,
 why:'E(winnings) = 0(0.7) + 5(0.25) + 50(0.05) = 3.75. Subtract the GH₵5 cost: 3.75 − 5 = −GH₵1.25 per play in the long run.',
 wrong:{0:'That is the expected winnings before subtracting the cost of playing.',2:'The sign is wrong — the player loses on average.',3:'A fair game would need expected winnings of exactly GH₵5.'}},
{id:'v3',a:'rv',lv:2,ty:'num',q:'X ~ B(10, 0.7). Find P(X = 8) to 3 decimal places.',ans:0.233,tol:0.006,
 why:'C(10,8) = 45; P = 45(0.7)⁸(0.3)² = 45(0.05765)(0.09) ≈ 0.2335.'},
{id:'v4',a:'rv',lv:2,ty:'num',q:'X ~ B(10, 0.7). Find the standard deviation to 2 decimal places.',ans:1.45,tol:0.03,
 why:'σ = √(np(1 − p)) = √(10 × 0.7 × 0.3) = √2.1 ≈ 1.449.'},
{id:'v5',a:'rv',lv:3,ty:'mc',q:'Which situation does NOT satisfy the binomial conditions?',
 o:['Tossing a fair coin 20 times and counting heads','Drawing 15 cards without replacement from a 52-card deck and counting hearts','Asking 50 randomly chosen adults from a city of 2 million whether they own a car','Testing 30 independently produced items with a constant 4% defect rate'],c:1,
 why:'Fifteen cards from 52 is nearly 29% of the population, so removing cards changes the success probability substantially between trials. Independence fails and the 10% condition is violated.',
 wrong:{0:'Coin tosses are the textbook binomial: fixed n, binary, independent, constant p.',2:'50 of 2 million is far below 10%, so approximate independence holds.',3:'Independent items with a constant defect rate satisfy all four conditions.'}},
{id:'v6',a:'rv',lv:3,ty:'mc',q:'In R, which computes P(X ≥ 8) for X ~ B(10, 0.7)?',
 o:['pbinom(8, 10, 0.7)','1 - pbinom(8, 10, 0.7)','1 - pbinom(7, 10, 0.7)','dbinom(8, 10, 0.7)'],c:2,
 why:'pbinom(q, …) gives P(X ≤ q). P(X ≥ 8) = 1 − P(X ≤ 7) = 1 - pbinom(7, 10, 0.7).',
 wrong:{0:'That is P(X ≤ 8), the opposite tail plus the boundary.',1:'That is P(X ≥ 9) — it wrongly excludes the value 8.',3:'dbinom gives P(X = 8) exactly, not the upper tail.'}},

{id:'n1',a:'norm',lv:1,ty:'num',q:'X ~ N(72, 8). Find the z-score for x = 85, to 3 decimal places.',ans:1.625,tol:0.005,
 why:'z = (85 − 72)/8 = 13/8 = 1.625.'},
{id:'n2',a:'norm',lv:2,ty:'mc',q:'Weights are N(70, 10) kg. What proportion of the population is below 55 kg?',
 o:['About 6.7%','About 15.9%','About 2.3%','About 93.3%'],c:0,
 why:'z = (55 − 70)/10 = −1.5, and P(Z < −1.5) ≈ 0.0668, about 6.7%.',
 wrong:{1:'15.9% corresponds to z = −1.',2:'2.3% corresponds to z = −2.',3:'93.3% is the area above 55 kg, not below.'}},
{id:'n3',a:'norm',lv:2,ty:'num',q:'For N(500, 100), find the score exceeded by only 5% of the population.',ans:664.5,tol:3,
 why:'The 95th percentile has z = 1.645, so x = 500 + 1.645(100) = 664.5. In R: qnorm(0.95, 500, 100).'},
{id:'n4',a:'norm',lv:3,ty:'mc',q:'A student computes z = 1.28 for a "top 10%" cut-off on N(72, 8) and answers "1.28". What is the error?',
 o:['The z-score is wrong','The answer must be converted back with x = μ + zσ','The 90th percentile has z = 1.645','Nothing is wrong'],c:1,
 why:'z = 1.28 is correct for the 90th percentile, but the question asks for a score. x = 72 + 1.28(8) = 82.24.',
 wrong:{0:'z ≈ 1.2816 is the right critical value for the 90th percentile.',2:'1.645 is the 95th percentile, not the 90th.',3:'Reporting a z-score where a score in marks was requested is a real error.'}},
{id:'n5',a:'norm',lv:2,ty:'tf',q:'For a continuous random variable, P(X = 5) = 0.',o:['True','False'],c:0,
 why:'A single point has zero width and therefore encloses zero area under the density, so it carries zero probability. This is why P(X < 5) = P(X ≤ 5) for continuous variables.',
 wrong:{1:'Non-zero probability at a point is a property of discrete variables only.'}},

{id:'sd1',a:'sdist',lv:1,ty:'num',q:'A population has σ = 15. For samples of size n = 25, what is the standard error of x̄?',ans:3,tol:0.01,
 why:'SE = σ/√n = 15/√25 = 15/5 = 3.'},
{id:'sd2',a:'sdist',lv:2,ty:'mc',q:'σ = 20 and n = 64. What sample size would halve the standard error?',
 o:['n = 128','n = 256','n = 32','n = 512'],c:1,
 why:'SE ∝ 1/√n, so halving SE requires quadrupling n: 64 × 4 = 256.',
 wrong:{0:'Doubling n divides SE by √2 ≈ 1.41, not 2.',2:'Halving n increases SE.',3:'That would divide SE by √8 ≈ 2.83 — more than needed.'}},
{id:'sd3',a:'sdist',lv:2,ty:'mc',q:'A population is strongly right-skewed. According to the Central Limit Theorem, for n = 50 which is approximately normal?',
 o:['The population distribution','The distribution of the sample data','The sampling distribution of x̄','All of the above'],c:2,
 why:'The CLT is a statement about the sampling distribution of the statistic. The population and the individual sample both retain the skew.',
 wrong:{0:'The population is fixed and unaffected by sampling.',1:'A sample of 50 values from a skewed population still looks skewed in a histogram.',3:'Only the sampling distribution of the mean becomes approximately normal.'}},
{id:'sd4',a:'sdist',lv:3,ty:'num',q:'μ = 60, σ = 15, n = 25. Find P(x̄ > 66) to 3 decimal places.',ans:0.023,tol:0.005,
 why:'SE = 3, so z = (66 − 60)/3 = 2 and P(Z > 2) ≈ 0.0228. Note the same question about a single observation would give z = 0.4 and p ≈ 0.34.'},

{id:'e1',a:'est',lv:1,ty:'mc',q:'A 95% confidence interval for mean study hours is (11.2, 14.8). Which interpretation is correct?',
 o:['95% of students study between 11.2 and 14.8 hours','There is a 95% probability that μ lies in this interval','If we repeated this procedure many times, 95% of the intervals produced would contain μ','95% of sample means fall between 11.2 and 14.8'],c:2,
 why:'The confidence level describes the long-run performance of the procedure, not a probability attached to one computed interval or to individuals.',
 wrong:{0:'The interval estimates the population mean, not the spread of individual students.',1:'μ is a fixed constant — it is either in this interval or not; the randomness lies in the interval.',3:'The interval is about the parameter, not about where future sample means land.'}},
{id:'e2',a:'est',lv:2,ty:'num',q:'A 95% CI for a proportion is (0.530, 0.610). What is the margin of error?',ans:0.04,tol:0.002,
 why:'Margin = half the width = (0.610 − 0.530)/2 = 0.040. The point estimate is the midpoint, 0.570.'},
{id:'e3',a:'est',lv:2,ty:'num',q:'n = 600 with p̂ = 0.57. Compute the 95% margin of error, to 3 decimal places.',ans:0.04,tol:0.004,
 why:'SE = √(0.57 × 0.43/600) = 0.0202; margin = 1.96 × 0.0202 ≈ 0.0396.'},
{id:'e4',a:'est',lv:2,ty:'mc',q:'Moving from 95% to 99% confidence, with everything else unchanged:',
 o:['The interval gets narrower','The interval gets wider','The interval is unchanged','The point estimate moves'],c:1,
 why:'The critical value rises from 1.96 to 2.576, enlarging the margin of error. Higher confidence costs precision.',
 wrong:{0:'Narrower intervals come from more data, not more confidence.',2:'The critical value changes, so the width must change.',3:'The point estimate depends only on the data, not the confidence level.'}},
{id:'e5',a:'est',lv:3,ty:'mc',q:'A poll of 1,067 puts Candidate A at 52% and B at 48%, margin of error ±3%. What is the right conclusion?',
 o:['A is clearly ahead','The race is statistically too close to call','B is ahead once the margin is applied','The poll is invalid'],c:1,
 why:'A\'s interval is (49%, 55%) and contains 50%, and the two intervals overlap. A 4-point lead with a ±3-point margin does not establish a lead.',
 wrong:{0:'The lead is smaller than roughly twice the margin of error, so it is within sampling noise.',2:'Nothing in the data puts B ahead; the point estimate favours A.',3:'The poll is fine — it is the confident headline that is unjustified.'}},
{id:'e6',a:'est',lv:3,ty:'num',q:'What sample size is needed for a 95% margin of error of 3 percentage points, using the conservative p̂ = 0.5? Round up to the nearest whole number.',ans:1068,tol:6,
 why:'n ≥ 0.25(1.96/0.03)² = 0.25 × 4268.4 ≈ 1067.1, so 1,068 respondents.'},

{id:'h1',a:'ht',lv:1,ty:'mc',q:'A test gives p = 0.03 at α = 0.05. What is the correct interpretation of the p-value?',
 o:['There is a 3% chance H₀ is true','If H₀ were true, there is a 3% chance of a result at least this extreme','The effect is 3% in size','There is a 97% chance Hₐ is true'],c:1,
 why:'A p-value is computed assuming H₀ is true, and measures how extreme the observed data would be under that assumption.',
 wrong:{0:'The p-value is not the probability of a hypothesis; that requires a Bayesian framework.',2:'A p-value says nothing about effect size.',3:'It gives no direct probability for the alternative either.'}},
{id:'h2',a:'ht',lv:1,ty:'mc',q:'A test yields p = 0.42. The correct conclusion is:',
 o:['Accept H₀; there is no effect','Reject H₀','Fail to reject H₀; insufficient evidence of an effect','The study was badly designed'],c:2,
 why:'Absence of evidence is not evidence of absence. The data are consistent with H₀ but do not confirm it.',
 wrong:{0:'"Accept H₀" overstates what a non-significant result shows — the effect may exist but be undetected.',1:'p = 0.42 is far above any conventional α.',3:'A large p-value says nothing about design quality.'}},
{id:'h3',a:'ht',lv:2,ty:'num',q:'n = 200, 116 successes, H₀: p = 0.5. Compute the z test statistic to 2 decimal places.',ans:2.26,tol:0.06,
 why:'p̂ = 0.58; SE₀ = √(0.5 × 0.5/200) = 0.03536; z = (0.58 − 0.5)/0.03536 ≈ 2.26. Note the standard error uses p₀ = 0.5, not p̂.'},
{id:'h4',a:'ht',lv:2,ty:'mc',q:'In the test above, what changes if the alternative is two-sided rather than one-sided?',
 o:['The test statistic doubles','The p-value doubles','Nothing changes','The significance level doubles'],c:1,
 why:'A two-sided test counts both tails, so the p-value goes from 0.0118 to 0.0236. The statistic and α are unchanged.',
 wrong:{0:'z depends only on the data and the null value.',2:'The area counted as "at least as extreme" genuinely changes.',3:'α is chosen by the analyst before the test, not by the sidedness.'}},
{id:'h5',a:'ht',lv:3,ty:'mc',q:'A study with n = 20,000 finds a statistically significant 0.4-mark difference between two teaching methods. The main concern is:',
 o:['A Type I error is certain','Statistical significance without practical significance','The sample is too small','The p-value must be wrong'],c:1,
 why:'Very large samples make tiny effects detectable. Report the effect size and confidence interval so readers can judge whether 0.4 marks matters.',
 wrong:{0:'A Type I error is possible in any test, but nothing here makes it certain.',2:'n = 20,000 is very large.',3:'The p-value is likely correct; it is the interpretation that needs care.'}},
{id:'h6',a:'ht',lv:3,ty:'mc',q:'Which pair correctly matches the errors?',
 o:['Type I: failing to detect a real effect; Type II: false alarm','Type I: rejecting a true H₀; Type II: failing to reject a false H₀','Type I: bias; Type II: variability','Type I and Type II are the same at α = 0.05'],c:1,
 why:'Type I is the false positive with probability α; Type II is the false negative with probability β, and power = 1 − β.',
 wrong:{0:'The two descriptions are swapped.',2:'Bias and variability are sampling concepts, not test errors.',3:'They are distinct errors with different probabilities.'}},
{id:'h7',a:'ht',lv:2,ty:'tf',q:'Increasing the sample size increases the power of a test.',o:['True','False'],c:0,
 why:'Larger n reduces the standard error, so a real effect of a given size is more likely to be detected. Power also rises with effect size and with a larger α.',
 wrong:{1:'Power depends directly on n through the standard error.'}},

{id:'i1',a:'relinf',lv:1,ty:'mc',q:'You compare mean sleep hours across five academic programmes. Which procedure applies?',
 o:['Chi-square test','Two-sample t-test','ANOVA','Correlation test'],c:2,
 why:'Categorical explanatory with five levels and a quantitative response is C→Q with more than two groups: one-way ANOVA, H₀ that all five means are equal.',
 wrong:{0:'Chi-square applies when both variables are categorical.',1:'A two-sample t handles exactly two groups.',3:'Correlation needs two quantitative variables.'}},
{id:'i2',a:'relinf',lv:2,ty:'num',q:'In a 2×2 table, row total = 200, column total = 180, grand total = 400. Find the expected count for that cell.',ans:90,tol:0.5,
 why:'E = (row × column)/n = (200 × 180)/400 = 90.'},
{id:'i3',a:'relinf',lv:2,ty:'num',q:'A chi-square test uses a 3×4 table. State the degrees of freedom.',ans:6,tol:0.01,
 why:'df = (r − 1)(c − 1) = (3 − 1)(4 − 1) = 6.'},
{id:'i4',a:'relinf',lv:2,ty:'mc',q:'A 95% CI for μ₁ − μ₂ is (−1.8, 7.9) with p = 0.21. Which conclusion is right?',
 o:['Group 1 is significantly higher','No difference exists','Insufficient evidence of a difference; a difference up to about 8 units remains plausible','The test was run incorrectly'],c:2,
 why:'The interval contains 0, matching the non-significant p-value, but it is wide — the data cannot rule out a substantial difference.',
 wrong:{0:'The interval crosses zero, so the direction is not established.',1:'Failing to detect a difference is not proof that none exists.',3:'The interval and p-value are perfectly consistent with each other.'}},
{id:'i5',a:'relinf',lv:3,ty:'mc',q:'n = 300, r = 0.15, p = 0.009. The best summary is:',
 o:['A strong, significant relationship','A statistically significant but very weak relationship (r² ≈ 2%)','No relationship','A causal relationship'],c:1,
 why:'Significance says the correlation is unlikely to be 0 in the population; r² = 0.0225 says it explains about 2% of the variation, which is negligible for prediction.',
 wrong:{0:'r = 0.15 is weak by any conventional standard.',2:'p = 0.009 provides evidence that the population correlation is not zero.',3:'Correlational data cannot establish causation.'}},
{id:'i6',a:'relinf',lv:3,ty:'mc',q:'Overall r = 0.30 (p < 0.001); among urban respondents r = 0.42 (p < 0.001); among rural respondents r = 0.05 (p = 0.48). This pattern shows:',
 o:['Confounding by residence','Moderation by residence','A Type I error','A coding error'],c:1,
 why:'The association exists in one subgroup and not the other, so residence changes the strength of a real relationship — the definition of moderation.',
 wrong:{0:'A confounder would create a spurious overall association that disappears in every subgroup, not one that strengthens in one.',2:'A Type I error is a possibility in any test but does not explain the systematic subgroup pattern.',3:'Nothing indicates a coding problem.'}},
{id:'i7',a:'relinf',lv:2,ty:'tf',q:'A significant chi-square test tells you which cells of the table are responsible for the association.',o:['True','False'],c:1,
 why:'The test gives one overall statistic. To say where and how large the difference is, report conditional percentages (or examine standardised residuals).',
 wrong:{0:'χ² aggregates across all cells, so it cannot localise the effect by itself.'}},

{id:'rp1',a:'rprog',lv:1,ty:'mc',q:'Which R function computes P(X ≤ 55) for X ~ N(70, 10)?',
 o:['dnorm(55, 70, 10)','pnorm(55, 70, 10)','qnorm(55, 70, 10)','rnorm(55, 70, 10)'],c:1,
 why:'p-functions give cumulative probability, the area to the left.',
 wrong:{0:'dnorm gives the density height at a point, not an area.',2:'qnorm converts a probability into a value — the inverse problem.',3:'rnorm generates random values from the distribution.'}},
{id:'rp2',a:'rprog',lv:2,ty:'mc',q:'What does hist(d$income, breaks = 20) change compared with hist(d$income)?',
 o:['It plots 20 observations','It suggests about 20 bins, changing the resolution','It sets the y-axis maximum to 20','It removes 20 outliers'],c:1,
 why:'breaks is a suggestion for the number of bins. More bins reveal finer structure but can look noisy; fewer bins can hide a second peak.',
 wrong:{0:'All observations are always plotted.',2:'Axis limits are controlled by ylim.',3:'R never silently deletes data points.'}},
{id:'rp3',a:'rprog',lv:2,ty:'mc',q:'mean(d$age) returns NA. What is the most likely cause and fix?',
 o:['The column is empty; reload the data','Missing values are present; use mean(d$age, na.rm = TRUE)','age is a factor; use as.numeric()','R needs a package installed'],c:1,
 why:'Any NA in a vector propagates through mean() unless na.rm = TRUE is set. Also confirm that missing-data codes such as 99 were converted to NA.',
 wrong:{0:'An empty column would give NaN or an error about zero length, not a plain NA.',2:'A factor would raise a warning about arguments not being numeric.',3:'mean() is in base R and requires no package.'}},
{id:'rp4',a:'rprog',lv:3,ty:'mc',q:'Which line correctly recodes 99 to missing in a numeric age column?',
 o:['d$age == 99 <- NA','d$age[d$age == 99] <- NA','d$age <- NA[99]','na.rm(d$age, 99)'],c:1,
 why:'Logical subsetting selects the offending elements and assigns NA to them only.',
 wrong:{0:'You cannot assign to the result of a comparison; this is a syntax error.',2:'This replaces the whole column with an NA subscript, destroying the data.',3:'na.rm is an argument to functions, not a function itself.'}},
{id:'rp5',a:'rprog',lv:2,ty:'mc',q:'In an RMarkdown file, what does echo = FALSE do in a chunk header?',
 o:['Hides the output but shows the code','Shows the output but hides the code','Prevents the chunk from running','Hides both code and output'],c:1,
 why:'echo controls whether the code is printed. Use echo = FALSE for a report where the reader wants results, not code.',
 wrong:{0:'That is roughly results = "hide".',2:'That is eval = FALSE.',3:'That is include = FALSE.'}},
{id:'rp6',a:'rprog',lv:2,ty:'mc',q:'Which command produces side-by-side boxplots of income by region?',
 o:['boxplot(d$income, d$region)','boxplot(income ~ region, data = d)','plot(d$income, d$region)','hist(income ~ region, data = d)'],c:1,
 why:'The formula interface response ~ explanatory splits the quantitative response by the categorical variable.',
 wrong:{0:'This draws two separate boxplots side by side, one of income and one of the region codes.',2:'plot() with two arguments makes a scatterplot, which is wrong for a categorical x.',3:'hist() does not accept a formula for grouping in base R.'}}
];

/* ================= FLASHCARDS ================= */
const CARDS = [
{id:'f1',a:'desc',cat:'Definition',f:'Parameter vs statistic',b:'Parameter describes the <b>population</b> (μ, σ, p) and is usually unknown. Statistic is computed from the <b>sample</b> (x̄, s, p̂) and varies from sample to sample.'},
{id:'f2',a:'desc',cat:'Distinction',f:'Categorical vs quantitative variable',b:'Categorical: values are group labels; summarise with counts and percentages. Quantitative: values are numbers where arithmetic makes sense; summarise with centre and spread. Numeric codes for categories are still categorical.'},
{id:'f3',a:'desc',cat:'Concept',f:'Four features to describe a quantitative distribution',b:'Shape (symmetric / skewed, modality), centre (mean or median), spread (SD or IQR), and outliers — always stated with context and units.'},
{id:'f4',a:'desc',cat:'Distinction',f:'Resistant vs non-resistant measures',b:'Resistant: median, IQR — barely moved by extreme values. Non-resistant: mean, SD, range — pulled by outliers. Skewed data → median + IQR.'},
{id:'f5',a:'desc',cat:'Formula',f:'1.5 × IQR rule',b:'Suspected outlier if below Q1 − 1.5·IQR or above Q3 + 1.5·IQR. Example: Q1 = 5, Q3 = 15 → fences −10 and 30.'},
{id:'f6',a:'desc',cat:'Formula',f:'Sample standard deviation',b:'s = √[ Σ(xᵢ − x̄)² / (n − 1) ]. Divide by n − 1 for a sample (degrees of freedom), and take the square root to return to original units.'},
{id:'f7',a:'desc',cat:'Rule',f:'Empirical Rule (68–95–99.7)',b:'For approximately normal data: ≈68% within μ ± σ, ≈95% within μ ± 2σ, ≈99.7% within μ ± 3σ. Requires approximate normality — never use on skewed data.'},
{id:'f8',a:'desc',cat:'Mistake',f:'Common mistake: histogram vs bar chart',b:'Histogram bars touch (continuous scale); bar chart bars are separated (distinct categories). Drawing either the wrong way loses marks.'},
{id:'f9',a:'rel',cat:'Concept',f:'The four bivariate cases',b:'C→Q: side-by-side boxplots, compare means. C→C: two-way table with conditional percentages. Q→Q: scatterplot, r, regression. Q→C: usually re-expressed as C→Q.'},
{id:'f10',a:'rel',cat:'Definition',f:'Correlation r',b:'Measures strength and direction of a <b>linear</b> relationship between two quantitative variables. −1 ≤ r ≤ 1. Unitless, and unchanged if you swap x and y.'},
{id:'f11',a:'rel',cat:'Definition',f:'r² (coefficient of determination)',b:'The proportion of variation in y explained by the linear relationship with x. r = 0.62 → r² = 0.38, so 38% explained. Not the fraction of points on the line.'},
{id:'f12',a:'rel',cat:'Formula',f:'Regression slope',b:'b = r(sᵧ/sₓ), and the line passes through (x̄, ȳ). Interpretation: a one-unit increase in x is associated with a change of b units in predicted y.'},
{id:'f13',a:'rel',cat:'Mistake',f:'Common mistake: conditional percentages',b:'For C→C, percent <b>within</b> the explanatory categories, never out of the grand total. Group sizes otherwise drive the comparison.'},
{id:'f14',a:'samp',cat:'Distinction',f:'Bias vs sampling variability',b:'Bias is a systematic tendency to miss in one direction and does not shrink with n. Variability is random scatter and shrinks as √n grows. A big biased sample is precisely wrong.'},
{id:'f15',a:'samp',cat:'Distinction',f:'Stratified vs cluster sampling',b:'Stratified: split into homogeneous groups and sample <b>within every</b> group (improves precision). Cluster: randomly select <b>whole</b> groups and measure everyone inside (cheaper, less precise).'},
{id:'f16',a:'samp',cat:'Definition',f:'Undercoverage, nonresponse, response bias',b:'Undercoverage: part of the population cannot be selected. Nonresponse: selected units do not answer. Response bias: wording or interviewer distorts the answers given.'},
{id:'f17',a:'design',cat:'Distinction',f:'Observational study vs experiment',b:'Observational: variables are recorded as found → association only. Experiment: the researcher assigns the treatment → causal claims possible.'},
{id:'f18',a:'design',cat:'Distinction',f:'Random selection vs random assignment',b:'Random <b>selection</b> → generalisation to the population. Random <b>assignment</b> → causal conclusions. Independent ideas; a study may have either, both or neither.'},
{id:'f19',a:'design',cat:'Definition',f:'Confounding variable',q:'',b:'A variable related to both the explanatory and the response variable, so their effects cannot be separated. Example: smoking confounds the coffee–lung cancer association.'},
{id:'f20',a:'design',cat:'Concept',f:'Principles of experimental design',b:'Control (comparison group, constant conditions), randomisation, replication (enough units), and blinding (single or double) against placebo and assessor bias.'},
{id:'f21',a:'prob',cat:'Rule',f:'Complement rule',b:'P(Aᶜ) = 1 − P(A). "At least one" → 1 − P(none). Example: 1 − (0.5)³ = 0.875 for at least one head in three tosses.'},
{id:'f22',a:'prob',cat:'Rule',f:'General addition rule',b:'P(A or B) = P(A) + P(B) − P(A and B). Drop the last term only when the events are disjoint.'},
{id:'f23',a:'prob',cat:'Rule',f:'General multiplication rule',b:'P(A and B) = P(A)·P(B|A). Reduces to P(A)·P(B) only when A and B are independent.'},
{id:'f24',a:'prob',cat:'Distinction',f:'Disjoint vs independent',b:'Disjoint: P(A and B) = 0 — they cannot co-occur. Independent: P(A and B) = P(A)P(B). For non-zero probabilities these cannot both hold; disjointness is maximum dependence.'},
{id:'f25',a:'prob',cat:'Mistake',f:'Gambler\'s fallacy',b:'Believing independent trials "self-correct". After five heads, P(heads) is still 0.5 for a fair coin.'},
{id:'f26',a:'cond',cat:'Formula',f:'Conditional probability',b:'P(B|A) = P(A and B)/P(A). Conditioning replaces the denominator with the total of the conditioning event.'},
{id:'f27',a:'cond',cat:'Formula',f:'Law of total probability',b:'P(B) = P(A)P(B|A) + P(Aᶜ)P(B|Aᶜ). Used to get the overall rate from group-specific rates before applying Bayes.'},
{id:'f28',a:'cond',cat:'Formula',f:"Bayes' rule",b:'P(A|B) = P(A)P(B|A)/P(B). Reverses the conditioning. With a rare condition, most positive tests are false positives — the base rate dominates.'},
{id:'f29',a:'cond',cat:'Mistake',f:'Confusing P(A|B) with P(B|A)',b:'The base-rate fallacy. P(+ | disease) = 0.99 can coexist with P(disease | +) ≈ 0.17 when the disease is rare.'},
{id:'f30',a:'cond',cat:'Rule',f:'10% condition',b:'When sampling without replacement, treating draws as independent is acceptable if n ≤ 0.10N. Needed for binomial models and for inference.'},
{id:'f31',a:'rv',cat:'Formula',f:'Expected value of a discrete random variable',b:'E(X) = Σ xᵢ·P(X = xᵢ) — the probability-weighted mean. Need not be an attainable value (a fair die has E(X) = 3.5).'},
{id:'f32',a:'rv',cat:'Rule',f:'BINS: binomial conditions',b:'Binary outcomes, Independent trials, fixed Number of trials n, constant Success probability p. If any fails, the binomial model does not apply.'},
{id:'f33',a:'rv',cat:'Formula',f:'Binomial probability',b:'P(X = k) = C(n,k)·pᵏ·(1−p)ⁿ⁻ᵏ, with C(n,k) = n!/[k!(n−k)!]. Mean np, SD √(np(1−p)).'},
{id:'f34',a:'rv',cat:'R command',f:'Binomial functions in R',b:'dbinom(k, n, p) = P(X = k). pbinom(q, n, p) = P(X ≤ q). P(X ≥ 8) with n = 10 → 1 - pbinom(7, 10, 0.7).'},
{id:'f35',a:'norm',cat:'Formula',f:'z-score',b:'z = (x − μ)/σ — the number of standard deviations from the mean. Inverse: x = μ + zσ.'},
{id:'f36',a:'norm',cat:'Concept',f:'Reading normal tables',b:'Tables give area to the LEFT. P(X > x) = 1 − table value. Between two values: subtract the smaller left area from the larger.'},
{id:'f37',a:'norm',cat:'R command',f:'Normal functions in R',b:'pnorm(x, μ, σ) = area to the left. qnorm(p, μ, σ) = value at percentile p. dnorm = density height. rnorm(n, μ, σ) = random draws.'},
{id:'f38',a:'norm',cat:'Concept',f:'Why P(X = c) = 0 for continuous variables',b:'Probability is area under a density, and a single point has zero width. Hence P(X < c) = P(X ≤ c), unlike the discrete case.'},
{id:'f39',a:'norm',cat:'Critical values',f:'z* for common confidence levels',b:'90% → 1.645, 95% → 1.96, 99% → 2.576. For a one-sided 5% test the cut-off is 1.645; for two-sided 5%, 1.96.'},
{id:'f40',a:'sdist',cat:'Definition',f:'Sampling distribution',b:'The distribution of a statistic across all samples of size n from the same population. Mean of x̄ = μ; SD of x̄ = σ/√n.'},
{id:'f41',a:'sdist',cat:'Formula',f:'Standard error of the mean',b:'SE(x̄) = σ/√n (or s/√n when σ is unknown). Quadrupling n halves the standard error.'},
{id:'f42',a:'sdist',cat:'Concept',f:'Central Limit Theorem',b:'For large n, x̄ is approximately N(μ, σ/√n) whatever the population shape. It describes the <b>sampling distribution</b>, not the data. Rule of thumb n ≥ 30.'},
{id:'f43',a:'sdist',cat:'Formula',f:'Standard error of a proportion',b:'SD(p̂) = √(p(1 − p)/n). Normality needs np ≥ 10 and n(1 − p) ≥ 10.'},
{id:'f44',a:'est',cat:'Formula',f:'Confidence interval structure',b:'estimate ± (critical value)(standard error). Proportion: p̂ ± z*√(p̂(1−p̂)/n). Mean: x̄ ± t*(s/√n), df = n − 1.'},
{id:'f45',a:'est',cat:'Interpretation',f:'What "95% confident" means',b:'If the procedure were repeated on many samples, 95% of the intervals produced would contain the parameter. Not a probability about this one interval, and not about individuals.'},
{id:'f46',a:'est',cat:'Concept',f:'What changes the width of an interval',b:'Wider: higher confidence, more variable data. Narrower: larger n (by √n). The point estimate is unaffected by the confidence level.'},
{id:'f47',a:'est',cat:'Formula',f:'Sample size for a target margin',b:'n ≥ (z*/m)²·p̂(1−p̂); conservatively 0.25(z*/m)². For ±3% at 95%: n ≈ 1,068. Always round up.'},
{id:'f48',a:'ht',cat:'Definition',f:'H₀ and Hₐ',b:'H₀ states no effect, always with equality about a parameter. Hₐ states what you are gathering evidence for, using <, > or ≠. The direction is chosen before seeing the data.'},
{id:'f49',a:'ht',cat:'Interpretation',f:'p-value in one sentence',b:'The probability of observing data at least as extreme as ours <b>if H₀ were true</b>. It is not the probability that H₀ is true.'},
{id:'f50',a:'ht',cat:'Mistake',f:'"Accepting" H₀',b:'A large p-value means <b>fail to reject</b> H₀ — insufficient evidence of an effect. Absence of evidence is not evidence of absence.'},
{id:'f51',a:'ht',cat:'Distinction',f:'Type I vs Type II error',b:'Type I: rejecting a true H₀ (false positive, probability α). Type II: failing to reject a false H₀ (false negative, probability β). Power = 1 − β.'},
{id:'f52',a:'ht',cat:'Formula',f:'One-sample z test for a proportion',b:'z = (p̂ − p₀)/√(p₀(1 − p₀)/n). The standard error uses p₀, not p̂ — a frequent slip.'},
{id:'f53',a:'ht',cat:'Concept',f:'Statistical vs practical significance',b:'A large n makes trivial effects significant. Always report the effect size and confidence interval alongside the p-value.'},
{id:'f54',a:'ht',cat:'Concept',f:'Interval–test duality',b:'A two-sided test at α rejects exactly those null values lying outside the (1 − α) confidence interval.'},
{id:'f55',a:'relinf',cat:'Concept',f:'Choosing the test from variable types',b:'C(2)→Q: two-sample t. C(3+)→Q: ANOVA. C→C: chi-square. Q→Q: t-test on r or the slope. Variable types decide the procedure.'},
{id:'f56',a:'relinf',cat:'Formula',f:'Chi-square test',b:'χ² = Σ(O − E)²/E with df = (r−1)(c−1), E = (row total × column total)/n. Needs raw counts and all expected counts ≥ 5.'},
{id:'f57',a:'relinf',cat:'Formula',f:'Two-sample t statistic',b:'t = (x̄₁ − x̄₂)/√(s₁²/n₁ + s₂²/n₂), H₀: μ₁ = μ₂. Report the difference with a confidence interval, not just p.'},
{id:'f58',a:'relinf',cat:'Distinction',f:'Confounder vs moderator',b:'Confounder: creates or distorts an association; you control for it. Moderator: changes the strength or direction of a real association across its levels; you report it.'},
{id:'f59',a:'relinf',cat:'Mistake',f:'Overlapping confidence intervals',b:'Non-overlapping intervals imply a significant difference, but overlapping intervals do NOT imply no difference. Run the formal two-sample test.'},
{id:'f60',a:'relinf',cat:'Concept',f:'Reporting an inference result',b:'Statistic, degrees of freedom, p-value, effect size with a confidence interval, and the direction — in context. Example: χ²(1) = 36.4, p < 0.001, 60% vs 30%.'},
{id:'f61',a:'rprog',cat:'R command',f:'Basic summaries in R',b:'mean(x), median(x), sd(x), var(x), quantile(x), summary(x), table(x) for categorical, IQR(x). Add na.rm = TRUE when NAs are present.'},
{id:'f62',a:'rprog',cat:'R command',f:'Graphing in base R',b:'hist(x), boxplot(y ~ group, data = d), plot(x, y), barplot(table(x)). Add main =, xlab =, ylab = to every submitted graph.'},
{id:'f63',a:'rprog',cat:'R command',f:'Random sampling and simulation',b:'sample(x, size, replace = TRUE), rnorm(n, μ, σ), rbinom(n, size, prob), replicate(1000, expr), set.seed(123) for reproducibility.'},
{id:'f64',a:'rprog',cat:'R command',f:'Inference functions in R',b:'t.test(x, mu = 45), t.test(y ~ group, data = d), prop.test(x, n), chisq.test(table(a, b)), cor.test(x, y), summary(lm(y ~ x, data = d)).'},
{id:'f65',a:'rprog',cat:'RMarkdown',f:'Chunk options',b:'echo = FALSE hides code, eval = FALSE stops it running, include = FALSE hides everything but still runs, message/warning = FALSE suppress notices, fig.cap adds a caption.'},
{id:'f66',a:'rprog',cat:'Mistake',f:'Why mean() returns NA',b:'A single NA propagates through the calculation. Use mean(x, na.rm = TRUE) — and first check that missing codes such as 99 or 999999 were recoded to NA.'},
{id:'f67',a:'rprog',cat:'R command',f:'Recoding and factors',b:'d$x[d$x == 99] <- NA to set missing; factor(d$sex, levels = c(1,2), labels = c("Male","Female")) to make a labelled categorical variable. Verify with table().'},
{id:'f68',a:'proj',cat:'Definition',f:'Codebook',b:'Documents each variable: name in the data file, the question asked, type, value labels, units, and missing-data codes. A personal codebook covers only your selected and derived variables.'},
{id:'f69',a:'proj',cat:'Concept',f:'A usable research question',b:'Names the population, the explanatory variable, the response variable and their types — which determines whether the analysis is C→Q, C→C or Q→Q.'},
{id:'f70',a:'proj',cat:'Concept',f:'Mini manuscript structure',b:'Introduction (question and literature) → Methods (sample, measures, analysis plan) → Results (findings only) → Discussion (meaning, limitations, implications).'}
];
