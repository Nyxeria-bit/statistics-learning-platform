/* =========================================================================
   PROCEDURAL QUESTION GENERATORS — new numbers and new graphs every round
   ========================================================================= */
function mkOpts(correct,wrongs,f){
  f=f||(v=>String(v));
  const seen=new Set(), list=[];
  const ct=f(correct); seen.add(ct); list.push({t:ct,ok:true});
  wrongs.forEach(w=>{const t=f(w); if(!seen.has(t)){seen.add(t);list.push({t,ok:false});}});
  const sh=shuffle(list).slice(0,4);
  if(!sh.some(x=>x.ok)) sh[0]={t:ct,ok:true};
  return {o:sh.map(x=>x.t),c:sh.findIndex(x=>x.ok)};
}
const p2=v=>fmt(v,3), pc=v=>fmt(v,1)+'%';

const GEN={
/* ---------------- Probability Challenge ---------------- */
'probability':function(lv){
  const type=lv<=1?pick(['basic','complement']):lv===2?pick(['addition','multiplication','empirical']):
             lv===3?pick(['conditional','independence','addition']):pick(['bayes','conditional','total']);
  if(type==='basic'||type==='complement'){
    const r=rint(3,9),b=rint(4,10),g=rint(5,14),tot=r+b+g;
    const comp=type==='complement';
    const ans=comp?(tot-g)/tot:g/tot;
    const O=mkOpts(ans,[g/(tot-g),(tot-g)/g,1-ans,(r+b)/g],p2);
    return {a:'prob',lv,k:'calc',q:`A bag holds ${r} red, ${b} blue and ${g} green beads. One bead is drawn at random. Find P(${comp?'not green':'green'}).`,
      o:O.o,c:O.c,why:`There are ${tot} beads in total. P(green) = ${g}/${tot} = ${p2(g/tot)}${comp?`, so P(not green) = 1 − ${p2(g/tot)} = ${p2(ans)} by the complement rule`:''}.`};
  }
  if(type==='addition'){
    const pa=rint(35,65)/100,pb=rint(30,60)/100,both=rint(10,Math.round(Math.min(pa,pb)*100)-5)/100;
    const ans=pa+pb-both;
    const O=mkOpts(ans,[pa+pb,pa*pb,pa+pb+both],p2);
    return {a:'prob',lv,k:'calc',q:`P(A) = ${pa}, P(B) = ${pb} and P(A and B) = ${both}. Find P(A or B).`,
      o:O.o,c:O.c,why:`General addition rule: ${pa} + ${pb} − ${both} = ${p2(ans)}. The overlap must be subtracted or it is counted twice.`};
  }
  if(type==='multiplication'){
    const d=rint(3,7),good=rint(10,18),tot=d+good;
    const ans=(d/tot)*((d-1)/(tot-1));
    const O=mkOpts(ans,[(d/tot)*(d/tot),(d/tot)+((d-1)/(tot-1)),(d/tot)*(good/(tot-1))],p2);
    return {a:'prob',lv,k:'calc',q:`A box holds ${d} defective and ${good} good items. Two are drawn <b>without replacement</b>. Find P(both defective).`,
      o:O.o,c:O.c,why:`Draws are dependent: (${d}/${tot})(${d-1}/${tot-1}) = ${p2(ans)}. Using ${d}/${tot} twice would assume replacement.`};
  }
  if(type==='empirical'){
    const n=rint(200,600),s=rint(Math.round(n*0.2),Math.round(n*0.7));
    const ans=s/n;
    const O=mkOpts(ans,[n/s,s/(n-s),1-ans],p2);
    return {a:'prob',lv,k:'calc',q:`In ${n} tosses of an irregular pin it lands point-up ${s} times. Give the empirical probability of landing point-up.`,
      o:O.o,c:O.c,why:`Empirical probability = successes/trials = ${s}/${n} = ${p2(ans)}. No classical calculation exists because the outcomes are not equally likely.`};
  }
  if(type==='conditional'||type==='independence'){
    const a=rint(50,90),b=rint(5,25),c=rint(10,30),dd=rint(15,40);
    const rows=[[a,b],[c,dd]], rt=[a+b,c+dd], ct=[a+c,b+dd], tot=a+b+c+dd;
    if(type==='conditional'){
      const ans=a/rt[0];
      const O=mkOpts(ans,[a/ct[0],a/tot,ct[0]/tot],p2);
      return {a:'cond',lv,k:'calc',
        q:`<table><tr><th></th><th>Passed</th><th>Failed</th><th>Total</th></tr><tr><th>Studied</th><td>${a}</td><td>${b}</td><td>${rt[0]}</td></tr><tr><th>Did not study</th><td>${c}</td><td>${dd}</td><td>${rt[1]}</td></tr><tr><th>Total</th><td>${ct[0]}</td><td>${ct[1]}</td><td>${tot}</td></tr></table>Find P(Passed | Studied).`,
        o:O.o,c:O.c,why:`Conditioning on "studied" makes ${rt[0]} the denominator: ${a}/${rt[0]} = ${p2(ans)}. Using ${ct[0]} would answer P(Studied | Passed) instead.`};
    }
    const pA=rt[0]/tot,pB=ct[0]/tot,pAB=a/tot,indep=Math.abs(pAB-pA*pB)<0.005;
    return {a:'cond',lv,k:'concept',
      q:`<table><tr><th></th><th>Passed</th><th>Failed</th></tr><tr><th>Studied</th><td>${a}</td><td>${b}</td></tr><tr><th>Did not</th><td>${c}</td><td>${dd}</td></tr></table>Are "studied" and "passed" independent?`,
      o:['Yes — P(A and B) equals P(A)P(B)','No — P(A and B) differs from P(A)P(B)','Yes — they are disjoint','Cannot be determined from a table'],
      c:indep?0:1,
      why:`P(A and B) = ${p2(pAB)} while P(A)P(B) = ${p2(pA)} × ${p2(pB)} = ${p2(pA*pB)}. They ${indep?'match, so the events are independent':'differ, so the events are dependent'}.`,
      wrong:{2:'Disjoint would mean nobody both studied and passed, which the table contradicts.',3:'A two-way table gives exactly the three probabilities the check requires.'}};
  }
  if(type==='total'){
    const pa=rint(20,60)/100,b1=rint(10,50)/100,b2=rint(30,80)/100;
    const ans=pa*b1+(1-pa)*b2;
    const O=mkOpts(ans,[pa*b1,b1+b2,(b1+b2)/2],p2);
    return {a:'cond',lv,k:'calc',q:`P(A) = ${pa}, P(B|A) = ${b1}, P(B|Aᶜ) = ${b2}. Find P(B).`,
      o:O.o,c:O.c,why:`Law of total probability: (${pa})(${b1}) + (${fmt(1-pa,2)})(${b2}) = ${p2(ans)}. Both branches of the partition must be included.`};
  }
  const prev=pick([0.005,0.01,0.02,0.05]),sens=pick([0.95,0.98,0.99]),fpr=pick([0.03,0.05,0.10]);
  const pPos=prev*sens+(1-prev)*fpr, ans=prev*sens/pPos;
  const O=mkOpts(ans,[sens,1-fpr,prev],p2);
  return {a:'cond',lv,k:'calc',
    q:`A condition affects ${pc(prev*100)} of a population. A test detects it in ${pc(sens*100)} of true cases and returns a positive in ${pc(fpr*100)} of healthy people. A randomly chosen person tests positive. Find P(has the condition | positive).`,
    o:O.o,c:O.c,
    why:`P(+) = (${prev})(${sens}) + (${fmt(1-prev,3)})(${fpr}) = ${p2(pPos)}. Bayes gives ${p2(prev*sens)}/${p2(pPos)} = ${p2(ans)}. The low base rate means most positives are false positives.`};
},
/* ---------------- Guess the Distribution ---------------- */
'guess-dist':function(lv){
  const keys=lv<=1?['normal','right','uniform']:lv===2?['normal','right','left','uniform','bimodal']:
    ['normal','right','left','uniform','bimodal','binomial','sampling'];
  const key=pick(keys), g=POPGEN[key](), d=g.d;
  const labels={normal:'Approximately normal (symmetric, bell-shaped)',right:'Right-skewed',left:'Left-skewed',
    uniform:'Approximately uniform',bimodal:'Bimodal',binomial:'A binomial count distribution',
    sampling:'A sampling distribution of x̄ from a skewed population'};
  const mean=mn(d),med=qtile(d,0.5);
  const sub=lv>=3?pick(['id','centre','measure','symmetry']):pick(['id','measure']);
  const hist=svgHist(d,{bins:key==='binomial'?Math.max(8,g.n):14,xlab:key==='binomial'?'Number of successes':'Value'});
  if(sub==='id'){
    const O=mkOpts(labels[key],shuffle(Object.keys(labels).filter(k=>k!==key)).slice(0,3).map(k=>labels[k]));
    return {a:'desc',lv,k:'interp',pre:hist,q:'Identify the shape of this distribution.',o:O.o,c:O.c,
      why:`Mean = ${fmt(mean,1)}, median = ${fmt(med,1)}. ${key==='normal'?'Mean ≈ median with a single central peak and symmetric tails.':key==='right'?'The mean sits above the median and the tail stretches to the right.':key==='left'?'The mean sits below the median and the tail stretches to the left.':key==='uniform'?'Bar heights are roughly equal across the range.':key==='bimodal'?'Two clear peaks — a single centre would be misleading here.':key==='binomial'?'Counts of successes over a fixed number of trials, so the values are whole numbers with a single peak near np.':'Means of samples from a skewed population: the CLT has made it close to symmetric.'}`};
  }
  if(sub==='centre'){
    const O=mkOpts(fmt(med,1),[fmt(mean,1),fmt(qtile(d,0.25),1),fmt(Math.max(...d),1)]);
    return {a:'desc',lv,k:'calc',pre:hist,q:'Which value is closest to the <b>median</b> of this distribution?',o:O.o,c:O.c,
      why:`Median = ${fmt(med,1)} (mean = ${fmt(mean,1)}). ${Math.abs(mean-med)>0.05*Math.abs(mean||1)?'The gap between them is itself evidence of skew.':'They are close, consistent with a symmetric shape.'}`};
  }
  if(sub==='symmetry'){
    const skewed=key==='right'||key==='left';
    return {a:'desc',lv,k:'interp',pre:hist,q:'Is this distribution approximately symmetric?',
      o:['Yes, approximately symmetric','No, clearly skewed','Impossible to judge from a histogram','Only if the sample is large'],
      c:skewed?1:0,
      why:`Mean = ${fmt(mean,1)}, median = ${fmt(med,1)}. ${skewed?'A substantial gap between them, with one long tail, marks the distribution as skewed.':'Mean and median are close and the tails are comparable, so the shape is roughly symmetric.'}`,
      wrong:{2:'Shape is exactly what a histogram is for.',3:'Sample size affects precision, not whether the displayed shape is symmetric.'}};
  }
  const skewed=key==='right'||key==='left';
  return {a:'desc',lv,k:'interp',pre:hist,q:'Which pair of summaries should you report for this variable?',
    o:['Mean and standard deviation','Median and IQR','Mode and range','Mean and IQR'],c:skewed?1:0,
    why:`${skewed?'The distribution is skewed, so the resistant pair — median and IQR — describes it honestly; the mean is dragged by the tail.':'The distribution is roughly symmetric, so mean and standard deviation are appropriate and use all the data.'}`,
    wrong:{2:'The range depends on only two observations.',3:'Pair mean with SD and median with IQR; mixing them is inconsistent.'}};
},
/* ---------------- Graph Detective ---------------- */
'graph-detective':function(lv){
  const kind=lv<=1?pick(['hist-centre','bar-read']):lv===2?pick(['hist-outlier','box-compare','scatter-dir']):
    pick(['box-compare','scatter-dir','misleading','box-spread']);
  if(kind==='hist-centre'||kind==='hist-outlier'){
    const g=pick([POPGEN.normal,POPGEN.right])(); let d=g.d.slice();
    if(kind==='hist-outlier') d.push(Math.max(...d)*rint(2,3));
    const hist=svgHist(d,{bins:14,xlab:'Monthly income (GH₵)'});
    if(kind==='hist-centre'){
      const O=mkOpts(fmt(qtile(d,0.5),0),[fmt(mn(d)*1.6,0),fmt(qtile(d,0.9),0),fmt(Math.min(...d),0)]);
      return {a:'desc',lv,k:'interp',pre:hist,q:'Which value best describes the centre of this distribution?',o:O.o,c:O.c,
        why:`The median is ${fmt(qtile(d,0.5),0)}; the mean is ${fmt(mn(d),0)}. For a graph like this, quote the value where half the data lies on each side.`};
    }
    const q1=qtile(d,0.25),q3=qtile(d,0.75),f=q3+1.5*(q3-q1),nOut=d.filter(v=>v>f).length;
    return {a:'desc',lv,k:'interp',pre:hist,q:'Does this display show suspected outliers, and how would you confirm it?',
      o:['No — the tail is just skew','Yes — apply the 1.5×IQR rule, and at least one point lies beyond the upper fence','Yes — any bar shorter than the others is an outlier','You cannot check outliers without the raw data'],c:1,
      why:`Q1 = ${fmt(q1,0)}, Q3 = ${fmt(q3,0)}, so the upper fence is ${fmt(f,0)}. ${nOut} observation${nOut===1?'':'s'} lie beyond it. Judging by eye is not enough — apply the rule.`,
      wrong:{0:'Skew and outliers can coexist; the fence decides.',2:'Short bars are simply low-frequency bins.',3:'The five-number summary from the graph is enough to apply the rule.'}};
  }
  if(kind==='box-compare'||kind==='box-spread'){
    const names=shuffle(['Greater Accra','Ashanti','Northern','Volta']).slice(0,3);
    const base=rint(800,1600), gap=rint(150,500);
    const groups=names.map((n,i)=>({n,v:Array.from({length:60},()=>rnorm(base+i*gap,rint(150,400)))}));
    const box=svgBox(groups,{xlab:'Region'});
    const meds=groups.map(g=>qtile(g.v,0.5)), hi=meds.indexOf(Math.max(...meds));
    const sds=groups.map(g=>qtile(g.v,0.75)-qtile(g.v,0.25)), wide=sds.indexOf(Math.max(...sds));
    if(kind==='box-compare'){
      const O=mkOpts(groups[hi].n,groups.filter((g,i)=>i!==hi).map(g=>g.n).concat(['All three are identical']));
      return {a:'rel',lv,k:'interp',pre:box,q:'Which group has the highest median income?',o:O.o,c:O.c,
        why:`Medians: ${groups.map((g,i)=>g.n+' '+fmt(meds[i],0)).join(', ')}. Read the line inside each box, not the whiskers.`};
    }
    const O=mkOpts(groups[wide].n,groups.filter((g,i)=>i!==wide).map(g=>g.n));
    return {a:'rel',lv,k:'interp',pre:box,q:'Which group shows the greatest variability in the middle 50% of its data?',o:O.o,c:O.c,
      why:`IQRs: ${groups.map((g,i)=>g.n+' '+fmt(sds[i],0)).join(', ')}. The IQR is the height of the box, which is what "middle 50%" refers to.`};
  }
  if(kind==='scatter-dir'){
    const n=70,target=pick([-0.85,-0.6,-0.3,0.3,0.6,0.85]);
    const x=Array.from({length:n},()=>rnorm(50,12));
    const y=x.map(v=>target*v+rnorm(0,12*Math.sqrt(1-target*target)/Math.abs(target||1)*Math.abs(target)+8));
    const r=corrOf(x,y);
    const sc=svgScatter(x,y,{xlab:'Hours studied',ylab:'Exam score',line:lv>=3});
    return {a:'rel',lv,k:'interp',pre:sc,q:'Describe the direction and rough strength of this relationship.',
      o:['Positive and moderately strong','Negative and moderately strong','No relationship at all','Positive but curved, so r is meaningless'],
      c:r>0?0:1,
      why:`The computed correlation is r = ${fmt(r,2)} — ${r>0?'positive':'negative'}, ${Math.abs(r)>0.7?'fairly strong':Math.abs(r)>0.4?'moderate':'weak'}. Direction comes first, then form, then strength.`,
      wrong:{2:'A visible slope in the cloud is a relationship.',3:'The form here is linear; r is appropriate.'}};
  }
  const cats=['Brand A','Brand B','Brand C'], vals=[rint(60,64),rint(65,68),rint(69,72)];
  const bad=svgBars(cats,vals,{yzero:false,col:'#b06a12',xlab:'Reported satisfaction (%)'});
  return {a:'desc',lv,k:'interp',pre:bad,q:'This chart makes Brand C look far ahead. What is wrong with it?',
    o:['Nothing — the bars are drawn correctly','The vertical axis does not start at zero, so small differences look large','Bar charts should never be used for percentages','The categories are in the wrong order'],c:1,
    why:`The actual values are ${cats.map((c,i)=>c+' '+vals[i]+'%').join(', ')} — a spread of only ${Math.max(...vals)-Math.min(...vals)} percentage points. Truncating the axis exaggerates it. Bar charts should start at zero.`,
    wrong:{0:'The heights are not proportional to the values, which is the point of a bar chart.',2:'Percentages are a perfectly normal use for bar charts.',3:'Ordering affects readability, not the distortion here.'}};
},
/* ---------------- Normal Distribution Challenge ---------------- */
'normal':function(lv){
  const mu=rint(40,180),sd=rint(5,20);
  const t=lv<=1?pick(['z','left']):lv===2?pick(['left','right','emp']):lv===3?pick(['between','right','pctile']):pick(['pctile','between','emp']);
  if(t==='z'){
    const x=mu+pick([-2,-1.5,-1,1,1.5,2,2.5])*sd;
    const ans=(x-mu)/sd;
    const O=mkOpts(ans,[(mu-x)/sd,(x-mu)/(sd*sd),x-mu],v=>fmt(v,2));
    return {a:'norm',lv,k:'calc',q:`X ~ N(${mu}, ${sd}). Find the z-score for x = ${fmt(x,1)}.`,o:O.o,c:O.c,
      why:`z = (x − μ)/σ = (${fmt(x,1)} − ${mu})/${sd} = ${fmt(ans,2)}. The sign matters: negative means below the mean.`,
      post:svgNormal(mu,sd,[x<mu?-Infinity:x,x<mu?x:Infinity])};
  }
  if(t==='left'||t==='right'){
    const x=mu+rint(-25,25)/10*sd, z=(x-mu)/sd, left=normCDF(z), ans=t==='left'?left:1-left;
    const O=mkOpts(ans,[1-ans,normCDF(-Math.abs(z)),2*(1-normCDF(Math.abs(z)))],p2);
    return {a:'norm',lv,k:'calc',q:`X ~ N(${mu}, ${sd}). Find P(X ${t==='left'?'<':'>'} ${fmt(x,1)}).`,o:O.o,c:O.c,
      why:`z = ${fmt(z,3)}. Tables and pnorm give the area to the left: ${p2(left)}. ${t==='left'?'That is the answer directly.':`For the upper tail subtract from 1: ${p2(ans)}.`} In R: ${t==='left'?`pnorm(${fmt(x,1)}, ${mu}, ${sd})`:`1 - pnorm(${fmt(x,1)}, ${mu}, ${sd})`}.`,
      post:svgNormal(mu,sd,t==='left'?[-Infinity,x]:[x,Infinity])};
  }
  if(t==='between'){
    let a=mu+rint(-25,0)/10*sd, b=mu+rint(1,25)/10*sd;
    const ans=normCDF((b-mu)/sd)-normCDF((a-mu)/sd);
    const O=mkOpts(ans,[normCDF((b-mu)/sd),1-ans,normCDF((a-mu)/sd)],p2);
    return {a:'norm',lv,k:'calc',q:`X ~ N(${mu}, ${sd}). Find P(${fmt(a,1)} < X < ${fmt(b,1)}).`,o:O.o,c:O.c,
      why:`Subtract the two left areas: P(Z < ${fmt((b-mu)/sd,2)}) − P(Z < ${fmt((a-mu)/sd,2)}) = ${p2(normCDF((b-mu)/sd))} − ${p2(normCDF((a-mu)/sd))} = ${p2(ans)}.`,
      post:svgNormal(mu,sd,[a,b])};
  }
  if(t==='pctile'){
    const p=pick([0.05,0.10,0.25,0.75,0.90,0.95,0.975]);
    const z=normInv(p), ans=mu+z*sd;
    const O=mkOpts(ans,[z,mu-z*sd,mu+p*sd],v=>fmt(v,2));
    return {a:'norm',lv,k:'calc',q:`X ~ N(${mu}, ${sd}). Find the value at the ${fmt(p*100,1)}th percentile.`,o:O.o,c:O.c,
      why:`z at that percentile is ${fmt(z,3)}, so x = μ + zσ = ${mu} + ${fmt(z,3)}(${sd}) = ${fmt(ans,2)}. Reporting the z-score instead of x is the usual slip. In R: qnorm(${p}, ${mu}, ${sd}).`,
      post:svgNormal(mu,sd,[-Infinity,ans])};
  }
  const k=pick([1,2,3]), within=[68,95,99.7][k-1];
  const ans=`${fmt(mu-k*sd,1)} to ${fmt(mu+k*sd,1)}`;
  const O=mkOpts(ans,[`${fmt(mu-sd,1)} to ${fmt(mu+sd,1)}`,`${fmt(mu-3*sd,1)} to ${fmt(mu+3*sd,1)}`,`${fmt(mu,1)} to ${fmt(mu+k*sd,1)}`]);
  return {a:'norm',lv,k:'calc',q:`X ~ N(${mu}, ${sd}). By the Empirical Rule, about ${within}% of values lie between which two numbers?`,o:O.o,c:O.c,
    why:`${within}% corresponds to μ ± ${k}σ = ${mu} ± ${k*sd}, i.e. ${ans}. The rule needs approximate normality.`,
    post:svgNormal(mu,sd,[mu-k*sd,mu+k*sd])};
},
/* ---------------- Binomial Battle ---------------- */
'binomial':function(lv){
  const n=rint(8,20), p=pick([0.2,0.25,0.3,0.4,0.5,0.6,0.7,0.8]);
  const t=lv<=1?pick(['identify','exact']):lv===2?pick(['exact','mean']):lv===3?pick(['atmost','atleast','sd']):pick(['atleast','valid','rcode']);
  if(t==='identify'){
    const k=rint(1,n-1);
    const altp=p===0.5?Number((k/n).toFixed(2)):Number((1-p).toFixed(2));
    return {a:'rv',lv,k:'concept',q:`${n} independent patients are treated and each recovers with probability ${p}. You want the chance that exactly ${k} recover. Identify n, p and x.`,
      o:[`n = ${n}, p = ${p}, x = ${k}`,`n = ${k}, p = ${p}, x = ${n}`,`n = ${n}, p = ${fmt(k/n,2)}, x = ${p}`,`n = ${n}, p = ${altp}, x = ${k}`],c:0,
      why:`n is the fixed number of trials (${n}), p is the constant success probability (${p}), and x is the count of successes you are asking about (${k}).`,
      wrong:{1:'n and x have been swapped — x can never exceed n.',2:'p is given in the scenario, not computed from the observed count.',3:`${altp} is ${p===0.5?'the observed proportion, not the stated success probability':'the failure probability'}.`}};
  }
  if(t==='exact'){
    const k=rint(Math.max(1,Math.round(n*p)-2),Math.min(n,Math.round(n*p)+2));
    const ans=binomPMF(k,n,p);
    const O=mkOpts(ans,[Math.pow(p,k)*Math.pow(1-p,n-k),binomCDF(k,n,p),binomPMF(k,n,1-p)],p2);
    return {a:'rv',lv,k:'calc',q:`X ~ B(${n}, ${p}). Find P(X = ${k}).`,o:O.o,c:O.c,
      why:`C(${n},${k}) = ${nchoose(n,k)}, so P = ${nchoose(n,k)} × ${p}^${k} × ${fmt(1-p,2)}^${n-k} = ${p2(ans)}. Dropping the coefficient gives the probability of one specific ordering only. In R: dbinom(${k}, ${n}, ${p}).`};
  }
  if(t==='atmost'||t==='atleast'){
    const k=rint(Math.max(1,Math.round(n*p)-1),Math.min(n-1,Math.round(n*p)+2));
    const ans=t==='atmost'?binomCDF(k,n,p):1-binomCDF(k-1,n,p);
    const O=mkOpts(ans,[t==='atmost'?binomCDF(k-1,n,p):1-binomCDF(k,n,p),binomPMF(k,n,p),1-ans],p2);
    return {a:'rv',lv,k:'calc',q:`X ~ B(${n}, ${p}). Find P(X ${t==='atmost'?'≤':'≥'} ${k}).`,o:O.o,c:O.c,
      why:`${t==='atmost'?`P(X ≤ ${k}) = pbinom(${k}, ${n}, ${p}) = ${p2(ans)}.`:`P(X ≥ ${k}) = 1 − P(X ≤ ${k-1}) = 1 - pbinom(${k-1}, ${n}, ${p}) = ${p2(ans)}. Using pbinom(${k}) instead would give P(X ≥ ${k+1}).`}`};
  }
  if(t==='mean'||t==='sd'){
    const ans=t==='mean'?n*p:Math.sqrt(n*p*(1-p));
    const O=mkOpts(ans,[t==='mean'?n*p*(1-p):n*p*(1-p),t==='mean'?n/p:Math.sqrt(n*p),n*(1-p)],v=>fmt(v,3));
    return {a:'rv',lv,k:'calc',q:`X ~ B(${n}, ${p}). Find the ${t==='mean'?'mean':'standard deviation'}.`,o:O.o,c:O.c,
      why:`${t==='mean'?`μ = np = ${n} × ${p} = ${fmt(ans,3)}.`:`σ = √(np(1−p)) = √(${n} × ${p} × ${fmt(1-p,2)}) = √${fmt(n*p*(1-p),3)} = ${fmt(ans,3)}. Forgetting the square root is the usual error.`}`};
  }
  if(t==='valid'){
    const bad=pick([
      {s:`Drawing ${rint(12,18)} cards from a single 52-card deck without replacement and counting hearts`,ok:false,r:'The draws are a large fraction of a small population, so p changes between trials and independence fails.'},
      {s:`Asking ${rint(40,80)} randomly chosen adults from a city of two million whether they own a car`,ok:true,r:'The sample is far below 10% of the population, so treating the trials as independent is acceptable.'},
      {s:'Counting how many attempts it takes to get the first success',ok:false,r:'The number of trials is not fixed — this is a geometric, not a binomial, situation.'},
      {s:`Testing ${rint(20,40)} independently produced items with a constant defect rate`,ok:true,r:'Binary outcome, independent trials, fixed n and constant p — all four conditions hold.'}]);
    return {a:'rv',lv,k:'concept',q:`Is a binomial model appropriate here?<br><br><i>${bad.s}.</i>`,
      o:['Yes, all four BINS conditions hold','No, at least one condition fails'],c:bad.ok?0:1,
      why:bad.r+' Check Binary, Independent, fixed Number of trials, constant Success probability every time.'};
  }
  const k=rint(2,n-2);
  return {a:'rprog',lv,k:'rcode',q:`Which R command gives P(X ≥ ${k}) for X ~ B(${n}, ${p})?`,
    o:[`pbinom(${k}, ${n}, ${p})`,`1 - pbinom(${k}, ${n}, ${p})`,`1 - pbinom(${k-1}, ${n}, ${p})`,`dbinom(${k}, ${n}, ${p})`],c:2,
    why:`P(X ≥ ${k}) = 1 − P(X ≤ ${k-1}), so the boundary passed to pbinom is ${k-1} = ${p2(1-binomCDF(k-1,n,p))}.`,
    wrong:{0:`That is the lower tail P(X ≤ ${k}).`,1:`That gives P(X ≥ ${k+1}), quietly dropping ${k}.`,3:`That is P(X = ${k}) exactly.`}};
},
/* ---------------- Confidence Interval Challenge ---------------- */
'ci':function(lv){
  const t=lv<=1?pick(['point','moe']):lv===2?pick(['moe','interp','build']):lv===3?pick(['build','effectN','interp']):pick(['effectLevel','effectN','testlink']);
  const lo=rint(300,600)/10, hi=lo+rint(20,90)/10;
  const est=(lo+hi)/2, m=(hi-lo)/2;
  if(t==='point'||t==='moe'){
    const ans=t==='point'?est:m;
    const O=mkOpts(ans,[hi-lo,t==='point'?m:est,lo],v=>fmt(v,2));
    return {a:'est',lv,k:'calc',q:`A 95% confidence interval for the mean is (${fmt(lo,1)}, ${fmt(hi,1)}). What is the ${t==='point'?'point estimate':'margin of error'}?`,
      o:O.o,c:O.c,why:`The point estimate is the midpoint, (${fmt(lo,1)} + ${fmt(hi,1)})/2 = ${fmt(est,2)}, and the margin of error is half the width, ${fmt(m,2)}. The full width ${fmt(hi-lo,2)} is twice the margin.`};
  }
  if(t==='build'){
    const n=pick([100,200,400,600]),succ=Math.round(n*rint(35,65)/100),ph=succ/n;
    const se=Math.sqrt(ph*(1-ph)/n),ans=1.96*se;
    const O=mkOpts(ans,[se,2.576*se,1.645*se],v=>fmt(v,4));
    return {a:'est',lv,k:'calc',q:`In a sample of n = ${n}, ${succ} respondents said yes (p̂ = ${fmt(ph,3)}). Compute the 95% margin of error.`,
      o:O.o,c:O.c,why:`SE = √(${fmt(ph,3)} × ${fmt(1-ph,3)}/${n}) = ${fmt(se,4)}. Margin = 1.96 × ${fmt(se,4)} = ${fmt(ans,4)}, giving the interval (${fmt(ph-ans,3)}, ${fmt(ph+ans,3)}).`};
  }
  if(t==='interp'){
    return {a:'est',lv,k:'interp',q:`A 95% confidence interval for mean weekly study hours is (${fmt(lo,1)}, ${fmt(hi,1)}). Which interpretation is correct?`,
      o:['95% of students study between these two values','There is a 95% probability that μ lies in this particular interval',
         'If the procedure were repeated on many samples, 95% of the intervals produced would contain μ','95% of sample means fall in this range'],c:2,
      why:'The confidence level describes the long-run performance of the method. μ is fixed; it is the interval that varies from sample to sample.',
      wrong:{0:'The interval estimates the population mean, not the spread of individuals.',1:'Once computed, the interval either contains μ or it does not.',3:'The statement is about the parameter, not about future sample means.'}};
  }
  if(t==='effectN'){
    const f=pick([4,9]);
    return {a:'est',lv,k:'concept',q:`Everything else unchanged, the sample size is multiplied by ${f}. What happens to the margin of error?`,
      o:[`It is divided by ${Math.sqrt(f)}`,`It is divided by ${f}`,`It is multiplied by ${Math.sqrt(f)}`,'It is unchanged'],c:0,
      why:`The margin depends on 1/√n, so multiplying n by ${f} divides the margin by √${f} = ${Math.sqrt(f)}. Precision improves with the square root, not with n itself.`,
      wrong:{1:'That would require n to grow by a factor of '+(f*f)+'.',2:'More data narrows the interval.',3:'n appears directly in the standard error.'}};
  }
  if(t==='effectLevel'){
    return {a:'est',lv,k:'concept',q:'Everything else unchanged, you move from 95% to 99% confidence. What happens?',
      o:['The interval narrows','The interval widens because z* rises from 1.96 to 2.576','The point estimate moves','Nothing changes'],c:1,
      why:'Higher confidence needs a bigger critical value, so the interval widens. Confidence and precision trade off against each other.',
      wrong:{0:'Narrower intervals come from more data, not more confidence.',2:'The point estimate depends only on the data.',3:'The critical value changes, so the width must change.'}};
  }
  const nullv=fmt(lo-rint(5,20)/10,1);
  return {a:'est',lv,k:'interp',q:`A 95% confidence interval for μ is (${fmt(lo,1)}, ${fmt(hi,1)}). Would a two-sided test of H₀: μ = ${nullv} be rejected at α = 0.05?`,
    o:['Yes — the value lies outside the interval','No — the value lies inside the interval','Cannot tell without the p-value','Only if the sample is large'],c:0,
    why:`${nullv} is below ${fmt(lo,1)}, so it falls outside the interval. Interval–test duality: exactly the values outside a 95% interval are rejected at α = 0.05 two-sided.`,
    wrong:{1:`${nullv} is smaller than the lower limit ${fmt(lo,1)}.`,2:'The interval already carries that information.',3:'The duality holds whatever the sample size, provided conditions are met.'}};
},
/* ---------------- Correlation Detective ---------------- */
'correlation':function(lv){
  if(lv>=3&&rnd()<0.35){
    const sc=pick([
      {s:'Cities with more police officers report more crimes.',c:'Reverse causation and a lurking variable (city size) are both more plausible than police causing crime.'},
      {s:'Children who eat breakfast score higher on tests.',c:'Household income and parental involvement plausibly cause both.'},
      {s:'Ice cream sales and drowning deaths rise together.',c:'Temperature drives both; neither causes the other.'},
      {s:'Students who own laptops have higher CGPAs.',c:'Family income is associated with both laptop ownership and academic support.'}]);
    return {a:'design',lv,k:'concept',q:`Observational finding: <i>${sc.s}</i> What is the most defensible conclusion?`,
      o:['The first variable causes the second','There is an association; the design cannot establish causation','There is no relationship','The result must be a coding error'],c:1,
      why:sc.c+' With observational data, four explanations compete: cause, reverse cause, confounding and chance.'};
  }
  const target=pick([-0.9,-0.75,-0.5,-0.25,0.05,0.25,0.5,0.75,0.9]);
  const n=70, x=Array.from({length:n},()=>rnorm(0,1));
  const y=x.map(v=>target*v+Math.sqrt(Math.max(0.0001,1-target*target))*rnorm(0,1));
  const r=corrOf(x,y);
  const bucket=v=>{const s=Math.abs(v)<0.15?'about 0 (no linear relationship)':
    Math.abs(v)<0.45?'weak':Math.abs(v)<0.75?'moderate':'strong';
    return Math.abs(v)<0.15?s:`${s} and ${v>0?'positive':'negative'}`;};
  const others=[-0.9,-0.5,0.05,0.5,0.9].map(bucket).filter(b=>b!==bucket(r));
  const O=mkOpts(bucket(r),shuffle(others).slice(0,3));
  return {a:'rel',lv,k:'interp',pre:svgScatter(x.map(v=>50+10*v),y.map(v=>60+9*v),{xlab:'Explanatory',ylab:'Response',line:lv>=3}),
    q:'Estimate the correlation shown in this scatterplot.',o:O.o,c:O.c,
    why:`The actual correlation is r = ${fmt(r,2)} (r² = ${fmt(r*r,2)}, so about ${fmt(100*r*r,0)}% of the variation in y is explained). Judge direction first, then how tightly the cloud hugs a straight line.`};
},
/* ---------------- Regression Challenge ---------------- */
'regression':function(lv){
  const n=60, b=rint(8,32)/10, a=rint(30,55);
  const x=Array.from({length:n},()=>rint(1,14)+rnd());
  const y=x.map(v=>a+b*v+rnorm(0,rint(4,9)));
  const f=lsFit(x,y);
  const sc=svgScatter(x,y,{xlab:'Hours studied',ylab:'Exam mark',line:true});
  const eq=`ŷ = ${fmt(f.a,2)} + ${fmt(f.b,2)}x`;
  const t=lv<=1?pick(['slope','predict']):lv===2?pick(['predict','slopeMeaning']):lv===3?pick(['rsq','intercept','slopeMeaning']):pick(['rsq','extrap','output']);
  const pre=sc+`<div class="formula" style="margin-top:8px"><div class="fx">${eq}</div><div class="small muted" style="font-family:var(--sans)">x = hours studied, y = exam mark, r = ${fmt(f.r,2)}</div></div>`;
  if(t==='slope'){
    const O=mkOpts(fmt(f.b,2),[fmt(f.a,2),fmt(f.r,2),fmt(f.b*10,2)]);
    return {a:'rel',lv,k:'calc',pre,q:'What is the slope of this fitted line?',o:O.o,c:O.c,
      why:`In ŷ = a + bx the slope is the coefficient of x: ${fmt(f.b,2)}. The intercept ${fmt(f.a,2)} is the predicted value when x = 0.`};
  }
  if(t==='predict'||t==='extrap'){
    const xv=t==='predict'?rint(3,11):rint(40,80);
    const ans=f.a+f.b*xv;
    if(t==='extrap'){
      return {a:'rel',lv,k:'interp',pre,q:`Someone uses this line to predict the mark for a student who studies ${xv} hours a week. Is that legitimate?`,
        o:[`Yes — just compute ${fmt(f.a,1)} + ${fmt(f.b,2)}(${xv})`,'No — that is extrapolation far outside the observed range of x','Yes, provided r is significant','No, because the intercept is meaningless'],c:1,
        why:`The observed hours run from about ${fmt(Math.min(...x),1)} to ${fmt(Math.max(...x),1)}. Nothing in the data supports the relationship continuing to ${xv} hours; the arithmetic works but the prediction is unsupported.`,
        wrong:{0:'The arithmetic is easy; the justification is what is missing.',2:'Significance within the data range says nothing about behaviour outside it.',3:'The intercept is a separate issue from extrapolation.'}};
    }
    const O=mkOpts(fmt(ans,1),[fmt(f.b*xv,1),fmt(f.a+xv,1),fmt(ans+10,1)]);
    return {a:'rel',lv,k:'calc',pre,q:`Predict the exam mark for a student who studies ${xv} hours.`,o:O.o,c:O.c,
      why:`ŷ = ${fmt(f.a,2)} + ${fmt(f.b,2)}(${xv}) = ${fmt(ans,1)}. The intercept must be included, and ${xv} lies inside the observed range so the prediction is legitimate.`};
  }
  if(t==='slopeMeaning'){
    return {a:'rel',lv,k:'interp',pre,q:`What does the slope ${fmt(f.b,2)} mean here?`,
      o:[`Each extra hour of study is associated with ${fmt(f.b,2)} more predicted marks`,
         `Students who study score ${fmt(f.b,2)} times better`,
         `${fmt(f.b,2)}% of the variation in marks is explained`,
         `Studying causes a ${fmt(f.b,2)}-mark improvement`],c:0,
      why:`A slope is an additive per-unit change in the predicted response, stated as an association. Explained variation is r² = ${fmt(f.r*f.r,2)}, and observational data cannot support a causal claim.`};
  }
  if(t==='rsq'){
    const O=mkOpts(fmt(f.r*f.r,3),[fmt(f.r,3),fmt(1-f.r*f.r,3),fmt(Math.sqrt(Math.abs(f.r)),3)]);
    return {a:'rel',lv,k:'calc',pre,q:`With r = ${fmt(f.r,2)}, what proportion of the variation in marks is explained by the linear relationship with hours?`,
      o:O.o,c:O.c,why:`r² = (${fmt(f.r,2)})² = ${fmt(f.r*f.r,3)}, i.e. about ${fmt(100*f.r*f.r,0)}%. The remaining ${fmt(100*(1-f.r*f.r),0)}% is variation the line does not account for.`};
  }
  if(t==='intercept'){
    return {a:'rel',lv,k:'interp',pre,q:`How should the intercept ${fmt(f.a,2)} be interpreted?`,
      o:[`The predicted mark for a student who studies 0 hours — meaningful only if 0 is within the observed range`,
         'The average mark in the sample','The change in mark per hour','The strength of the relationship'],c:0,
      why:`The intercept is the fitted value at x = 0. The observed hours start at about ${fmt(Math.min(...x),1)}, so treat it as a mathematical anchor rather than a substantive prediction.`,
      wrong:{1:`The sample mean mark is ${fmt(mn(y),1)}, which is a different quantity.`,2:'That is the slope.',3:'That is r or r².'}};
  }
  const se=Math.abs(f.b)/rint(30,70)*10;
  const out=`<pre class="out">Coefficients:\n            Estimate Std.Error t value Pr(>|t|)\n(Intercept)  ${fmt(f.a,3)}    ${fmt(se*3,3)}   ${fmt(f.a/(se*3),2)}   &lt;2e-16\nhours         ${fmt(f.b,3)}    ${fmt(se,3)}   ${fmt(f.b/se,2)}  ${f.b/se>4?'1.2e-07':'0.031'}\n\nMultiple R-squared: ${fmt(f.r*f.r,3)}</pre>`;
  return {a:'relinf',lv,k:'interp',pre:pre+out,q:'Reading this R output, which statement is fully correct?',
    o:[`The slope is significantly different from zero and about ${fmt(100*f.r*f.r,0)}% of the variation in marks is explained`,
       `${fmt(100*f.r*f.r,0)}% of students lie on the line`,`r = ${fmt(f.r*f.r,2)}`,'The output proves that studying raises marks'],c:0,
    why:`t = ${fmt(f.b,3)}/${fmt(se,3)} = ${fmt(f.b/se,2)} with a small p-value, so β ≠ 0. r² = ${fmt(f.r*f.r,3)} is explained variation, and r = ${fmt(f.r,2)}. Causation still needs a randomised design.`};
}
};

function bestPct(s,gid){const g=(s.gstat||{})[gid]; return g&&g.best!=null?g.best:0;}
function levelOf(xp){return Math.floor(Math.sqrt((xp||0)/50))+1;}
function xpForLevel(l){return 50*(l-1)*(l-1);}
function addXP(n){
  S.xp=(S.xp||0)+n;
  const l=levelOf(S.xp);
  if(l>(S.level||1)){S.level=l; toast(`Level ${l} reached`);}
  save();
}
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';
    t.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:#0f1b2d;color:#fff;padding:10px 18px;border-radius:8px;font-size:.9rem;z-index:99;box-shadow:0 4px 18px rgba(0,0,0,.2)';
    document.body.appendChild(t);}
  t.textContent=msg; t.style.display='block';
  clearTimeout(t._h); t._h=setTimeout(()=>{t.style.display='none';},2200);
}

function kindOf(q){ if(q.k) return q.k;
  if(q.ty==='num') return 'calc';
  if(q.ty==='sa') return 'interp';
  return q.a==='rprog'?'rcode':'concept'; }
function logErrKind(area,kind,ok){
  S.err=S.err||{}; S.err[area]=S.err[area]||{};
  const e=S.err[area][kind]=S.err[area][kind]||{n:0,c:0};
  e.n++; if(ok)e.c++;
}
function recordAnswer(q,resp,ok){            /* overrides the earlier version */
  S.q[q.a]=S.q[q.a]||{n:0,c:0}; S.q[q.a].n++; if(ok)S.q[q.a].c++;
  S.qseen[q.id]=S.qseen[q.id]||{n:0,c:0}; S.qseen[q.id].n++; if(ok)S.qseen[q.id].c++;
  logErrKind(q.a,kindOf(q),ok);
  if(!ok){
    const my=q.ty==='mc'||q.ty==='tf'?(q.o[Number(resp)]||'(no answer)'):String(resp||'(blank)');
    const correct=q.ty==='mc'||q.ty==='tf'?q.o[q.c]:(q.ty==='num'?String(q.ans):'See model answer');
    const likely=(q.wrong&&q.wrong[Number(resp)])?q.wrong[Number(resp)]:whyKind(kindOf(q));
    const sim=QBANK.filter(x=>x.a===q.a&&x.id!==q.id)[0];
    S.mistakes=S.mistakes.filter(m=>m.qid!==q.id);
    S.mistakes.push({qid:q.id,q:q.q,my,correct,why:q.why,area:q.a,likely,sim:sim?sim.id:null,
      date:today(),kind:kindOf(q),lv:q.lv,src:'quiz'});
    if(S.mistakes.length>160) S.mistakes=S.mistakes.slice(-160);
  }
  save();
}
function whyKind(k){
  return k==='calc'?'Calculation slips usually come from the wrong denominator, a missing square root, or an off-by-one boundary. Redo the step, not the whole problem.':
   k==='interp'?'Interpretation errors usually mean a definition sentence is not yet fixed in your own words. Write the sentence out before attempting more questions.':
   k==='rcode'?'R errors here are about which function answers which question — d for exact, p for cumulative, q for inverse — and where the boundary sits.':
   'Conceptual errors usually mean two ideas are being merged. Find the distinction in the flashcards for this area.';
}
function recordGame(gid,q,resp,ok){
  S.gq=S.gq||{}; S.gq[q.a]=S.gq[q.a]||{n:0,c:0}; S.gq[q.a].n++; if(ok)S.gq[q.a].c++;
  S.gstat=S.gstat||{}; const g=S.gstat[gid]=S.gstat[gid]||{n:0,c:0,best:0,plays:0};
  g.n++; if(ok)g.c++;
  logErrKind(q.a,q.k||'concept',ok);
  if(!ok){
    const my=q.o?(q.o[Number(resp)]||'(no answer)'):String(resp);
    const likely=(q.wrong&&q.wrong[Number(resp)])?q.wrong[Number(resp)]:whyKind(q.k||'concept');
    S.mistakes.push({qid:'g'+Date.now().toString(36),q:q.q,my,correct:q.o?q.o[q.c]:'',why:q.why,area:q.a,
      likely,sim:null,date:today(),kind:q.k||'concept',lv:q.lv||2,src:'game',game:gid});
    if(S.mistakes.length>160) S.mistakes=S.mistakes.slice(-160);
  }
  save();
}
function mastery(a){                          /* overrides the earlier version */
  const ls=areaLessons(a), done=ls.filter(id=>S.lessons[id]).length;
  const lf=ls.length?done/ls.length:0;
  const q=S.q[a]||{n:0,c:0}, g=(S.gq||{})[a]||{n:0,c:0};
  const n=q.n+0.4*g.n, c=q.c+0.4*g.c;
  const acc=n?c/n:0, conf=n/(n+4);
  const gameOnly=q.n===0&&g.n>0?0.8:1;        /* games alone cannot certify mastery */
  return Math.round(100*(0.35*lf+0.65*acc*conf*gameOnly));
}

let G=null;
const LVNAME=['','🟢 Beginner','🔵 Intermediate','🟠 Advanced','🔴 Exam level'];
function bankFor(game){
  if(game.bank) return GQ.filter(q=>q.g===game.bank);
  if(game.mixed) return GQ.concat(QBANK.map(q=>Object.assign({},q,{k:kindOf(q),o:q.o||null,lv:q.lv})).filter(q=>q.o));
  return [];
}
function makeQuestion(){
  const g=G.game, lv=G.lv;
  if(g.gen) return GEN[g.gen](lv);
  if(g.mixed){
    if(rnd()<0.45){ const key=pick(Object.keys(GEN)); return GEN[key](lv); }
    const pool=bankFor(g).filter(q=>Math.abs((q.lv||2)-lv)<=1);
    const p=pool.length?pool:bankFor(g);
    return Object.assign({},pick(p));
  }
  if(g.areas&&g.boss){ return null; }
  const pool=bankFor(g);
  const near=pool.filter(q=>Math.abs((q.lv||2)-lv)<=1&&!G.used.includes(q.q));
  const p=near.length?near:pool.filter(q=>!G.used.includes(q.q));
  const chosen=p.length?pick(p):pick(pool);
  return Object.assign({},chosen);
}
function bossQuestion(){
  const b=G.boss;
  const areas=b.areas.length?b.areas:Object.keys(AREAS);
  if(rnd()<0.5){
    const gens=Object.keys(GEN).filter(k=>{
      const q=({probability:['prob','cond'],'guess-dist':['desc'],'graph-detective':['desc','rel'],
        normal:['norm'],binomial:['rv'],ci:['est'],correlation:['rel','design'],regression:['rel','relinf']})[k]||[];
      return q.some(x=>areas.includes(x));});
    if(gens.length) return GEN[pick(gens)](G.lv);
  }
  const pool=GQ.concat(QBANK.filter(q=>q.o)).filter(q=>areas.includes(q.a)&&!G.used.includes(q.q));
  if(pool.length) return Object.assign({},pick(pool),{k:undefined});
  return GEN.probability(G.lv);
}
function startGame(gid,lv,mode,extra){
  const game=GAMES.find(x=>x.id===gid)||null;
  G={gid,game,lv:lv||2,i:0,total:0,correct:0,streak:0,best:0,xp:0,used:[],q:null,resp:null,
     shown:false,hint:null,mode:mode||'game',secs:(game&&game.secs)||0,
     endAt:(game&&game.secs)?Date.now()+game.secs*1000:0,
     limit:(extra&&extra.limit)||((game&&game.secs)?999:10),boss:extra&&extra.boss,
     consecR:0,consecW:0,refresher:null,log:[]};
  if(G.boss){G.limit=extra.limit||12;}
  G.q=G.boss?bossQuestion():makeQuestion();
  S.gstat=S.gstat||{}; if(G.game){S.gstat[gid]=S.gstat[gid]||{n:0,c:0,best:0,plays:0}; S.gstat[gid].plays++;}
  touchStreak(); save(); render();
}
function gameAnswer(idx){
  if(G.shown) return;
  const q=G.q, ok=Number(idx)===q.c;
  G.resp=Number(idx); G.shown=true; G.total++;
  G.log.push({a:q.a,k:q.k||'concept',lv:q.lv||G.lv,ok});
  if(ok){
    G.correct++; G.streak++; G.best=Math.max(G.best,G.streak); G.consecR++; G.consecW=0;
    const base=(q.lv||G.lv)*5, bonus=Math.min(15,G.streak*2), hintPen=G.hint?4:0;
    const gained=Math.max(2,base+bonus-hintPen);
    G.xp+=gained; addXP(gained);
    S.bestStreak=Math.max(S.bestStreak||0,G.best);
  } else {
    G.streak=0; G.consecW++; G.consecR=0;
  }
  recordGame(G.gid,q,idx,ok);
  /* adaptive difficulty */
  if(G.consecR>=2&&G.lv<4){G.lv++; G.consecR=0; toast('Difficulty up: '+LVNAME[G.lv]);}
  if(G.consecW>=2&&G.lv>1){G.lv--; G.consecW=0; G.refresher=q.a; toast('Difficulty eased — here is a refresher');}
  else if(!ok) G.refresher=q.a;
  checkBadges(); renderNav(); render();
}
function gameNext(){
  G.i++;
  if(G.endAt&&Date.now()>G.endAt) return endGame();
  if(!G.endAt&&G.i>=G.limit) return endGame();
  G.used.push(G.q.q); G.shown=false; G.resp=null; G.hint=null; G.refresher=null;
  G.q=G.boss?bossQuestion():makeQuestion();
  render();
}
function endGame(){
  const p=G.total?Math.round(100*G.correct/G.total):0;
  S.gstat=S.gstat||{};
  const st=S.gstat[G.gid]=S.gstat[G.gid]||{n:0,c:0,best:0,plays:0};
  st.best=Math.max(st.best||0,p);

  if(S.gameLog.length>60)S.gameLog=S.gameLog.slice(-60);
  if(G.boss&&p>=75){ S.bosses=S.bosses||{}; S.bosses[G.boss.id]=({date:today(),pct:p}); addXP(100); toast('Boss defeated'); }
  if(G.mode==='daily'){ S.daily=S.daily||{}; S.daily[today()]={done:true,pct:p,xp:G.xp}; }
  if(G.mode==='weekly'){ S.weekly=S.weekly||{}; S.weekly[weekKey()]={done:true,pct:p}; }
  if(G.mode==='tournament'){ S.tourney=S.tourney||[]; S.tourney.push({date:today(),pct:p,total:G.total,xp:G.xp,streak:G.best}); }
  G.over=true; addXP(20); checkBadges(); save(); renderNav(); render();
}

function svgLine(series,truth,ylab){
  const W=460,H=190,L=46,B=30;
  const n=series.length; if(!n) return '';
  const yl=0,yh=1;
  const px=i=>L+(W-L-14)*(i/(n-1||1)), py=v=>H-B-(H-B-14)*(v-yl)/(yh-yl);
  let d='';
  series.forEach((v,i)=>{d+=(i?'L':'M')+fmt(px(i),1)+' '+fmt(py(v),1)+' ';});
  let g=`<line x1="${L}" y1="${py(truth)}" x2="${W-8}" y2="${py(truth)}" stroke="#0e7f6f" stroke-dasharray="4 3"/>`;
  g+=`<path d="${d}" fill="none" stroke="#27488f" stroke-width="1.6"/>`;
  g+=`<line x1="${L}" y1="8" x2="${L}" y2="${H-B}" stroke="#4a5a70"/><line x1="${L}" y1="${H-B}" x2="${W-8}" y2="${H-B}" stroke="#4a5a70"/>`;
  g+=axisLbl(L-6,py(truth)+4,fmt(truth,3),'end',10)+axisLbl((W+L)/2,H-4,'Number of trials');
  g+=axisLbl(L-6,14,'1.0','end',10)+axisLbl(L-6,H-B+4,'0','end',10);
  return svgFrame(g,W,H,ylab||'running proportion');
}

}

let CIS=null;
function viewCISim(){
  if(!CIS) CIS={level:0.95,n:50,runs:null,pred:null};
  let h=head('📏 Interval Coverage Simulator','Simulation Lab · what "95% confident" actually means');
  h+='<div class="panel"><div class="row">';
  [0.80,0.90,0.95,0.99].forEach(l=>{h+=`<span class="pill ${CIS.level===l?'on':''}" data-cil="${l}">${fmt(l*100,0)}% confidence</span>`;});
  h+='</div><div class="row" style="margin-top:8px">';
  [20,50,100,300].forEach(n=>{h+=`<span class="pill ${CIS.n===n?'on':''}" data-cin="${n}">n = ${n}</span>`;});
  h+='</div></div>';
  if(CIS.pred===null){
    h+=`<div class="panel"><h3>Predict first</h3>
      <p class="small">A known population has p = 0.40. One hundred samples of n = ${CIS.n} will be drawn and a ${fmt(CIS.level*100,0)}% interval built from each. How many of those 100 intervals do you expect to contain 0.40?</p>
      <div class="row">${[Math.round(CIS.level*100)-15,Math.round(CIS.level*100),100,50].map(v=>`<button class="opt" style="width:auto;display:inline-block" data-cipred="${v}">About ${v}</button>`).join('')}</div></div>`;
    return h;
  }
  if(!CIS.runs){
    const p=0.4,z=normInv(1-(1-CIS.level)/2),out=[];
    for(let i=0;i<100;i++){
      let s=0; for(let j=0;j<CIS.n;j++) if(rnd()<p)s++;
      const ph=s/CIS.n, se=Math.sqrt(Math.max(1e-6,ph*(1-ph)/CIS.n));
      out.push([ph-z*se,ph+z*se]);
    }
    CIS.runs=out;
  }
  const hits=CIS.runs.filter(iv=>iv[0]<=0.4&&0.4<=iv[1]).length;
  const lo=Math.min(...CIS.runs.map(r=>r[0])),hi=Math.max(...CIS.runs.map(r=>r[1]));
  h+=`<div class="panel"><h3>One hundred intervals</h3>
    ${svgCIs(CIS.runs,0.4,lo,hi)}
    <p class="small">Red intervals miss the true p = 0.40. <b>${hits} of 100</b> captured it; the advertised rate is ${fmt(CIS.level*100,0)}%. You predicted about ${CIS.pred}.</p>
    <ul class="tight small">
      <li>Each interval is either right or wrong — the ${fmt(CIS.level*100,0)}% describes the <b>procedure</b> across repeated samples, not any single interval.</li>
      <li>Raising the confidence level makes every interval wider and the miss rate smaller. Raising n makes them narrower without changing the coverage.</li>
      <li>This is why "there is a 95% probability that p is in this interval" is the wrong sentence.</li></ul>
    <div class="row"><button class="btn ghost" id="cirun">Run 100 more</button>
    <button class="btn quiet" id="cireset">Change the settings</button></div></div>`;
  return h;
}

let MG=null;
const MATCH_ROUNDS=[

function startMatch(round){

function matchPick(side,id){
  const R=MATCH_ROUNDS[MG.round-1];
  if(side==='left'){MG.sel=id; MG.msg=null; render(); return;}
  if(!MG.sel){MG.msg={ok:false,t:'Pick a formula on the left first.'}; render(); return;}
  MG.tries++;
  const F=FORMULAS.find(f=>f.id===MG.sel);
  if(MG.sel===id){
    MG.matched[id]=true; MG.hit++; addXP(8);
    MG.msg={ok:true,t:`<b>${esc(F.n)}.</b> ${esc(F.use)} Example: ${F.ex}`};

   TEACH ME MODE — guided delivery of a concept, one piece at a time
   (distinct from the Problem Tutor, which walks through a problem you bring)
   ========================================================================= */
let TM=null;
function teachSteps(id){
  const L=LESSONS[id]; if(!L) return [];
  const st=[];
  st.push({t:'The idea in plain terms',b:`<p style="font-size:1.05rem">${L.simple}</p>`,
    ask:'Does that land, or would you like the pieces broken down first?'});
  if(L.defs&&L.defs.length){
    st.push({t:'The vocabulary you need',b:'<div>'+L.defs.slice(0,3).map(d=>`<div class="def"><b>${d[0]}</b> — ${d[1]}</div>`).join('')+'</div>',
      ask:'These are the words the exam will use. Ready for the formal version?'});
    if(L.defs.length>3) st.push({t:'The rest of the vocabulary',b:'<div>'+L.defs.slice(3).map(d=>`<div class="def"><b>${d[0]}</b> — ${d[1]}</div>`).join('')+'</div>',ask:'Ready to move on?'});
  }
  st.push({t:'The formal statement',b:`<div class="block formal"><p>${L.formal}</p></div>`,
    ask:'This is the version to reproduce in an exam. Shall we work an example?'});
  if(L.visual) st.push({t:'What it looks like',b:`<div style="background:#fff;padding:6px 0">${L.visual}</div>`,ask:'Ready for the worked example?'});
  (L.steps||[]).forEach((s,i)=>st.push({t:`Worked example ${(L.steps.length>1)?i+1:''}`.trim(),b:`<p><b>${s.h}</b></p><div>${s.b}</div>`,
    ask:i===L.steps.length-1?'Ready to test yourself?':'Follow that? Next part of the example.'}));
  if(L.keyf&&L.keyf.length) st.push({t:'The formulas to hold on to',
    b:L.keyf.map(f=>{const F=FORMULAS.find(x=>x.id===f);return F?`<div class="formula"><div class="fx">${F.f}</div><div class="small muted" style="font-family:var(--sans)">${esc(F.n)} — ${esc(F.use)}</div></div>`:'';}).join(''),
    ask:'Ready to test yourself?'});
  st.push({t:'Check yourself',check:true,area:L.area});
  if(L.mistakes&&L.mistakes.length) st.push({t:'Where people lose marks',
    b:'<div class="block warn"><ul class="tight">'+L.mistakes.map(m=>`<li>${m}</li>`).join('')+'</ul></div>',ask:'Last piece.'});
  st.push({t:'Summary',summary:true});
  return st;
}
function startTeach(id){
  TM={id,i:0,steps:teachSteps(id),q:null,resp:null,shown:false,slow:false,right:0,asked:0};
  setLast('#/teach/'+id,'Teach me — '+(LESSONS[id]?LESSONS[id].t:id));
  touchStreak(); render();
}
function viewTeach(id){
  if(id&&(!TM||TM.id!==id)) startTeach(id);
  if(!TM){
    let h=head('🧑‍🏫 Teach Me','Have a concept taught to you step by step');
    h+=`<div class="panel small muted">Teach Me delivers one idea at a time, in order, and stops to check that it landed before moving on. It is for meeting a topic — use the <a data-go="#/tutor">Problem Tutor</a> when you already have a specific problem in front of you, and <a data-go="#/teachback">Teach Back</a> when you want to explain a concept in your own words and be marked on it.</div>`;
    COURSE.forEach(w=>{
      if(!w.lessons.length) return;
      h+=`<div class="panel"><div class="spread"><h3>Week ${w.n}</h3><span class="tag n">${esc(w.title)}</span></div><div class="row">`;
      w.lessons.forEach(l=>{if(LESSONS[l]) h+=`<span class="pill" data-go="#/teach/${l}">${esc(LESSONS[l].t)}</span>`;});
      h+='</div></div>';
    });
    return h;
  }
  const L=LESSONS[TM.id], st=TM.steps[TM.i], last=TM.i===TM.steps.length-1;
  let h=head('🧑‍🏫 '+esc(L.t),'Teach Me · '+esc(areaName(L.area)),`<span class="tag n">${TM.i+1} of ${TM.steps.length}</span>`);
  h+=`<div class="panel">${bar(Math.round(100*TM.i/(TM.steps.length-1)))}</div>`;
  if(st.summary){
    h+=`<div class="panel"><h3>What you have just been taught</h3>
      <p>${L.simple}</p>
      <ul class="tight small">${(L.defs||[]).slice(0,4).map(d=>`<li><b>${esc(d[0])}</b> — ${esc(d[1])}</li>`).join('')}</ul>
      <p class="small">You answered ${TM.right} of ${TM.asked} check question${TM.asked===1?'':'s'} correctly.</p>
      <div class="row">
        <button class="btn" data-lesson-done="${TM.id}">${S.lessons[TM.id]?'Marked complete ✓':'Mark this lesson complete'}</button>
        <button class="btn ghost" data-go="#/teachback?c=${L.area}">Now explain it back to me</button>
        <button class="btn quiet" data-go="#/quiz?areas=${L.area}&auto=1">Quiz on ${esc(areaName(L.area))}</button>
        <button class="btn quiet" data-go="#/lesson/${TM.id}">Full lesson page</button>
      </div></div>`;
    const nxt=allLessons()[allLessons().indexOf(TM.id)+1];
    if(nxt&&LESSONS[nxt]) h+=`<div class="panel"><div class="spread"><span class="small">Next in the course: <b>${esc(LESSONS[nxt].t)}</b></span>
      <button class="btn sm ghost" data-go="#/teach/${nxt}">Teach me that</button></div></div>`;
    return h;
  }
  if(st.check){
    if(!TM.q){
      const pool=QBANK.filter(q=>q.a===st.area&&(q.ty==='mc'||q.ty==='tf'));
      TM.q=pool.length?Object.assign({},pick(pool)):(GEN.probability?GEN.probability(2):null);
      if(TM.q&&!TM.q.k) TM.q.k=kindOf(TM.q);
    }
    const q=TM.q;
    h+=`<div class="panel"><h3>${esc(st.t)}</h3><p class="small muted">No marks at stake — this is to check the teaching worked.</p>
      <p style="font-size:1.02rem">${q.q}</p>`;
    q.o.forEach((o,i)=>{let cls='opt';
      if(TM.shown){if(i===q.c)cls+=' right'; else if(i===TM.resp)cls+=' wrong';}
      h+=`<button class="${cls}" data-topt="${i}" ${TM.shown?'disabled':''}><span class="mk">${String.fromCharCode(65+i)}</span>${o}</button>`;});
    if(TM.shown){
      const ok=TM.resp===q.c;
      h+=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'Correct.':'Not correct.'}</b> ${q.why}</div>`;
      if(!ok) h+=`<div class="panel" style="margin-top:12px;background:#f7f9fc"><h4>Let me say it another way</h4>
        <p class="small">${L.simple}</p>${(L.defs||[]).slice(0,2).map(d=>`<div class="def small"><b>${esc(d[0])}</b> — ${esc(d[1])}</div>`).join('')}</div>`;
      h+=`<div class="row" style="margin-top:12px"><button class="btn" id="tmnext">Continue</button></div>`;
    }
    h+='</div>';
    return h;
  }
  h+=`<div class="panel"><h3>${esc(st.t)}</h3>${st.b}`;
  if(TM.slow&&L.defs) h+='<div style="margin-top:10px">'+L.defs.map(d=>`<div class="def small"><b>${esc(d[0])}</b> — ${esc(d[1])}</div>`).join('')+'</div>';
  h+=`<hr><p class="small muted">${esc(st.ask||'')}</p>
    <div class="row"><button class="btn" id="tmnext">Got it — continue</button>
    <button class="btn quiet" id="tmslow">${TM.slow?'Hide the extra detail':'Slower — show me the pieces'}</button>
    ${TM.i>0?'<button class="btn quiet" id="tmback">Back</button>':''}</div></div>`;
  return h;
}

let TB=null;
function gradeTeachBack(p,text){
  const t=' '+text.toLowerCase().replace(/[^a-z0-9αμσ√≥≤₀|()'.% ]/g,' ').replace(/\s+/g,' ')+' ';
  const hit=p.points.filter(pt=>pt.k.some(k=>t.includes(k.toLowerCase())));
  const miss=p.points.filter(pt=>!hit.includes(pt));
  const traps=p.traps.filter(tr=>tr.k.some(k=>t.includes(k.toLowerCase())));
  const words=text.trim().split(/\s+/).filter(Boolean).length;
  const score=Math.max(0,Math.round(100*hit.length/p.points.length)-traps.length*20);
  return {hit,miss,traps,words,score};
}
function viewTeachBack(params){
  const pid=params.c&&TBP.find(p=>p.id===params.c||p.a===params.c);
  if(!TB&&pid) TB={p:pid,text:'',res:null};
  let h=head('🧠 Teach Back','Explain it in your own words and be marked on it');
  if(!TB){
    h+=`<div class="panel small muted">Explaining a concept out loud is the fastest way to find the holes in it. Pick a prompt, write your explanation without looking anything up, and the platform checks it against the points a marker would look for — then flags the specific misconceptions this course penalises.</div>`;
    h+='<div class="grid g2">';
    TBP.forEach(p=>{const done=(S.tb||{})[p.id];
      h+=`<div class="panel"><div class="spread"><h3 style="font-size:1rem">${esc(p.t)}</h3>${done?`<span class="tag ${done.score>=75?'g':'w'}">${done.score}%</span>`:''}</div>
        <div class="row"><span class="tag n">${esc(areaName(p.a))}</span>
        <button class="btn sm ghost" data-tb="${p.id}">Explain this</button></div></div>`;});
    h+='</div>';
    return h;
  }
  const p=TB.p;
  h+=`<div class="panel"><div class="spread"><h3>${esc(p.t)}</h3><span class="tag n">${esc(areaName(p.a))}</span></div>`;
  if(!TB.res){
    h+=`<p class="small muted">Write as if explaining to a classmate who missed the lecture. Three or four sentences is usually enough. Do not look at the lesson first — the point is to find out what you actually hold.</p>
      <textarea id="tbtext" rows="8" placeholder="Your explanation…">${esc(TB.text||'')}</textarea>
      <div class="row" style="margin-top:10px"><button class="btn" id="tbsubmit">Submit my explanation</button>
      <button class="btn quiet" id="tbcancel">Choose another prompt</button></div>`;
    h+='</div>';
    return h;
  }
  const r=TB.res;
  h+=`<div class="spread"><span class="small muted">${r.words} words</span><span class="tag ${r.score>=75?'g':r.score>=45?'w':'b'}">${r.score}%</span></div>
    ${bar(r.score)}</div>`;
  h+=`<div class="panel"><h3>Your explanation</h3><div class="small" style="white-space:pre-wrap;background:#f7f9fc;padding:10px;border-radius:6px">${esc(TB.text)}</div></div>`;
  h+='<div class="panel"><h3>What a marker looks for</h3><table><tr><th>Point</th><th>In your answer</th></tr>';
  p.points.forEach(pt=>{const got=r.hit.includes(pt);
    h+=`<tr><td>${esc(pt.t)}</td><td>${got?'<span class="tag g">present</span>':'<span class="tag b">missing</span>'}</td></tr>`;});
  h+='</table>';
  if(r.miss.length) h+=`<p class="small">The missing point${r.miss.length===1?'':'s'} ${r.miss.length===1?'is':'are'} usually where marks go: ${r.miss.map(m=>esc(m.t.toLowerCase())).join('; ')}.</p>`;
  h+='</div>';
  if(r.traps.length){
    h+='<div class="panel"><h3>Misconceptions flagged</h3>';
    r.traps.forEach(t=>{h+=`<div class="fb no small"><b>Careful.</b> ${esc(t.t)}</div>`;});
    h+='</div>';
  }
  h+=`<div class="panel"><h3>A model answer</h3><p>${esc(p.model)}</p>
    <p class="tiny muted">Marked by matching your wording against the required points and the misconceptions this course penalises. It is a keyword rubric, not a human marker: an unusual but correct phrasing can be scored low, so read the model answer and judge for yourself.</p>
    <div class="row"><button class="btn" id="tbretry">Try this one again</button>
      <button class="btn ghost" data-tb=""> Another prompt</button>
      <button class="btn quiet" data-go="#/teach">Have it taught to me instead</button></div></div>`;
  return h;
}

/* =========================================================================

   ========================================================================= */
function buildPlan(){
  const d=today(), tasks=[];
  const cw=currentWeek(), w=weekOf(cw);
  const rows=masteryRows();
  const weak=rows.filter(r=>r.m<60).sort((a,b)=>a.m-b.m);
  const due=dueCards().length;
  const dailyDone=(S.daily||{})[d];
  /* 1. prerequisite break */
  const broken=MAPEDGES.filter(([a,b])=>nodeState(a).m<45&&(nodeState(b).read||nodeState(b).m>0)).map(e=>e[0]);
  if(broken.length) tasks.push({id:'prereq',icon:'🗺️',t:`Repair a prerequisite: ${LESSONS[broken[0]].t}`,
    why:'Concepts that depend on it are already in play, so every later topic is costing you more than it should.',
    min:15,r:'#/teach/'+broken[0]});
  /* 2. weakest area with unread lesson */
  for(const r of weak){
    const un=areaLessons(r.a).find(id=>!S.lessons[id]);
    if(un){tasks.push({id:'lesson-'+un,icon:'📘',t:`Learn: ${LESSONS[un].t}`,
      why:`${r.name} is your weakest measured area at ${r.m}%, and this lesson is not marked complete.`,min:15,r:'#/teach/'+un});break;}
  }
  /* 3. mistakes */
  const recent=S.mistakes.slice(-12);
  if(recent.length>=4){
    const kinds={}; recent.forEach(m=>kinds[m.kind||'concept']=(kinds[m.kind||'concept']||0)+1);
    const worst=Object.keys(kinds).sort((a,b)=>kinds[b]-kinds[a])[0];
    tasks.push({id:'mistakes',icon:'🩹',t:`Rework ${recent.length} saved mistakes`,
      why:`Most of your recent errors are ${({concept:'conceptual',calc:'computational',interp:'interpretation',rcode:'R'})[worst]||worst} — the fastest marks to recover.`,
      min:12,r:'#/quiz?scope=mistakes&auto=1'});
  }
  /* 4. flashcards */
  if(due) tasks.push({id:'cards',icon:'🗂️',t:`Review ${Math.min(due,25)} flashcards`,
    why:'Spaced review is what stops definitions decaying between quizzes.',min:Math.max(5,Math.round(Math.min(due,25)*0.4)),r:'#/cards'});
  /* 5. daily challenge */
  if(!dailyDone) tasks.push({id:'daily',icon:'🗓️',t:'Daily challenge (8 questions)',
    why:'Rotates across the whole course, so older material keeps resurfacing.',min:6,r:'#/games'});
  /* 6. current week progress */
  const nextItem=(w.lessons||[]).find(id=>!S.lessons[id])||(w.rlabs||[]).find(id=>!S.rlabs[id]);
  if(nextItem) tasks.push({id:'week-'+nextItem,icon:'📅',t:LESSONS[nextItem]?`Week ${cw}: ${LESSONS[nextItem].t}`:`Week ${cw} R Lab: ${(RLABS.find(r=>r.id===nextItem)||{}).t||nextItem}`,
    why:`Keeps you level with Week ${cw} of the course.`,min:20,r:LESSONS[nextItem]?'#/lesson/'+nextItem:'#/rlab/'+nextItem});
  /* 7. teach back */
  const tbDone=S.tb||{};
  const tbNext=TBP.find(p=>!tbDone[p.id]&&(weak.length?weak.some(r=>r.a===p.a):true))||TBP.find(p=>!tbDone[p.id]);
  if(tbNext) tasks.push({id:'tb-'+tbNext.id,icon:'🧠',t:`Teach back: ${tbNext.t.replace(/^Explain /,'')}`,
    why:'Explaining in your own words exposes gaps that recognising a right answer hides.',min:8,r:'#/teachback?c='+tbNext.id});
  /* 8. project */
  const projFields=PROJECT_FIELDS.filter(f=>!(S.project[f[0]]||'').trim());
  if(projFields.length&&cw>=3) tasks.push({id:'proj',icon:'📁',t:`Project: draft "${projFields[0][1]}"`,
    why:'The project assignments feed straight into the mini manuscript; drafting early costs less than catching up.',min:20,r:'#/project'});
  return tasks.slice(0,6);
}
function viewPlan(){
  const d=today();
  S.plan=S.plan||{}; const doneToday=S.plan[d]||{};
  const tasks=buildPlan();
  const total=tasks.reduce((s,t)=>s+t.min,0);
  const doneCount=tasks.filter(t=>doneToday[t.id]).length;
  let h=head('🎯 Today\'s study plan',`${d} · rebuilt from your mastery, mistakes and where you are in the course`);
  h+=`<div class="grid g3">
    <div class="stat"><div class="k">Tasks</div><div class="v num">${doneCount}/${tasks.length}</div><div class="s">ticked off today</div></div>
    <div class="stat"><div class="k">Estimated time</div><div class="v num">${total}</div><div class="s">minutes in total</div></div>
    <div class="stat"><div class="k">Study streak</div><div class="v num">${S.streak.count||0}</div><div class="s">best ${S.streak.best||0}</div></div></div>`;
  if(!tasks.length) return h+'<div class="empty"><b>Nothing pressing</b>No weak areas, no cards due and no gaps in the current week. Try a boss battle or the weekly challenge.</div>';
  h+='<div class="panel"><h3>In this order</h3><p class="small muted">Ordered by what unblocks the most: broken prerequisites first, then weak areas, then maintenance.</p>';
  tasks.forEach((t,i)=>{
    const done=doneToday[t.id];
    h+=`<div class="searchrow"><div class="spread">
      <span><label style="cursor:pointer"><input type="checkbox" data-plan="${t.id}" ${done?'checked':''}> <b>${t.icon} ${esc(t.t)}</b></label></span>
      <span class="row"><span class="tag n">${t.min} min</span><button class="btn sm ghost" data-go="${t.r}">Start</button></span></div>
      <div class="tiny muted" style="margin-left:22px">${esc(t.why)}</div></div>`;
  });
  h+='</div>';
  h+=`<div class="panel"><h3>How this is built</h3><ul class="tight small">
    <li>A prerequisite below 45% that already has dependants comes first — everything downstream is harder until it is fixed.</li>
    <li>Then your lowest measured area with a lesson still unread.</li>
    <li>Then recovery work: saved mistakes and flashcards that are due.</li>
    <li>Then keeping pace with Week ${currentWeek()}, and finally the project, which is easy to postpone and expensive to rush.</li>
    <li>The plan is regenerated every time you open it, so ticking things off changes tomorrow's list.</li></ul></div>`;
  return h;
}

/* =========================================================================
   ANALYTICS — why you are weak, not just how weak
   ========================================================================= */
const KINDLABEL={concept:'Concepts and definitions',calc:'Calculations',interp:'Interpretation',rcode:'R code and output'};
function kindTotals(){
  const out={};
  Object.keys(S.err||{}).forEach(a=>Object.keys(S.err[a]).forEach(k=>{
    out[k]=out[k]||{n:0,c:0}; out[k].n+=S.err[a][k].n; out[k].c+=S.err[a][k].c;}));
  return out;
}
function viewAnalytics(){
  const kt=kindTotals();
  const totalQ=Object.values(kt).reduce((s,x)=>s+x.n,0);
  let h=head('📊 Analytics','Diagnosis, not just percentages');
  if(!totalQ){
    return h+'<div class="empty"><b>Nothing to diagnose yet</b>Answer some quiz or game questions and this page will show which <i>kind</i> of error is costing you marks, in which topics, and whether it is improving.</div>';
  }
  h+='<div class="panel"><h3>What kind of question costs you marks</h3><table><tr><th>Question type</th><th>Attempted</th><th>Accuracy</th><th></th></tr>';
  Object.keys(KINDLABEL).forEach(k=>{const e=kt[k]; if(!e||!e.n)return;
    const p=Math.round(100*e.c/e.n);
    h+=`<tr><td>${KINDLABEL[k]}</td><td class="num">${e.n}</td><td class="num">${p}%</td><td style="width:35%">${bar(p)}</td></tr>`;});
  h+='</table>';
  const ranked=Object.keys(kt).filter(k=>kt[k].n>=4).sort((a,b)=>(kt[a].c/kt[a].n)-(kt[b].c/kt[b].n));
  if(ranked.length>=2){
    const lo=ranked[0],hi=ranked[ranked.length-1];
    const lop=Math.round(100*kt[lo].c/kt[lo].n),hip=Math.round(100*kt[hi].c/kt[hi].n);
    if(hip-lop>=15) h+=`<div class="fb no"><b>Diagnosis.</b> Your ${KINDLABEL[hi].toLowerCase()} sit at ${hip}% while your ${KINDLABEL[lo].toLowerCase()} sit at ${lop}%.
      ${whyKind(lo)}</div>`;
    else h+=`<p class="small">Your accuracy is fairly even across question types (${lop}–${hip}%), so the issue is topic coverage rather than a particular skill. Work down the mastery list instead.</p>`;
  }
  h+='</div>';

  /* per-area kind profile */
  const areas=Object.keys(S.err||{}).filter(a=>Object.values(S.err[a]).reduce((s,x)=>s+x.n,0)>=3);
  if(areas.length){
    h+='<div class="panel"><h3>Where each weakness lives</h3><table><tr><th>Topic</th><th>Mastery</th>'+
      Object.keys(KINDLABEL).map(k=>`<th>${k==='rcode'?'R':k[0].toUpperCase()+k.slice(1,4)}</th>`).join('')+'<th>Read as</th></tr>';
    areas.sort((a,b)=>mastery(a)-mastery(b)).forEach(a=>{
      const row=S.err[a];
      const cells=Object.keys(KINDLABEL).map(k=>{const e=row[k];
        return `<td class="num">${e&&e.n?Math.round(100*e.c/e.n)+'%':'—'}</td>`;}).join('');
      const worst=Object.keys(row).filter(k=>row[k].n>=2).sort((x,y)=>(row[x].c/row[x].n)-(row[y].c/row[y].n))[0];
      const note=worst?({concept:'definitions not yet secure',calc:'arithmetic and formula steps',
        interp:'stating what results mean',rcode:'which function, which boundary'})[worst]:'—';
      h+=`<tr><td>${esc(areaName(a))}</td><td class="num">${mastery(a)}%</td>${cells}<td class="small">${note}</td></tr>`;});
    h+='</table><p class="tiny muted">C = concepts, Calc = calculations, Inte = interpretation, R = R code. A dash means too few attempts to judge.</p></div>';
  }

  /* repeat offenders */
  const repeats=Object.keys(S.qseen||{}).map(id=>({id,st:S.qseen[id],q:QBANK.find(q=>q.id===id)}))
    .filter(x=>x.q&&x.st.n>=2&&x.st.c/x.st.n<0.5);
  if(repeats.length){
    h+='<div class="panel"><h3>Questions you keep getting wrong</h3><p class="small muted">Seen at least twice with under half correct — these are stable misconceptions, not slips.</p>';
    repeats.slice(0,6).forEach(r=>{h+=`<div class="searchrow small"><div class="spread"><span>${r.q.q}</span>
      <span class="tag b">${r.st.c}/${r.st.n}</span></div><div class="tiny muted">${esc(areaName(r.q.a))} · ${KINDLABEL[kindOf(r.q)]}</div></div>`;});
    h+='</div>';
  }

  /* trend */
  const ms=S.mistakes.slice();
  if(ms.length>=8){
    const half=Math.floor(ms.length/2);
    const early={},late={};
    ms.slice(0,half).forEach(m=>early[m.kind||'concept']=(early[m.kind||'concept']||0)+1);
    ms.slice(half).forEach(m=>late[m.kind||'concept']=(late[m.kind||'concept']||0)+1);
    h+='<div class="panel"><h3>Is it shifting?</h3><table><tr><th>Error type</th><th>Earlier half</th><th>Recent half</th><th>Direction</th></tr>';
    Object.keys(KINDLABEL).forEach(k=>{const e=early[k]||0,l=late[k]||0; if(!e&&!l)return;
      h+=`<tr><td>${KINDLABEL[k]}</td><td class="num">${e}</td><td class="num">${l}</td>
        <td>${l<e?'<span class="tag g">improving</span>':l>e?'<span class="tag w">growing</span>':'<span class="tag n">flat</span>'}</td></tr>`;});
    h+='</table><p class="small">Counts of saved mistakes, earliest half against most recent half. A growing count can simply mean you are attempting harder material — check it against the mastery figures.</p></div>';
  }

  /* pace + coverage */
  const timed=(S.gameLog||[]).filter(g=>g.secs&&g.total);
  const gaps=masteryRows().filter(r=>((S.q[r.a]||{n:0}).n+((S.gq||{})[r.a]||{n:0}).n)===0);
  h+='<div class="panel"><h3>Pace and coverage</h3><ul class="tight small">';
  if(timed.length){const sp=mn(timed.slice(-5).map(g=>g.secs/g.total));
    h+=`<li>Recent game pace: about ${fmt(sp,1)} seconds per question. ${sp>25?'Under exam conditions that is slow for short items — practise the routine calculations until they are automatic.':'That is a workable exam pace for short items.'}</li>`;}
  h+=`<li>Questions answered in total: ${totalQ}. Mastery estimates stabilise after roughly 10 questions per topic.</li>`;
  if(gaps.length) h+=`<li>Untested topics: ${gaps.map(g=>esc(g.name)).join(', ')}. Mastery there is based on reading alone, so treat those figures as provisional.</li>`;
  h+='</ul><div class="row">'+
    (gaps.length?`<button class="btn ghost" data-go="#/quiz?areas=${gaps[0].a}&auto=1">Test ${esc(gaps[0].name)}</button>`:'')+
    '<button class="btn quiet" data-go="#/mastery">Mastery by topic</button><button class="btn quiet" data-go="#/plan">Today\'s plan</button></div></div>';
  return h;
}

function guessWeek(name){
  const m=String(name).toLowerCase().match(/(?:week|wk|w)[^0-9]{0,2}([0-9]{1,2})/);
  if(m){const n=parseInt(m[1],10); if(n>=1&&n<=15) return n;}
  return currentWeek();
}
function guessTopics(text,week){
  const t=(' '+text+' ').toLowerCase();
  const scored=Object.keys(LESSONS).map(id=>{
    const words=LESSONS[id].t.toLowerCase().replace(/\(.*?\)/g,'').split(/[^a-z]+/).filter(x=>x.length>4);
    const hits=words.filter(w=>t.includes(w)).length;
    return {id,score:hits/(words.length||1),w:lessonWeek(id)};
  }).filter(x=>x.score>=0.5);
  scored.sort((a,b)=>(b.score+(b.w===week?0.5:0))-(a.score+(a.w===week?0.5:0)));
  return scored.slice(0,3).map(x=>x.id);
}

function render(){                              /* overrides the earlier version */
  const {parts,params}=parseHash();
  const p0=parts[0]||'dash';
  let html='';
  try{
    switch(p0){
      case 'dash': html=viewDash(); break;
      case 'weeks': html=viewWeeks(); break;
      case 'week': html=viewWeek(parseInt(parts[1]||'1',10)); break;
      case 'lesson': html=viewLesson(parts[1]); break;
      case 'teach': html=viewTeach(parts[1]); break;
      case 'teachback': html=viewTeachBack(params); break;
      case 'map': html=viewMap(); break;
      case 'plan': html=viewPlan(); break;
      case 'analytics': html=viewAnalytics(); break;
      case 'games': html=(G&&!G.over)?viewGameRun():((G&&G.over)?viewGameOver():viewGames()); break;
      case 'play': html=G?(G.over?viewGameOver():viewGameRun()):viewGames(); break;
      case 'match': html=viewMatch(); break;
      case 'case': html=viewCase(); break;
      case 'sim':
        html=parts[1]==='dice'?viewDice():parts[1]==='clt'?viewCLT():parts[1]==='ci'?viewCISim():viewSimLab(); break;
      case 'quiz':
        if(Q&&Q.done) html=viewQuizResults();
        else if(Q) html=viewQuizRun();
        else if(params.auto||params.scope||params.areas){
          startQuiz({areas:(params.areas||'').split(',').filter(Boolean),scope:params.scope,n:parseInt(params.n||'10',10)});
          return;
        } else html=viewQuizSetup(params);
        break;
      case 'exam':
        html=(Q&&Q.done)?viewQuizResults():(Q?viewQuizRun():viewExam()); break;
      case 'cards': html=viewCards(params); break;
      case 'rlab': html=parts[1]?viewRLab(parts[1]):viewRLabList(); break;
      case 'tutor': html=viewTutor(); break;
      case 'mastery': html=viewMastery(); break;
      case 'mistakes': html=viewMistakes(); break;
      case 'formulas': html=viewFormulas(params); break;
      case 'project': html=viewProject(); break;
      case 'notes': html=viewNotes(params); break;
      case 'note': html=viewNote(parts[1],parts[2]); break;
      case 'search': html=viewSearch(params); break;
      default: html=viewDash();
    }
  }catch(err){
    html=`<div class="panel"><h3>Something failed to render</h3><p class="small">${esc(err.message)}</p>
      <button class="btn" data-go="#/dash">Back to the dashboard</button></div>`;
  }
  $('#view').innerHTML=html;
  markActive();
  const chat=document.getElementById('chat'); if(chat) chat.scrollTop=chat.scrollHeight;
  window.scrollTo(0,0);
}
function gtick(){
  if(!G||G.over||!G.endAt) return;
  const el=document.getElementById('gtmr'); if(!el) return;
  const left=Math.max(0,G.endAt-Date.now());
  el.textContent=Math.ceil(left/1000)+'s';
  el.classList.toggle('low',left<15000);
  if(left<=0&&!G.over) endGame();
}
