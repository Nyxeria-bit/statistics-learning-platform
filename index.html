<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statistics with Probability — Study Platform</title>
<style>
:root{
  --ink:#0f1b2d; --ink2:#4a5a70; --ink3:#7d8ba0;
  --line:#d6dde7; --line2:#e8edf3;
  --canvas:#e9edf3; --panel:#ffffff;
  --accent:#27488f; --accent-soft:#eaf0fb;
  --good:#0e7f6f; --good-soft:#e5f4f1;
  --warn:#b06a12; --warn-soft:#fbf0de;
  --bad:#a82b46; --bad-soft:#fbe9ed;
  --radius:8px;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); background:var(--canvas);
  font-size:15.5px; line-height:1.6; -webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--line2) 1px,transparent 1px),linear-gradient(90deg,var(--line2) 1px,transparent 1px);
  background-size:28px 28px;
}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; line-height:1.25; margin:0 0 .5em}
h1{font-size:1.75rem; letter-spacing:-.01em}
h2{font-size:1.3rem}
h3{font-size:1.08rem}
h4{font-size:.97rem; font-family:var(--sans); font-weight:650}
p{margin:0 0 .9em}
a{color:var(--accent)}
button{font:inherit}
code,kbd{font-family:var(--mono); font-size:.88em}
.num{font-variant-numeric:tabular-nums}

/* ---------- layout ---------- */
#app{display:flex; min-height:100vh}
#sidebar{
  width:266px; flex:0 0 266px; background:var(--ink); color:#c9d4e4;
  padding:18px 0 40px; position:sticky; top:0; height:100vh; overflow-y:auto;
}
#sidebar .brand{padding:2px 20px 16px; border-bottom:1px solid rgba(255,255,255,.1); margin-bottom:12px}
#sidebar .brand b{display:block; font-family:var(--serif); font-size:1.1rem; color:#fff; letter-spacing:.01em}
#sidebar .brand span{font-size:.76rem; color:#8b9cb5}
.navgroup{padding:14px 20px 4px; font-size:.7rem; letter-spacing:.09em; color:#77899f; text-transform:uppercase}
.navlink{
  display:flex; align-items:center; gap:9px; padding:7px 20px; color:#c9d4e4;
  text-decoration:none; font-size:.9rem; border-left:3px solid transparent; cursor:pointer;
}
.navlink:hover{background:rgba(255,255,255,.06); color:#fff}
.navlink.active{background:rgba(255,255,255,.1); color:#fff; border-left-color:#7fa7e8}
.navlink .dot{width:7px;height:7px;border-radius:50%;background:#4a5b73;flex:0 0 7px}
.navlink .dot.part{background:#c99a45}
.navlink .dot.done{background:#3fae94}
.navlink .wlabel{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.navlink .wpct{font-size:.72rem; color:#8b9cb5}
#main{flex:1; min-width:0; padding:26px 30px 90px; max-width:1000px}
#topbar{display:none}

@media(max-width:860px){
  #app{display:block}
  #sidebar{position:fixed; left:-280px; top:0; z-index:60; transition:left .18s ease; height:100vh}
  #sidebar.open{left:0; box-shadow:0 0 0 100vmax rgba(9,16,28,.42)}
  #main{padding:14px 15px 80px; max-width:none}
  #topbar{
    display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:40;
    background:var(--ink); color:#fff; padding:10px 14px; margin:-14px -15px 14px;
  }
  #topbar b{font-family:var(--serif); font-weight:600; font-size:.98rem}
  #menubtn{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:5px 10px;cursor:pointer}
}

/* ---------- primitives ---------- */
.panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-bottom:16px}
.panel.flush{padding:0; overflow:hidden}
.grid{display:grid; gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.spread{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.muted{color:var(--ink2)}
.small{font-size:.86rem}
.tiny{font-size:.78rem}
hr{border:0; border-top:1px solid var(--line2); margin:16px 0}

.btn{
  background:var(--accent); color:#fff; border:1px solid var(--accent); padding:8px 15px;
  border-radius:6px; cursor:pointer; font-size:.9rem; font-weight:520;
}
.btn:hover{background:#1d3a78}
.btn.ghost{background:#fff; color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.quiet{background:#fff; color:var(--ink2); border-color:var(--line)}
.btn.quiet:hover{background:#f4f7fb; color:var(--ink)}
.btn.sm{padding:5px 11px; font-size:.83rem}
.btn:disabled{opacity:.5; cursor:not-allowed}
.btn:focus-visible,.navlink:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.opt:focus-visible{outline:2px solid #4d7fd6; outline-offset:2px}

.tag{
  display:inline-block; font-size:.73rem; padding:2px 8px; border-radius:20px;
  background:var(--accent-soft); color:var(--accent); border:1px solid #d3e0f6; white-space:nowrap;
}
.tag.g{background:var(--good-soft);color:var(--good);border-color:#c7e6df}
.tag.w{background:var(--warn-soft);color:var(--warn);border-color:#eddcbc}
.tag.b{background:var(--bad-soft);color:var(--bad);border-color:#f0ccd5}
.tag.n{background:#f0f2f6;color:var(--ink2);border-color:var(--line)}

.bar{height:7px; background:#e7ebf1; border-radius:4px; overflow:hidden}
.bar>i{display:block; height:100%; background:var(--accent); border-radius:4px}
.bar>i.g{background:var(--good)} .bar>i.w{background:#cf9330} .bar>i.b{background:var(--bad)}

input[type=text],input[type=number],textarea,select{
  font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:6px;
  background:#fff; color:var(--ink); width:100%;
}
textarea{line-height:1.55; resize:vertical}
label.fld{display:block; margin-bottom:12px}
label.fld>span{display:block; font-size:.82rem; color:var(--ink2); margin-bottom:4px}

.stat{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px}
.stat .k{font-size:.78rem; color:var(--ink2)}
.stat .v{font-family:var(--serif); font-size:1.7rem; line-height:1.1; margin-top:3px}
.stat .s{font-size:.76rem; color:var(--ink3)}

.crumb{font-size:.8rem; color:var(--ink2); margin-bottom:6px}
.pagehead{margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--line)}

/* lesson content */
.lesson h3{margin-top:22px}
.block{border-left:3px solid var(--line); padding:2px 0 2px 14px; margin:14px 0}
.block.sim{border-color:#8fb3e8}
.block.formal{border-color:#9aa8bd}
.block.warn{border-color:#d9ab5e}
.def{background:#f7f9fc; border:1px solid var(--line2); border-radius:6px; padding:10px 13px; margin:9px 0}
.def b{font-family:var(--serif)}
.formula{
  background:#f6f8fb; border:1px solid var(--line2); border-left:3px solid var(--accent);
  padding:10px 13px; margin:10px 0; font-family:var(--serif); font-size:1.02rem;
}
.formula .fx{font-size:1.1rem}
ol.steps{padding-left:20px} ol.steps li{margin-bottom:9px}
ul.tight{padding-left:19px; margin:.4em 0} ul.tight li{margin-bottom:5px}
pre{
  background:#0f1b2d; color:#dbe6f5; padding:13px 15px; border-radius:7px; overflow-x:auto;
  font-family:var(--mono); font-size:.83rem; line-height:1.5; margin:10px 0;
}
pre.out{background:#f4f6fa; color:#2c3a4e; border:1px solid var(--line)}
table{border-collapse:collapse; width:100%; font-size:.9rem; margin:10px 0}
th,td{border:1px solid var(--line); padding:6px 9px; text-align:left}
th{background:#f4f7fb; font-weight:600}

/* quiz */
.opt{
  display:block; width:100%; text-align:left; background:#fff; border:1px solid var(--line);
  border-radius:7px; padding:10px 13px; margin-bottom:8px; cursor:pointer; font-size:.93rem;
}
.opt:hover{border-color:#9bb6e0; background:#f8fbff}
.opt.sel{border-color:var(--accent); background:var(--accent-soft)}
.opt.right{border-color:var(--good); background:var(--good-soft)}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
.opt .mk{font-weight:650; margin-right:8px; color:var(--ink2)}
.fb{border-radius:7px; padding:12px 14px; margin-top:12px; font-size:.92rem}
.fb.ok{background:var(--good-soft); border:1px solid #c7e6df}
.fb.no{background:var(--bad-soft); border:1px solid #f0ccd5}
.qmeta{display:flex; justify-content:space-between; font-size:.8rem; color:var(--ink2); margin-bottom:10px}

/* flashcard */
.card3d{
  background:#fff; border:1px solid var(--line); border-radius:10px; padding:34px 24px;
  min-height:210px; display:flex; flex-direction:column; justify-content:center; text-align:center;
  cursor:pointer; box-shadow:0 1px 0 var(--line);
}
.card3d .face{font-family:var(--serif); font-size:1.22rem}
.card3d .back{margin-top:14px; padding-top:14px; border-top:1px solid var(--line2); font-family:var(--sans); font-size:.96rem; text-align:left}
.rate{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px}
.rate button{padding:9px 4px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; font-size:.85rem}
.rate button b{display:block; font-size:.72rem; color:var(--ink3); font-weight:500}
.rate button:hover{background:#f4f7fb}

/* tutor chat */
.chat{max-height:60vh; overflow-y:auto; padding-right:4px}
.msg{margin-bottom:12px; display:flex; gap:9px}
.msg .who{flex:0 0 30px; height:30px; border-radius:50%; background:var(--accent-soft); color:var(--accent);
  display:flex; align-items:center; justify-content:center; font-size:.75rem; font-weight:650}
.msg.me .who{background:#eef0f4; color:var(--ink2)}
.msg .body{flex:1; background:#f7f9fc; border:1px solid var(--line2); border-radius:8px; padding:10px 13px; font-size:.93rem}
.msg.me .body{background:#fff}
.msg .body p:last-child{margin-bottom:0}

.searchrow{border-bottom:1px solid var(--line2); padding:11px 2px}
.searchrow:last-child{border-bottom:0}
.searchrow a{cursor:pointer; text-decoration:none; font-weight:550}
.pill{display:inline-flex; gap:6px; align-items:center; background:#f2f5f9; border:1px solid var(--line);
  border-radius:20px; padding:4px 11px; font-size:.82rem; cursor:pointer}
.pill.on{background:var(--accent); color:#fff; border-color:var(--accent)}
.empty{text-align:center; padding:34px 18px; color:var(--ink2)}
.empty b{display:block; font-family:var(--serif); font-size:1.05rem; color:var(--ink); margin-bottom:6px}
.timer{font-family:var(--mono); font-size:1.05rem; font-weight:600}
.timer.low{color:var(--bad)}
.srconly{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const LESSONS = {

 simple:'The course moves in one direction: describe data, then model uncertainty with probability, then use probability to make claims about a population from a sample. Everything after Week 7 is that last step.',
 formal:'The course is organised in three blocks. Weeks 1–2 cover exploratory data analysis (distributions, relationships, sampling and design). Weeks 3–6 develop probability, random variables and distributions. Weeks 7–12 develop statistical inference: sampling distributions, estimation, hypothesis testing, and inference for relationships between two variables. Running in parallel is a data-analysis project assessed through four assignments, an oral presentation and a mini manuscript.',

 defs:[['Population','The entire collection of units you want to describe.'],
       ['Sample','The subset of the population you actually measure.'],
       ['Parameter','A number describing the population (μ, σ, p). Usually unknown.'],

 steps:[{h:'Classify a variable correctly', b:'Ask whether an average of the values would mean anything. Mean student ID number is meaningless, so ID is categorical even though it is written with digits. Mean number of children per household is meaningful, so it is quantitative.'},

 simple:'The distribution of a variable is the full answer to "what values happen, and how often?" You describe it by shape, centre, spread, and anything unusual.',
 formal:'The distribution of a variable lists its possible values and the frequency (or relative frequency) of each. For a categorical variable, display with a bar chart or pie chart and summarise with percentages. For a quantitative variable, display with a histogram, stemplot or boxplot and describe four features: shape (symmetric, right-skewed, left-skewed, unimodal, bimodal), centre (mean or median), spread (range, IQR, standard deviation) and outliers. Mean and standard deviation are non-resistant: a single extreme value moves them. Median and IQR are resistant. Consequently, skewed distributions are described with median and IQR; roughly symmetric distributions with mean and standard deviation.',

       ['IQR','Q3 − Q1: the width of the middle 50% of the data.'],
       ['1.5×IQR rule','Flag an observation as a suspected outlier if it is below Q1 − 1.5·IQR or above Q3 + 1.5·IQR.']],
 steps:[{h:'Worked example — five-number summary and outliers', b:'Data (n = 11), already ordered: 2, 4, 5, 7, 8, 9, 11, 12, 15, 18, 40.<br>Median = 6th value = 9.<br>Q1 = median of the lower five values (2,4,5,7,8) = 5. Q3 = median of the upper five (11,12,15,18,40) = 15.<br>IQR = 15 − 5 = 10. Lower fence = 5 − 15 = −10. Upper fence = 15 + 15 = 30.<br>40 &gt; 30, so 40 is a suspected outlier. Note the mean is 11.9 but the median is 9 — the single large value has dragged the mean up. Report median and IQR here.'},
        {h:'Describing shape in one sentence', b:'"The distribution of monthly income is right-skewed and unimodal, centred near GH₵1,200 (median), with an IQR of about GH₵900 and one high outlier above GH₵9,000." Shape, centre, spread, outliers — in that order, with context and units.'}],
 visual:'<svg viewBox="0 0 460 130" width="100%" height="130" role="img" aria-label="Symmetric, right-skewed and left-skewed distribution shapes"><g fill="#27488f" opacity=".8"><rect x="14" y="82" width="14" height="26"/><rect x="30" y="62" width="14" height="46"/><rect x="46" y="40" width="14" height="68"/><rect x="62" y="30" width="14" height="78"/><rect x="78" y="40" width="14" height="68"/><rect x="94" y="62" width="14" height="46"/><rect x="110" y="82" width="14" height="26"/></g><g fill="#0e7f6f" opacity=".8"><rect x="176" y="30" width="14" height="78"/><rect x="192" y="42" width="14" height="66"/><rect x="208" y="60" width="14" height="48"/><rect x="224" y="76" width="14" height="32"/><rect x="240" y="88" width="14" height="20"/><rect x="256" y="96" width="14" height="12"/><rect x="272" y="101" width="14" height="7"/></g><g fill="#b06a12" opacity=".8"><rect x="332" y="101" width="14" height="7"/><rect x="348" y="96" width="14" height="12"/><rect x="364" y="88" width="14" height="20"/><rect x="380" y="76" width="14" height="32"/><rect x="396" y="60" width="14" height="48"/><rect x="412" y="42" width="14" height="66"/><rect x="428" y="30" width="14" height="78"/></g><g font-size="11" fill="#4a5a70" font-family="sans-serif"><text x="42" y="124">symmetric</text><text x="196" y="124">right-skewed</text><text x="356" y="124">left-skewed</text></g></svg>',
 mistakes:['Drawing a histogram with gaps between bars, or a bar chart with bars touching.','Reporting the mean for an obviously skewed variable such as income.','Calling every extreme value an outlier without applying the 1.5×IQR rule.','Describing a distribution without context or units.'],
 keyf:['iqr','fences'],
 checks:[{q:'A histogram of household size is right-skewed. Which is larger, the mean or the median, and which pair should you report?',
   a:'The mean is larger — the long right tail pulls it above the median. Report the median and IQR, because they are resistant to the tail.'},
  {q:'For the data 3, 6, 6, 8, 9, 10, 22, is 22 a suspected outlier by the 1.5×IQR rule?',
   a:'Median = 8. Q1 = 6 (median of 3,6,6), Q3 = 10 (median of 9,10,22). IQR = 4. Upper fence = 10 + 6 = 16. Since 22 > 16, yes — 22 is a suspected outlier.'}]},

'examining-relationships':{t:'Examining relationships (OLI Module 5)', area:'rel', w:1,
 simple:'Once you have two variables you ask whether knowing one tells you anything about the other. Which display you use depends on the types of the two variables.',
 formal:'A relationship exists between two variables when the distribution of the response variable changes across values of the explanatory variable. The role of each variable and its type determine the tool. The four cases, which the course returns to in Week 12, are: C→Q (categorical explanatory, quantitative response) — side-by-side boxplots, compare group means; C→C — two-way table with conditional (row or column) percentages, plus a segmented bar chart; Q→Q — scatterplot, described by direction, form, strength; correlation r and least-squares regression. Q→C is normally re-expressed as C→Q or handled with logistic methods beyond this course.',
 defs:[['Explanatory variable','The variable you think does the explaining (x). Sometimes called independent or predictor.'],
       ['Response variable','The variable you think is affected (y). Sometimes called dependent or outcome.'],
       ['Correlation r','A number between −1 and 1 measuring the strength and direction of a linear relationship between two quantitative variables.'],
       ['Least-squares regression line','ŷ = a + bx, the line minimising the sum of squared vertical distances from the points.'],
       ['Conditional percentage','A percentage computed within a row or column of a two-way table, so groups of different sizes can be compared fairly.']],
 steps:[{h:'Worked example — conditional percentages', b:'Of 200 urban residents, 60 own a car; of 50 rural residents, 20 own a car. Raw counts suggest urban ownership is higher (60 vs 20), but that only reflects group sizes.<br>Urban: 60/200 = 30%. Rural: 20/50 = 40%.<br>Conditioning on residence reverses the impression. Always percent within the explanatory variable.'},
        {h:'Reading a scatterplot', b:'Report direction (positive/negative), form (linear/curved), strength (tight/loose scatter), then outliers. Only after form is judged linear is r meaningful.'}],
 mistakes:['Computing percentages out of the grand total when the comparison requires conditioning on the explanatory variable.','Reporting r for a clearly curved relationship — r only measures linear association.','Swapping explanatory and response roles, which changes the regression line (though not r).'],
 keyf:['corr','regline'],
 checks:[{q:'Which display and summary fit each pair: (a) region and monthly income, (b) hours studied and exam score, (c) sex and smoking status?',
   a:'(a) C→Q: side-by-side boxplots, compare medians/means and spreads. (b) Q→Q: scatterplot, then r and a regression line if the form is linear. (c) C→C: two-way table with conditional percentages within sex, plus a segmented bar chart.'}]},

'variability':{t:'Measures of variability', area:'desc', w:2,
 simple:'Centre alone hides everything interesting. Two classes can both average 60% — one with every student near 60, one with half at 30 and half at 90.',
 formal:'Variability quantifies how far observations sit from one another. Range = max − min, which uses only two values. IQR = Q3 − Q1, the spread of the middle 50%, resistant to outliers. The sample variance s² = Σ(xᵢ − x̄)²/(n − 1) is the mean squared deviation about x̄, with divisor n − 1 (the degrees of freedom) so that s² is unbiased for σ². The sample standard deviation s = √s² returns to the original units and is the standard measure of spread for roughly symmetric distributions. s = 0 exactly when all observations are identical; s is never negative and is inflated by outliers.',
 defs:[['Deviation','xᵢ − x̄, the signed distance from the mean. Deviations always sum to zero, which is why they are squared before averaging.'],
       ['Degrees of freedom','n − 1 for a sample: once x̄ is fixed, only n − 1 deviations are free to vary.'],
       ['Standard deviation','Roughly the typical distance of an observation from the mean, in the original units.'],
       ['Empirical Rule (68–95–99.7)','For a distribution that is approximately normal: about 68% of values lie within 1 SD of the mean, 95% within 2 SD, 99.7% within 3 SD.']],
 steps:[{h:'Worked calculation of s', b:'Data: 4, 8, 6, 10, 12 (n = 5).<br>x̄ = 40/5 = 8.<br>Deviations: −4, 0, −2, 2, 4. (Sum = 0 — a useful check.)<br>Squared: 16, 0, 4, 4, 16 → Σ = 40.<br>s² = 40/(5 − 1) = 10.<br>s = √10 ≈ 3.16, in the same units as the data.'},
        {h:'Applying the Empirical Rule', b:'Exam scores are approximately normal with mean 72 and SD 8. Then about 68% of scores fall in 72 ± 8 = (64, 80); about 95% in 72 ± 16 = (56, 88); about 99.7% in 72 ± 24 = (48, 96). A score of 90 is above the 95% band, so it is unusual — roughly the top 1.2%.'}],
 mistakes:['Dividing by n instead of n − 1 for a sample.','Forgetting to take the square root, and reporting the variance as if it were the SD (units are squared).','Applying the Empirical Rule to a skewed distribution — it requires approximate normality.','Reporting SD with a median: pair mean with SD, median with IQR.'],
 keyf:['var','sd','emp'],
 checks:[{q:'Heights are approximately normal, mean 168 cm, SD 6 cm. Between which heights do about 95% of people fall, and what fraction is above 180 cm?',
   a:'95% lie within 2 SD: 168 ± 12 = 156 cm to 180 cm. 180 cm is exactly 2 SD above the mean, so about (100 − 95)/2 = 2.5% of people are taller than 180 cm.'},
  {q:'Why can the standard deviation never be negative?',
   a:'It is the square root of an average of squared deviations. Squares are non-negative, so s² ≥ 0 and s = √s² ≥ 0. It equals 0 only when every observation equals the mean.'}]},

'sampling-techniques':{t:'Sampling techniques (OLI Module 6)', area:'samp', w:2,
 simple:'The way you pick people decides whether your numbers mean anything. Random selection is what buys you the right to generalise.',
 formal:'A sampling frame is the list from which the sample is drawn. Probability sampling gives every unit a known, non-zero chance of selection and is what justifies inference. Simple random sampling (SRS): every sample of size n is equally likely. Stratified sampling: divide the population into homogeneous strata and take an SRS within each; this reduces variability when strata differ. Cluster sampling: divide into naturally occurring clusters, randomly select whole clusters, measure all units within; cheaper but usually less precise. Systematic sampling: choose a random start and take every k-th unit. Non-probability methods — convenience, volunteer/self-selected — produce selection bias of unknown size, which a larger sample does not fix.',
 defs:[['Bias','A systematic tendency to over- or under-estimate; it does not shrink as n grows.'],
       ['Sampling variability','The natural difference between samples; it does shrink as n grows.'],
       ['Undercoverage','Part of the population is left out of the sampling frame.'],
       ['Nonresponse bias','Selected units do not respond, and non-responders differ systematically from responders.'],
       ['Response bias','Wording, interviewer effects or social pressure distort the answers given.']],
 steps:[{h:'Choosing a design', b:'Population: 4,000 Ashesi students across four year groups. To guarantee representation of each year, stratify by year group and take an SRS within each stratum proportional to its size. To save travel cost when surveying villages, cluster on villages and survey everyone in the selected ones. To sample a stream of arrivals with no list available, use systematic sampling with a random start.'},
        {h:'Identifying the bias', b:'"We put the survey link in the student WhatsApp group and used the first 200 replies." Two problems: undercoverage (students not in the group cannot be selected) and volunteer response bias (people with strong opinions reply first). Increasing to 2,000 replies does not remove either.'}],
 mistakes:['Believing a big sample fixes bias — it only reduces variability.','Confusing stratified (sample within every group) with cluster (sample entire groups).','Calling a convenience sample "random" because the researcher did not consciously choose who joined.'],
 keyf:[],
 checks:[{q:'A researcher stands outside the library at 10 a.m. and interviews the first 100 students who pass. Name the sampling method and the main threat to validity.',
   a:'Convenience sampling — a non-probability method. The main threat is selection bias: students who use the library at 10 a.m. differ systematically from the student body (timetable, discipline, study habits), so the sample is not representative and no valid inference to all students is justified.'}]},

'designing-studies':{t:'Designing studies (OLI Module 7)', area:'design', w:2,
 simple:'Observational studies watch; experiments intervene. Only the intervention lets you claim cause.',
 formal:'In an observational study the researcher records variables without assigning treatments; observed associations may be produced by lurking variables. In an experiment the researcher assigns the explanatory variable (the treatment). Randomised assignment balances all other variables, measured and unmeasured, across treatment groups on average, so a difference in response can be attributed to the treatment. The principles of experimental design are control (hold other conditions constant, include a control group), randomisation (assign units to treatments by chance), replication (enough units per treatment) and blinding (subjects and/or assessors do not know the assignment) to guard against the placebo effect and assessor bias. Randomised assignment supports causal claims; random selection supports generalisation. They are separate ideas and a study may have one, both or neither.',
 defs:[['Lurking (confounding) variable','A variable not included in the analysis that is related to both the explanatory and the response variable, so its effect cannot be separated from theirs.'],
       ['Placebo effect','A response to the act of being treated rather than to the treatment itself.'],
       ['Double-blind','Neither the subjects nor those measuring the response know who received which treatment.'],
       ['Retrospective / prospective','Observational studies looking backwards at existing records, or forwards by following subjects over time.']],
 steps:[{h:'Spotting the confounder', b:'Claim: "Coffee drinkers have higher lung cancer rates, so coffee causes lung cancer." Smoking is associated with both coffee drinking and lung cancer, so the coffee–cancer association is confounded by smoking. Only random assignment of coffee (impractical and unethical here) would break that link.'},
        {h:'The two randomisations', b:'Randomly selecting 500 adults from the national register and then randomly assigning each to drug or placebo gives both generalisability and causal warrant. Recruiting 500 volunteers but randomly assigning treatment still supports a causal claim — for people like the volunteers.'}],
 mistakes:['Reading "randomised" and assuming it means random selection.','Concluding causation from an observational study, however large.','Calling a study an experiment when the researcher only measured an existing group difference (e.g. comparing smokers with non-smokers).'],
 keyf:[],
 checks:[{q:'Researchers randomly assign 80 volunteers to a new study technique or their usual technique, then compare exam scores. Can they claim causation? Can they generalise to all students?',
   a:'Causation, yes — treatment was randomly assigned, so on average the groups differ only in technique. Generalisation, no — the subjects were volunteers, not a random sample of students, so the causal conclusion applies to people like those volunteers.'}]},

'prob-intro':{t:'Introduction to probability (OLI Module 8)', area:'prob', w:3,
 simple:'Probability is the long-run share of times something happens. Any single outcome is unpredictable; the pattern over many repetitions is not.',
 formal:'A random experiment has a sample space S of all possible outcomes; an event is any subset of S. The probability of event A, P(A), satisfies 0 ≤ P(A) ≤ 1 and P(S) = 1. Three interpretations are used: classical (equally likely outcomes, P(A) = number of outcomes in A ÷ number in S), empirical or relative frequency (P(A) ≈ number of times A occurred ÷ number of repetitions), and subjective (a personal degree of belief). The law of large numbers guarantees that the empirical probability converges to the true probability as the number of independent repetitions grows.',
 defs:[['Sample space S','The set of all possible outcomes of a random experiment.'],
       ['Event','A subset of the sample space; probability is assigned to events.'],
       ['Complement Aᶜ','All outcomes not in A. P(Aᶜ) = 1 − P(A).'],
       ['Law of large numbers','As repetitions increase, the relative frequency of an event converges to its probability.'],
       ['Empirical probability','An estimate of probability from observed data rather than from theory.']],
 steps:[{h:'Classical calculation', b:'Rolling two fair dice, S has 36 equally likely outcomes. Event A = "sum is 7" contains (1,6),(2,5),(3,4),(4,3),(5,2),(6,1) — six outcomes. P(A) = 6/36 = 1/6 ≈ 0.167.'},
        {h:'Empirical estimate', b:'In 500 tosses of a real drawing pin, it lands point-up 290 times. The empirical probability is 290/500 = 0.58. There is no classical calculation available here — the outcomes are not equally likely — so data is the only route.'},
        {h:'Using the complement', b:'P(at least one head in 3 fair tosses) = 1 − P(no heads) = 1 − (1/2)³ = 1 − 1/8 = 7/8. "At least one" almost always signals the complement rule.'}],
 mistakes:['Assuming outcomes are equally likely when they are not (a biased coin, an irregular spinner).','The gambler\'s fallacy: believing past independent results change the next probability.','Reporting a probability outside [0, 1], or summing probabilities over a sample space to something other than 1.'],
 keyf:['complement'],
 checks:[{q:'A bag holds 4 red, 6 blue and 10 green beads. One is drawn at random. Find P(not green).',
   a:'Total = 20. P(green) = 10/20 = 0.5, so P(not green) = 1 − 0.5 = 0.5. Equivalently (4 + 6)/20 = 0.5.'},
  {q:'A coin has landed heads five times in a row. What is the probability the next toss is heads, and why?',
   a:'0.5, if the coin is fair. Tosses are independent, so previous outcomes carry no information about the next one. Believing otherwise is the gambler\'s fallacy.'}]},

'prob-events':{t:'Finding the probability of events (OLI Module 9)', area:'prob', w:3,
 simple:'Two rules do most of the work: add for "or", multiply for "and". Both have a correction term you must not skip.',
 formal:'The general addition rule is P(A or B) = P(A) + P(B) − P(A and B); the subtraction prevents double counting the overlap. Events are disjoint (mutually exclusive) when P(A and B) = 0, and only then does P(A or B) = P(A) + P(B). The general multiplication rule is P(A and B) = P(A)·P(B|A); when A and B are independent, P(B|A) = P(B) and the rule simplifies to P(A and B) = P(A)·P(B). Disjoint and independent are different and, for events of non-zero probability, incompatible: if A and B are disjoint, then knowing A occurred tells you B did not, which is maximum dependence.',
 defs:[['Disjoint / mutually exclusive','A and B cannot both occur: P(A and B) = 0.'],
       ['Independent','Whether A occurs does not change the probability of B: P(B|A) = P(B).'],
       ['Union (A or B)','At least one of the two events occurs — inclusive "or".'],
       ['Intersection (A and B)','Both events occur.']],
 steps:[{h:'Addition rule with overlap', b:'In a class, P(takes Statistics) = 0.60, P(takes Economics) = 0.45, P(takes both) = 0.25.<br>P(Statistics or Economics) = 0.60 + 0.45 − 0.25 = 0.80.<br>So 20% take neither. Without the −0.25 you would wrongly get 1.05, which is impossible.'},
        {h:'Multiplication with and without replacement', b:'A box has 5 defective and 15 good items.<br>With replacement: P(two defective) = (5/20)(5/20) = 0.0625, independent draws.<br>Without replacement: P(two defective) = (5/20)(4/19) = 0.0526, because the first draw changes the second.'},
        {h:'Checking independence numerically', b:'A and B are independent exactly when P(A and B) = P(A)·P(B). With P(A) = 0.6, P(B) = 0.45, P(A and B) = 0.25: the product is 0.27 ≠ 0.25, so the two subject choices are (slightly) dependent.'}],
 mistakes:['Adding probabilities of events that overlap without subtracting the intersection.','Multiplying probabilities for dependent events — sampling without replacement is the usual trap.','Treating "disjoint" and "independent" as synonyms.'],
 keyf:['addition','multiplication','complement'],
 checks:[{q:'P(A) = 0.5, P(B) = 0.3, and A and B are independent. Find P(A and B) and P(A or B).',
   a:'P(A and B) = 0.5 × 0.3 = 0.15. P(A or B) = 0.5 + 0.3 − 0.15 = 0.65.'},
  {q:'Can two events with P(A) = 0.5 and P(B) = 0.3 be both disjoint and independent?',
   a:'No. Disjoint means P(A and B) = 0; independent means P(A and B) = 0.5 × 0.3 = 0.15. These cannot both hold when both probabilities are non-zero.'}]},

'assoc-causation':{t:'Association versus causation', area:'design', w:3,
 simple:'Two things moving together is evidence of a pattern, not proof of a mechanism.',
 formal:'An association means the distribution of Y differs across values of X. Four explanations compete for any observed association: (1) X causes Y; (2) Y causes X (reverse causation); (3) a lurking variable causes both (confounding); (4) chance, particularly in small samples. Observational data cannot separate these; randomised assignment eliminates (3) by design and the direction of assignment eliminates (2). Where experimentation is impossible, causal arguments are strengthened by consistency across studies, a dose–response gradient, temporal ordering, plausible mechanism and control for known confounders — but they remain weaker than randomised evidence.',
 defs:[['Association','A statistical relationship — knowing X changes what you expect for Y.'],
       ['Causation','Changing X would change Y.'],
       ['Reverse causation','The response is actually driving the supposed explanatory variable.'],
       ['Simpson\'s paradox','An association present in every subgroup can reverse when the subgroups are combined, because of a lurking variable.']],
 steps:[{h:'Working through the four explanations', b:'Finding: cities with more police officers have more crime.<br>(1) Police cause crime — implausible.<br>(2) Reverse causation — high crime causes cities to hire more police. Very plausible.<br>(3) Confounding — city population drives both.<br>(4) Chance — unlikely across many cities.<br>The sensible reading is (2) plus (3), not (1).'}],
 mistakes:['Writing "X leads to Y" in a report when the design only supports "X is associated with Y".','Ignoring reverse causation, which is often the most plausible rival explanation.','Assuming a large sample rules out confounding — it does not.'],
 keyf:[],
 checks:[{q:'Data show children who eat breakfast score higher on tests. Give one plausible confounder and rewrite the conclusion appropriately.',
   a:'Household income (or parental involvement) plausibly causes both regular breakfast and higher scores. Appropriate wording: "Eating breakfast is associated with higher test scores in this sample; the observational design does not establish that breakfast causes the difference."'}]},

'codebooks':{t:'Codebooks', area:'proj', w:3,
 simple:'A codebook is the dictionary for your dataset. Without it, a column of 1s and 2s means nothing.',
 formal:'A codebook documents, for every variable in a dataset: the variable name as it appears in the data file, the full question or measurement it came from, the variable type (categorical or quantitative), the response options with their numeric codes, the units of measurement, and the codes used for missing data. A personal codebook is the subset of variables you have selected for your own research questions, together with any recoded or derived variables you create. Producing it before analysis forces you to confirm that each variable can actually answer your question.',
 defs:[['Variable name','The exact column label used in the data file — case sensitive in R.'],
       ['Value labels','The mapping from stored codes to meanings, e.g. 1 = Yes, 2 = No, 9 = Refused.'],
       ['Missing data codes','Values such as 9, 99, −1 or NA reserved for "not asked", "refused", "don\'t know". These must be converted to NA before analysis.'],
       ['Derived variable','A new variable you construct, e.g. collapsing five income bands into three, or converting a count into a rate.']],
 steps:[{h:'A minimal personal codebook row', b:'<table><tr><th>Name</th><th>Question</th><th>Type</th><th>Values</th><th>Missing</th></tr><tr><td>S1Q1</td><td>Have you ever used the health centre?</td><td>Categorical</td><td>1 = Yes, 2 = No</td><td>9 = Unknown → NA</td></tr><tr><td>AGE</td><td>Age at last birthday</td><td>Quantitative (years)</td><td>18–98</td><td>99 → NA</td></tr></table>'},
        {h:'Why the missing codes matter', b:'If 99 is left in an age column, the mean age is inflated by every non-response. Recode first: <code>data$AGE[data$AGE == 99] &lt;- NA</code>, then use <code>mean(data$AGE, na.rm = TRUE)</code>.'}],
 mistakes:['Analysing coded categorical variables as if they were numeric.','Leaving missing-data codes (9, 99, −1) in the data, silently corrupting means and standard deviations.','Renaming variables without recording the original names, making the analysis impossible to check.'],
 keyf:[],
 checks:[{q:'A survey codes marital status 1–6 and uses 9 for "refused". A classmate reports the mean marital status as 2.8. What are the two errors?',
   a:'First, marital status is categorical — a mean is meaningless; report percentages in each category. Second, the code 9 has been treated as a real value, inflating the number. Recode 9 to NA before any summary.'}]},

'research-questions':{t:'Research questions', area:'proj', w:3,
 simple:'A good research question already tells you which variables you need and which analysis you will run.',
 formal:'A usable quantitative research question names a population, an explanatory variable, a response variable, and the type of relationship examined. Its structure determines the analysis case: C→Q, C→C, Q→Q or Q→C. Questions should be answerable with the variables available in the dataset, specific about the population, and neutral in wording. A moderating (third) variable may be added later to ask whether the relationship differs across subgroups.',
 defs:[['Population of interest','Whom the answer is about — determined by the sampling design of the dataset.'],
       ['Explanatory variable','The variable hypothesised to explain variation in the response.'],
       ['Response variable','The outcome being explained.'],
       ['Moderator','A third variable that changes the strength or direction of the X–Y relationship.']],
 steps:[{h:'Sharpening a vague question', b:'Weak: "Is health related to income?"<br>Better: "Among Ghanaian adults aged 18–65 in the dataset, is household income (quantitative) associated with self-reported health status (categorical, 5 levels)?"<br>The improved version names the population, both variables and their types — so you know the case is Q→C, which you would usually re-express as C→Q by comparing income across health categories.'},
        {h:'Adding a moderator', q:'', b:'"Does the association between income and self-reported health differ between urban and rural residents?" This is the moderation question you meet in Week 12.'}],
 mistakes:['Asking a question the dataset cannot answer because the variable was never measured.','Embedding the conclusion in the question ("Why does poverty cause poor health?").','Leaving variable types unstated, so the correct analysis is unclear.'],
 keyf:[],
 checks:[{q:'Classify this question and name the display you would use: "Do students who work part-time have lower CGPAs than students who do not?"',
   a:'Explanatory: part-time work (categorical, yes/no). Response: CGPA (quantitative). This is C→Q — use side-by-side boxplots and compare means, later tested with a two-sample t-test.'}]},

'cond-prob':{t:'Conditional probability (OLI Module 10)', area:'cond', w:4,
 simple:'Conditional probability is what happens to a probability once you are told something. You throw away the part of the sample space that has been ruled out and recompute.',
 formal:'For events A and B with P(A) > 0, the conditional probability of B given A is P(B|A) = P(A and B)/P(A). Conditioning restricts the sample space to A, so P(A) becomes the new denominator. Rearranging gives the general multiplication rule P(A and B) = P(A)·P(B|A). The law of total probability decomposes an event across a partition: P(B) = P(A)P(B|A) + P(Aᶜ)P(B|Aᶜ). Combining these gives Bayes\' rule, P(A|B) = P(A)P(B|A)/P(B), which reverses the direction of conditioning. Note that P(A|B) and P(B|A) are in general very different quantities; confusing them is the base-rate fallacy.',
 defs:[['P(B|A)','The probability of B in the restricted world where A has occurred.'],
       ['Law of total probability','P(B) = ΣP(Aᵢ)P(B|Aᵢ) over a partition A₁…Aₖ of the sample space.'],
       ['Bayes\' rule','Converts P(B|A) into P(A|B) using the prior P(A).'],
       ['Base rate','The unconditional probability P(A) before any evidence is considered.']],
 steps:[{h:'From a two-way table', b:'<table><tr><th></th><th>Passed</th><th>Failed</th><th>Total</th></tr><tr><th>Studied</th><td>70</td><td>10</td><td>80</td></tr><tr><th>Did not</th><td>15</td><td>25</td><td>40</td></tr><tr><th>Total</th><td>85</td><td>35</td><td>120</td></tr></table>P(Passed | Studied) = 70/80 = 0.875 — restrict to the 80 who studied.<br>P(Studied | Passed) = 70/85 ≈ 0.824 — restrict to the 85 who passed.<br>Same cell, different denominators, different meanings.'},
        {h:'Medical testing with Bayes\' rule', b:'A disease affects 1% of a population. A test has sensitivity P(+|D) = 0.99 and specificity P(−|no D) = 0.95, so P(+|no D) = 0.05.<br>Total probability: P(+) = (0.01)(0.99) + (0.99)(0.05) = 0.0099 + 0.0495 = 0.0594.<br>Bayes: P(D|+) = 0.0099/0.0594 ≈ 0.167.<br>Only about 17% of positives are true positives, because the 99% of healthy people generate many more false positives than the 1% generate true ones. The base rate dominates.'}],
 mistakes:['Swapping P(A|B) with P(B|A) — the prosecutor\'s fallacy.','Using the grand total as the denominator instead of the conditioning event\'s total.','Ignoring the base rate when a test result sounds impressive.'],
 keyf:['cond','total','bayes'],
 checks:[{q:'Using the table above, compute P(Failed | Did not study) and P(Did not study | Failed).',
   a:'P(Failed | Did not study) = 25/40 = 0.625 (denominator: the 40 who did not study). P(Did not study | Failed) = 25/35 ≈ 0.714 (denominator: the 35 who failed).'},
  {q:'P(A) = 0.4, P(B|A) = 0.3, P(B|Aᶜ) = 0.6. Find P(B).',
   a:'P(B) = (0.4)(0.3) + (0.6)(0.6) = 0.12 + 0.36 = 0.48 by the law of total probability.'}]},

'independence':{t:'Independence', area:'cond', w:4,
 simple:'Two events are independent when learning one happened does not shift the odds of the other.',
 formal:'Events A and B are independent if P(B|A) = P(B), equivalently P(A|B) = P(A), equivalently P(A and B) = P(A)·P(B). Any one of these can be used as the test; the product form is usually easiest with a two-way table. Independence is a property of probabilities, not of physical separation, and must be verified numerically rather than assumed. Sampling without replacement creates dependence, though the dependence is negligible when the sample is less than about 10% of the population — the 10% condition used later for inference.',
 defs:[['Independent events','P(A and B) = P(A)·P(B).'],
       ['Dependent events','The occurrence of one changes the probability of the other.'],
       ['10% condition','When sampling without replacement, treating draws as independent is acceptable if n ≤ 0.10N.']],
 steps:[{h:'Testing independence from a table', b:'Using the studied/passed table: P(Passed) = 85/120 ≈ 0.708. P(Passed | Studied) = 0.875.<br>0.875 ≠ 0.708, so passing and studying are dependent — which is the whole point of the study.'},
        {h:'When approximate independence is fine', b:'Drawing 50 students from a university of 4,000 without replacement: 50/4000 = 1.25% ≤ 10%, so treating the draws as independent introduces negligible error.'}],
 mistakes:['Assuming independence because two events "feel unrelated" instead of checking the numbers.','Treating successive draws without replacement from a small population as independent.','Concluding independence from disjointness.'],
 keyf:['indep'],
 checks:[{q:'In a survey, P(owns a smartphone) = 0.8, P(uses mobile money) = 0.6, P(both) = 0.55. Are the two independent?',
   a:'If independent, P(both) would be 0.8 × 0.6 = 0.48. The observed 0.55 is larger, so the events are dependent — smartphone owners are more likely than average to use mobile money.'}]}
};

Object.assign(LESSONS, {

'random-variables':{t:'Random variables (OLI Module 11)', area:'rv', w:5,
 simple:'A random variable is a rule that attaches a number to every outcome of a random experiment, so you can do arithmetic with chance.',
 formal:'A random variable X is a function assigning a numerical value to each outcome in the sample space. X is discrete if its possible values can be listed (finite or countably infinite), and continuous if it can take any value in an interval. A discrete random variable is described by its probability distribution, a list of values xᵢ with probabilities P(X = xᵢ) satisfying 0 ≤ P(X = xᵢ) ≤ 1 and ΣP(X = xᵢ) = 1. Its expected value is μ = E(X) = Σ xᵢ·P(X = xᵢ), the long-run average value over infinitely many repetitions, and its variance is σ² = Σ(xᵢ − μ)²·P(X = xᵢ), with σ = √σ². The expected value need not be an attainable value of X.',
 defs:[['Random variable','A numerical outcome of a random process, written with a capital letter (X); a realised value is written in lower case (x).'],
       ['Probability distribution','The full list of values and their probabilities.'],
       ['Expected value E(X)','The probability-weighted mean of the possible values.'],
       ['Variance of X','The probability-weighted mean squared deviation from μ.']],
 steps:[{h:'Worked example — expected value and SD', b:'A stall charges GH₵5 per play. X = winnings: GH₵0 with probability 0.7, GH₵5 with probability 0.25, GH₵50 with probability 0.05.<br>μ = 0(0.7) + 5(0.25) + 50(0.05) = 0 + 1.25 + 2.5 = GH₵3.75.<br>Since the ticket costs GH₵5, the expected profit per play is 3.75 − 5 = −GH₵1.25: a long-run loss of GH₵1.25 per play.<br>σ² = (0−3.75)²(0.7) + (5−3.75)²(0.25) + (50−3.75)²(0.05) = 9.844 + 0.391 + 107.05 = 117.28, so σ ≈ GH₵10.83.'},
        {h:'Checking a distribution is valid', b:'Every probability must lie in [0, 1] and the probabilities must sum to exactly 1. If a table gives 0.2, 0.3, 0.4 for the only three values, it is not a valid distribution — the total is 0.9.'}],
 mistakes:['Expecting E(X) to be one of the listed values — the mean of a die roll is 3.5, which never occurs.','Averaging the values without weighting by their probabilities.','Forgetting to subtract the cost when the question asks for expected profit rather than expected winnings.'],
 keyf:['ev','varx'],
 checks:[{q:'X takes values 1, 2, 3 with probabilities 0.5, 0.3, 0.2. Find E(X).',
   a:'E(X) = 1(0.5) + 2(0.3) + 3(0.2) = 0.5 + 0.6 + 0.6 = 1.7.'},
  {q:'Why is the expected value of a fair six-sided die 3.5 even though 3.5 is impossible to roll?',
   a:'E(X) is the long-run average of many rolls, not a prediction of any single roll. Averaging 1–6 each with probability 1/6 gives 21/6 = 3.5.'}]},

'discrete-dist':{t:'Discrete probability distributions', area:'rv', w:5,
 simple:'Any table of values and probabilities that sums to one is a discrete distribution. You read probabilities off it by adding the rows you need.',
 formal:'A discrete probability distribution assigns probability mass to each attainable value. The cumulative distribution F(x) = P(X ≤ x) accumulates these masses, which is how "at most", "fewer than", "at least" and "more than" questions are answered. Because the values are isolated points, the inequality matters: P(X < 3) excludes 3 while P(X ≤ 3) includes it. Displays use a probability histogram, with bar heights equal to probabilities rather than counts.',
 defs:[['Probability mass function','P(X = x) for each possible value x.'],
       ['Cumulative probability','F(x) = P(X ≤ x), the running total.'],
       ['At least / at most','"At least k" means X ≥ k; "at most k" means X ≤ k. "More than k" means X > k, i.e. X ≥ k + 1 for integers.']],
 steps:[{h:'Reading a table', b:'Number of children X in a household: P(0)=0.15, P(1)=0.25, P(2)=0.30, P(3)=0.20, P(4)=0.10.<br>P(X ≤ 2) = 0.15 + 0.25 + 0.30 = 0.70.<br>P(X ≥ 3) = 0.20 + 0.10 = 0.30, or 1 − 0.70 using the complement.<br>P(1 ≤ X < 3) = P(1) + P(2) = 0.55.'},
        {h:'Complement as a shortcut', b:'For "at least one", compute 1 − P(0). With P(0) = 0.15, P(at least one child) = 0.85 — one subtraction instead of four additions.'}],
 mistakes:['Dropping or including the endpoint incorrectly for discrete variables.','Summing to a value other than 1 and not noticing the distribution is invalid.','Using the complement rule but forgetting that "at least 1" is the complement of "exactly 0", not of "1".'],
 keyf:['complement'],
 checks:[{q:'Using the household table above, find P(X > 2) and P(X ≠ 2).',
   a:'P(X > 2) = P(3) + P(4) = 0.20 + 0.10 = 0.30. P(X ≠ 2) = 1 − 0.30 = 0.70.'}]},

'binomial':{t:'The binomial distribution', area:'rv', w:5,
 simple:'Count how many successes you get in a fixed number of independent yes/no trials with the same success probability. That count is binomial.',
 formal:'X follows a binomial distribution with parameters n and p, written X ~ B(n, p), when four conditions hold (BINS): Binary outcomes (success/failure), Independent trials, a fixed Number of trials n, and a constant Success probability p. Then P(X = k) = C(n, k)·pᵏ·(1 − p)ⁿ⁻ᵏ for k = 0, 1, …, n, where C(n, k) = n!/[k!(n − k)!] counts the orderings. Its mean is μ = np and its standard deviation is σ = √(np(1 − p)). When np ≥ 10 and n(1 − p) ≥ 10 the binomial is well approximated by a normal distribution with these parameters.',
 defs:[['Binomial coefficient C(n, k)','The number of ways to choose which k of the n trials are successes.'],
       ['Success','Whichever outcome you are counting — it need not be desirable.'],
       ['BINS conditions','Binary, Independent, fixed Number of trials, constant Success probability.']],
 steps:[{h:'Worked calculation', b:'A drug works for 70% of patients. In n = 10 independent patients, find P(exactly 8 recover).<br>C(10, 8) = 10!/(8!·2!) = 45.<br>P(X = 8) = 45 · (0.7)⁸ · (0.3)² = 45 · 0.05765 · 0.09 ≈ 0.2335.<br>So about a 23% chance of exactly 8 recoveries.'},
        {h:'Cumulative questions', b:'P(at least 8) = P(8) + P(9) + P(10) = 0.2335 + 0.1211 + 0.0282 ≈ 0.3828.<br>In R: <code>sum(dbinom(8:10, 10, 0.7))</code> or <code>1 - pbinom(7, 10, 0.7)</code>.'},
        {h:'Mean and SD', b:'μ = np = 10(0.7) = 7 recoveries; σ = √(10 · 0.7 · 0.3) = √2.1 ≈ 1.45. Observing 8 is well within one SD of the mean, so it is unremarkable.'}],
 mistakes:['Applying the binomial when trials are not independent, e.g. sampling without replacement from a small population.','Using σ = np(1 − p) without the square root.','Miscounting "at least 8" as 1 − pbinom(8, …), which actually gives P(X ≥ 9). Use 1 − pbinom(7, …).','Forgetting the binomial coefficient and computing only pᵏ(1−p)ⁿ⁻ᵏ, which is the probability of one specific ordering.'],
 keyf:['binom','binommean'],
 checks:[{q:'A fair coin is tossed 6 times. Find P(exactly 4 heads).',
   a:'C(6, 4) = 15. P = 15(0.5)⁴(0.5)² = 15(0.5)⁶ = 15/64 ≈ 0.2344.'},
  {q:'A batch of 500 items contains 5% defectives. You sample 20 without replacement. Is a binomial model acceptable?',
   a:'Yes, approximately. Trials are not strictly independent, but 20/500 = 4% ≤ 10%, so the 10% condition holds and B(20, 0.05) is an acceptable model.'}]},

'continuous-dist':{t:'Continuous probability distributions', area:'norm', w:6,
 simple:'With continuous variables you never ask about a single point — you ask about an interval, and the answer is an area under a curve.',
 formal:'A continuous random variable takes any value in an interval, so probability is described by a density curve f(x) rather than a mass function. The curve satisfies f(x) ≥ 0 everywhere and encloses total area 1. Probability corresponds to area: P(a ≤ X ≤ b) is the area under the curve between a and b. Because a single point has zero width, P(X = c) = 0 for every c, and therefore P(X < c) = P(X ≤ c) — the endpoint convention that mattered for discrete variables becomes irrelevant. The median of a density is the value splitting the area into halves; the mean is its balance point.',
 defs:[['Density curve','A curve with total area 1 under which areas represent probabilities.'],
       ['Uniform distribution','A rectangular density: all intervals of equal length in the range are equally likely.'],
       ['P(X = c) = 0','Any exact value of a continuous variable has zero probability; only intervals carry probability.']],
 steps:[{h:'Uniform worked example', b:'A bus arrives uniformly between 0 and 20 minutes after you reach the stop. The density has height 1/20 = 0.05 over [0, 20].<br>P(wait less than 5 min) = 5 × 0.05 = 0.25.<br>P(wait between 8 and 14) = 6 × 0.05 = 0.30.<br>Mean wait = 10 minutes (the balance point).'},
        {h:'Why the endpoints stop mattering', b:'P(X < 5) and P(X ≤ 5) both equal 0.25, since the single point 5 contributes a rectangle of zero width.'}],
 mistakes:['Reading the height of a density as a probability — only areas are probabilities, and a density can exceed 1.','Treating P(X = 3) as non-zero for a continuous variable.','Carrying the discrete endpoint rules into continuous problems.'],
 keyf:[],
 checks:[{q:'A density is uniform on [0, 4]. What is its height, and what is P(1 ≤ X ≤ 2.5)?',
   a:'Total area must be 1 over a base of 4, so the height is 0.25. P(1 ≤ X ≤ 2.5) = 1.5 × 0.25 = 0.375.'}]},

'normal-dist':{t:'The normal distribution', area:'norm', w:6,
 simple:'One symmetric bell-shaped family, fixed by a mean and a standard deviation. Standardising with z lets one table or one R function answer every question about it.',
 formal:'X ~ N(μ, σ) has a symmetric, unimodal, bell-shaped density centred at μ with points of inflection at μ ± σ. The standardised score z = (x − μ)/σ gives the number of standard deviations x lies above (positive) or below (negative) the mean, and Z ~ N(0, 1) is the standard normal distribution. Standardising preserves probabilities: P(X ≤ x) = P(Z ≤ z). Areas are obtained from the standard normal table or from pnorm() in R; inverse problems (find x given a percentile) use qnorm() and then x = μ + zσ. The Empirical Rule is the coarse version of these areas at z = 1, 2, 3.',
 defs:[['z-score','z = (x − μ)/σ, position in standard deviations, unitless and comparable across variables.'],
       ['Standard normal','N(0, 1); the reference distribution for all normal calculations.'],
       ['Percentile','The proportion of the distribution at or below a value.'],
       ['68–95–99.7','Approximate areas within 1, 2 and 3 standard deviations of the mean.']],
 visual:'<svg viewBox="0 0 460 150" width="100%" height="150" role="img" aria-label="Normal curve with 68, 95 and 99.7 percent regions"><path d="M20 120 C 90 120, 110 20, 230 20 C 350 20, 370 120, 440 120" fill="none" stroke="#27488f" stroke-width="2"/><line x1="230" y1="20" x2="230" y2="120" stroke="#27488f" stroke-dasharray="3 3"/><g stroke="#7d8ba0" stroke-width="1"><line x1="160" y1="42" x2="160" y2="120"/><line x1="300" y1="42" x2="300" y2="120"/><line x1="95" y1="95" x2="95" y2="120"/><line x1="365" y1="95" x2="365" y2="120"/></g><line x1="20" y1="120" x2="440" y2="120" stroke="#4a5a70"/><g font-size="11" fill="#4a5a70" font-family="sans-serif" text-anchor="middle"><text x="230" y="136">μ</text><text x="160" y="136">μ−σ</text><text x="300" y="136">μ+σ</text><text x="95" y="136">μ−2σ</text><text x="365" y="136">μ+2σ</text><text x="230" y="60">68%</text><text x="230" y="88">95%</text></g></svg>',
 steps:[{h:'Forward problem — area from a value', b:'Scores ~ N(72, 8). Find P(X &gt; 85).<br>z = (85 − 72)/8 = 1.625.<br>P(Z &gt; 1.625) = 1 − 0.9479 = 0.0521.<br>About 5.2% score above 85. In R: <code>1 - pnorm(85, 72, 8)</code>.'},
        {h:'Between two values', b:'P(60 &lt; X &lt; 80): z₁ = (60 − 72)/8 = −1.5, z₂ = (80 − 72)/8 = 1.0.<br>P = P(Z &lt; 1.0) − P(Z &lt; −1.5) = 0.8413 − 0.0668 = 0.7745.'},
        {h:'Inverse problem — value from a percentile', b:'What score is the 90th percentile?<br>z₀.₉₀ = 1.2816 (from qnorm(0.90)).<br>x = μ + zσ = 72 + 1.2816(8) = 82.25.<br>Always convert back with x = μ + zσ; the z is not the answer.'}],
 mistakes:['Forgetting that the table gives area to the left, so "greater than" requires 1 − the tabled value.','Dropping the sign of a negative z.','Answering an inverse problem with the z-score instead of converting back to x.','Applying normal calculations to a clearly skewed variable.'],
 keyf:['z','invz','emp'],
 checks:[{q:'Weights are N(70, 10) kg. What proportion is below 55 kg?',
   a:'z = (55 − 70)/10 = −1.5. P(Z < −1.5) = 0.0668, so about 6.7% are below 55 kg. In R: pnorm(55, 70, 10).'},
  {q:'For N(500, 100), find the score exceeded by only 5% of the population.',
   a:'The 95th percentile has z = 1.645, so x = 500 + 1.645(100) = 664.5. In R: qnorm(0.95, 500, 100).'}]},

'sampling-distributions':{t:'Sampling distributions (OLI Module 12)', area:'sdist', w:6,
 simple:'Take a sample and compute x̄. Take another and you get a different x̄. The distribution of all those possible x̄ values is the sampling distribution — and it is much less variable than the data itself.',
 formal:'A sampling distribution is the probability distribution of a statistic across all samples of a fixed size n from the same population. For the sample mean, E(x̄) = μ (unbiased) and SD(x̄) = σ/√n, called the standard error. For the sample proportion, E(p̂) = p and SD(p̂) = √(p(1 − p)/n). Both standard errors shrink with √n, so quadrupling the sample size halves the variability. The shape is normal if the population is normal; by the Central Limit Theorem it is approximately normal for large n whatever the population shape, with n ≥ 30 the usual rule of thumb for means, and np ≥ 10 with n(1 − p) ≥ 10 for proportions.',
 defs:[['Sampling distribution','The distribution of a statistic over repeated samples of size n.'],
       ['Standard error','The standard deviation of a sampling distribution, σ/√n for the mean.'],
       ['Unbiased estimator','A statistic whose sampling distribution is centred on the parameter.'],
       ['√n law','Precision improves with the square root of sample size, not with sample size itself.']],
 steps:[{h:'Worked example', b:'A population has μ = 60, σ = 15. For samples of n = 25:<br>E(x̄) = 60, SE = 15/√25 = 3.<br>P(x̄ &gt; 66) = P(Z &gt; (66 − 60)/3) = P(Z &gt; 2) ≈ 0.0228.<br>Note the same calculation for a single observation would use σ = 15: P(X &gt; 66) = P(Z &gt; 0.4) ≈ 0.34. Means are far less variable than individuals.'},
        {h:'Diminishing returns', b:'Going from n = 25 to n = 100 cuts SE from 3 to 1.5 — four times the data for twice the precision.'}],
 mistakes:['Using σ instead of σ/√n when the question is about a sample mean.','Confusing the distribution of the data with the distribution of x̄.','Assuming a large n fixes a biased sampling method — it does not; the sampling distribution is then centred on the wrong value.'],
 keyf:['sexbar','sephat'],
 checks:[{q:'σ = 20 and n = 64. What is the standard error of x̄, and what n would halve it?',
   a:'SE = 20/√64 = 2.5. Halving requires quadrupling n, so n = 256 gives SE = 1.25.'}]},

'clt':{t:'The Central Limit Theorem', area:'sdist', w:7,
 simple:'Whatever shape the population has, averages of large samples pile up into a normal curve. That is what makes normal-based inference work almost everywhere.',
 formal:'The Central Limit Theorem states that for independent, identically distributed observations from a population with finite mean μ and finite standard deviation σ, the sampling distribution of x̄ approaches N(μ, σ/√n) as n increases, regardless of the population\'s shape. The approximation improves with n; strongly skewed populations need larger n, with n ≥ 30 the usual working threshold and small n adequate for populations that are already near-normal. The theorem describes the statistic, not the data — the sample itself keeps the population\'s skew.',
 defs:[['CLT','The sampling distribution of the mean tends to normality as n grows.'],
       ['n ≥ 30','A rule of thumb, not a theorem; heavier skew demands more.'],
       ['Independence','Required — either random sampling with replacement, or n ≤ 10% of the population.']],
 steps:[{h:'Simulation logic (the Week 7 and 9 activity)', b:'Draw 1,000 samples of size n from a strongly right-skewed population, compute x̄ each time, and histogram the 1,000 means.<br>At n = 2 the histogram is still skewed. At n = 10 it is much more symmetric. At n = 30 or 50 it is close to normal, centred at μ with visible spread σ/√n.<br>The key observation: the population never changed — only the statistic\'s distribution did.'},
        {h:'Applying it', b:'Incomes are strongly right-skewed with μ = 1,500 and σ = 900. For n = 100, the CLT gives x̄ ≈ N(1500, 90). P(x̄ &gt; 1,650) = P(Z &gt; 1.667) ≈ 0.048 — legitimate despite the skew, because n is large.'}],
 mistakes:['Claiming the CLT makes the data normal — it applies to the sampling distribution of the statistic.','Applying it with n = 8 from a heavily skewed population.','Forgetting the independence requirement.'],
 keyf:['clt','sexbar'],
 checks:[{q:'Waiting times are right-skewed with μ = 4 min, σ = 3 min. For n = 36, what is the approximate distribution of x̄, and P(x̄ < 3.5)?',
   a:'By the CLT, x̄ ≈ N(4, 3/√36 = 0.5). z = (3.5 − 4)/0.5 = −1. P(x̄ < 3.5) ≈ P(Z < −1) = 0.1587.'}]},

'inference-intro':{t:'Introduction to inference (OLI Module 13)', area:'est', w:7,
 simple:'Inference is the paid work of the course: saying something about a population you did not fully observe, and stating how sure you are.',
 formal:'Statistical inference draws conclusions about population parameters from sample statistics, quantifying uncertainty using the sampling distribution. It has two branches. Estimation answers "what is the parameter?" with a point estimate and a confidence interval. Hypothesis testing answers "is this claim about the parameter credible?" with a test statistic and a p-value. Both rest on the same machinery: a statistic, its standard error, and a reference distribution (normal or t). Inference is only valid when the data were produced by an appropriate random process; no calculation repairs a biased sample.',
 defs:[['Point estimate','A single best guess at the parameter, e.g. x̄ for μ or p̂ for p.'],
       ['Interval estimate','A range of plausible parameter values with an attached confidence level.'],
       ['Hypothesis test','A procedure assessing evidence against a specific claim about the parameter.'],
       ['Validity conditions','Randomness, independence (10% condition), and sufficient sample size for normality.']],
 steps:[{h:'Which branch answers which question', b:'"How many Ghanaians own a smartphone?" → estimation, report p̂ with a confidence interval.<br>"Is smartphone ownership above 50%?" → hypothesis test of H₀: p = 0.5 against Hₐ: p &gt; 0.5.<br>The two are linked: a 95% confidence interval that excludes 0.5 corresponds to rejecting H₀ at the 5% level in a two-sided test.'}],
 mistakes:['Running inference on a convenience sample and reporting a confidence level as if it were meaningful.','Choosing the procedure before identifying the variable types and the parameter of interest.'],
 keyf:[],
 checks:[{q:'A researcher wants to know the average commute time of staff and whether it exceeds 45 minutes. Which inference tool serves each aim?',
   a:'The average itself calls for estimation: x̄ plus a confidence interval for μ. The "exceeds 45 minutes" claim calls for a hypothesis test with H₀: μ = 45 and Hₐ: μ > 45.'}]},

'estimation':{t:'Estimation (OLI Module 14)', area:'est', w:7,
 simple:'Give a best guess, then attach a margin of error that reflects how much your guess would bounce around across samples.',
 formal:'A confidence interval takes the form estimate ± (critical value)(standard error). For a proportion with large samples, p̂ ± z*√(p̂(1 − p̂)/n); for a mean with unknown σ, x̄ ± t*(s/√n) with df = n − 1. The confidence level C is the long-run capture rate: across repeated samples, C% of intervals constructed this way contain the parameter. The margin of error grows with the confidence level and shrinks with √n. The correct interpretation is a statement about the procedure, not about a single interval: once computed, an interval either contains μ or it does not.',
 defs:[['Margin of error','The half-width of the interval: (critical value)(standard error).'],
       ['Critical value z*','1.645 for 90%, 1.96 for 95%, 2.576 for 99% confidence.'],
       ['Confidence level','The long-run proportion of such intervals that capture the parameter.'],
       ['t-distribution','Used for means when σ is unknown; heavier tails than normal, approaching normal as df grows.']],
 steps:[{h:'Confidence interval for a proportion', b:'In a poll of n = 600, 342 support a policy: p̂ = 0.57.<br>SE = √(0.57 × 0.43/600) = √0.0004085 = 0.02021.<br>95% CI: 0.57 ± 1.96(0.02021) = 0.57 ± 0.0396 = (0.530, 0.610).<br>Interpretation: we are 95% confident that between 53.0% and 61.0% of the population supports the policy. Since the whole interval is above 0.5, majority support is plausible at this level.'},
        {h:'Confidence interval for a mean', b:'n = 25, x̄ = 68, s = 10, 95% confidence, df = 24, t* = 2.064.<br>SE = 10/√25 = 2. Margin = 2.064 × 2 = 4.13.<br>CI = 68 ± 4.13 = (63.87, 72.13).'},
        {h:'Choosing a sample size', b:'For a proportion with a target margin m, n ≥ (z*/m)²·p̂(1 − p̂); using the conservative p̂ = 0.5 gives n ≥ 0.25(z*/m)². For m = 0.03 at 95%: n ≥ 0.25(1.96/0.03)² ≈ 1,068.'}],
 mistakes:['Saying "there is a 95% probability that μ lies in this interval" — the parameter is fixed; the interval is random.','Interpreting the interval as covering 95% of individuals rather than plausible values of the parameter.','Using z* instead of t* for a mean with unknown σ and small n.','Believing a wider interval is "worse" — it is more cautious; width and confidence trade off.'],
 keyf:['cip','cim','moe','nsize'],
 checks:[{q:'A 95% CI for mean weekly study hours is (11.2, 14.8). Write a correct interpretation and identify the point estimate and margin of error.',
   a:'Point estimate = midpoint = 13.0 hours; margin of error = 1.8 hours. Interpretation: we are 95% confident the population mean weekly study time is between 11.2 and 14.8 hours — meaning that if this procedure were repeated on many samples, 95% of the intervals produced would contain the true mean.'},
  {q:'If everything else is unchanged, how does moving from 95% to 99% confidence change the interval?',
   a:'The critical value rises from 1.96 to 2.576, so the margin of error and the interval width increase. Higher confidence is bought with less precision.'}]},

'hypothesis-testing':{t:'Hypothesis testing (OLI Module 15)', area:'ht', w:9,
 simple:'Assume nothing interesting is happening, work out how surprising your data would be under that assumption, and reject it only if the data are surprising enough.',
 formal:'A hypothesis test compares a null hypothesis H₀ (a specific claim of no effect or no difference, always stated with equality about a parameter) against an alternative Hₐ (one- or two-sided). A test statistic measures the distance between the observed statistic and the null value in standard error units, e.g. z = (p̂ − p₀)/√(p₀(1 − p₀)/n) or t = (x̄ − μ₀)/(s/√n) with df = n − 1. The p-value is the probability, computed assuming H₀ is true, of obtaining a result at least as extreme as the one observed. If p ≤ α we reject H₀ and call the result statistically significant; otherwise we fail to reject H₀ — which is not evidence that H₀ is true. A Type I error is rejecting a true H₀ (probability α); a Type II error is failing to reject a false H₀ (probability β); power = 1 − β increases with sample size and effect size.',
 defs:[['H₀','The null hypothesis — no effect, no difference, status quo. Stated with = about a parameter.'],
       ['Hₐ','The alternative — what you are gathering evidence for. Uses <, > or ≠.'],
       ['p-value','P(data this extreme or more | H₀ true). Not the probability that H₀ is true.'],
       ['Significance level α','The threshold for rejection, fixed before seeing the data; usually 0.05.'],
       ['Type I / Type II error','False positive (reject a true H₀) / false negative (miss a real effect).'],
       ['Power','1 − β, the probability of detecting an effect that genuinely exists.']],
 steps:[{h:'Full worked test of a proportion', b:'Claim: more than 50% of students skip breakfast. Sample: n = 200, 116 skip, so p̂ = 0.58.<br><b>1. Hypotheses.</b> H₀: p = 0.5 vs Hₐ: p &gt; 0.5 (one-sided).<br><b>2. Conditions.</b> Random sample; np₀ = 100 ≥ 10 and n(1 − p₀) = 100 ≥ 10; n ≤ 10% of all students. Satisfied.<br><b>3. Test statistic.</b> SE₀ = √(0.5 × 0.5/200) = 0.03536. z = (0.58 − 0.5)/0.03536 = 2.263.<br><b>4. p-value.</b> P(Z &gt; 2.263) = 0.0118.<br><b>5. Decision.</b> 0.0118 ≤ 0.05, so reject H₀.<br><b>6. Conclusion in context.</b> There is significant evidence at the 5% level that more than half of students skip breakfast.'},
        {h:'One-sided versus two-sided', b:'If the alternative had been Hₐ: p ≠ 0.5, the p-value would double to 0.0236 — still significant at 5%. The direction must be chosen from the research question before the data are seen, never after.'},
        {h:'Interpreting a large p-value', b:'p = 0.42 means data like these are entirely unsurprising if H₀ is true. Correct wording: "we fail to reject H₀; there is insufficient evidence of an effect." Wrong wording: "we accept H₀" or "there is no effect."'}],
 mistakes:['Interpreting the p-value as the probability that H₀ is true.','"Accepting" H₀ instead of failing to reject it.','Choosing a one-sided alternative after seeing which direction the data went.','Confusing statistical significance with practical importance — a trivial effect becomes significant with a large enough n.','Using p̂ instead of p₀ in the standard error of a one-sample proportion test.'],
 keyf:['ztest','ttest','pval'],
 checks:[{q:'A test yields p = 0.03 with α = 0.05. State the decision and a correct interpretation of the p-value.',
   a:'Since 0.03 ≤ 0.05, reject H₀; the result is statistically significant at the 5% level. The p-value means: if H₀ were true, there would be a 3% chance of observing a result at least as extreme as this one. It is not the probability that H₀ is true.'},
  {q:'A study with n = 20,000 finds a statistically significant difference of 0.4 marks between two teaching methods. What is the concern?',
   a:'Statistical significance without practical significance. A very large sample makes tiny effects detectable; 0.4 marks may be irrelevant in practice. Report the effect size and a confidence interval alongside the p-value.'}]},

'variables':{t:'Variables and their roles', area:'proj', w:9,
 simple:'Before any analysis, pin down what each variable is and what job it does in your question.',
 formal:'Every analysis choice follows from two labels per variable: its type (categorical or quantitative) and its role (explanatory, response, or third variable). Third variables come in two forms relevant to this course: confounders, which distort an association and should be controlled, and moderators, which change the association across subgroups and are the target of a moderation analysis. Recoding — collapsing categories, converting counts to rates, banding a quantitative variable — changes the type and therefore the available analyses, so it must be recorded in the personal codebook.',
 defs:[['Role','Explanatory, response, or third variable.'],
       ['Recoding','Deliberately changing how a variable\'s values are represented.'],
       ['Derived variable','A variable computed from others, e.g. BMI from height and weight.'],
       ['Type-role table','A compact plan pairing each variable with its type and role before analysis.']],
 steps:[{h:'Building the plan', b:'<table><tr><th>Variable</th><th>Type</th><th>Role</th><th>Analysis implied</th></tr><tr><td>Region</td><td>Categorical</td><td>Explanatory</td><td rowspan="2">C→Q: boxplots, ANOVA/t-test</td></tr><tr><td>Income</td><td>Quantitative</td><td>Response</td></tr><tr><td>Urban/rural</td><td>Categorical</td><td>Moderator</td><td>Repeat within each level</td></tr></table>'}],
 mistakes:['Banding a quantitative variable into categories without a reason, discarding information.','Failing to distinguish a confounder from a moderator — the first is a nuisance to control, the second is a finding to report.'],
 keyf:[],
 checks:[{q:'You band age into "under 30" and "30+" and compare income. What has changed about the possible analysis?',
   a:'Age has moved from quantitative to categorical, so the case changes from Q→Q (scatterplot, correlation, regression) to C→Q (boxplots, two-sample t-test). You lose the ability to describe a gradient with age and lose statistical power, in exchange for a simpler comparison.'}]},

'data-management':{t:'Data management for the project', area:'proj', w:9,
 simple:'Most project time goes into getting the data into a state where the analysis is only three lines long.',
 formal:'Data management is the documented sequence of steps taking raw data to an analysis-ready dataset: subsetting to the population of interest, selecting the variables named in the research questions, converting missing-data codes to NA, recoding and labelling categorical variables as factors, creating derived variables, and verifying the result with frequency tables and summary statistics. Every step should live in a script or RMarkdown file so the process is reproducible; results that cannot be regenerated from the raw file are not defensible.',
 defs:[['Analysis-ready dataset','A dataset in which every retained variable has correct type, correct labels and NA for genuine missingness.'],
       ['Reproducibility','The ability to regenerate every number from the raw data by re-running the script.'],
       ['Subsetting','Restricting rows to the population of interest, e.g. respondents aged 18–65.'],
       ['Factor','R\'s type for categorical variables, storing levels and labels.']],
 steps:[{h:'A typical management sequence in R', b:'<pre>d &lt;- read.csv("survey.csv")\nd &lt;- subset(d, AGE &gt;= 18 &amp; AGE &lt;= 65)          # population\nd &lt;- d[, c("AGE","SEX","INCOME","HEALTH")]     # variables\nd$INCOME[d$INCOME == 999999] &lt;- NA              # missing codes\nd$SEX &lt;- factor(d$SEX, levels=c(1,2), labels=c("Male","Female"))\nd$INCOME_K &lt;- d$INCOME/1000                     # derived variable\ntable(d$SEX, useNA="ifany"); summary(d$INCOME_K)  # verify</pre>'},
        {h:'Verification is not optional', b:'After every recode, run table() or summary() and confirm the counts match the codebook. A silent mis-recode is the most common source of a wrong project result.'}],
 mistakes:['Editing the raw data file by hand, destroying reproducibility.','Recoding without verifying with a frequency table afterwards.','Dropping all rows with any missing value without reporting how many cases were lost.','Leaving numeric codes as numbers instead of converting to factors.'],
 keyf:[],
 checks:[{q:'You recode INCOME code 999999 to NA and the mean drops from 84,000 to 1,450. What happened, and what should you report?',
   a:'The missing-data code was previously treated as a real income, inflating the mean enormously. The 1,450 figure is the correct one. Report the number of cases recoded to NA and how missing values were handled in the analysis.'}]}
});

Object.assign(LESSONS, {

'point-estimation':{t:'Point estimation', area:'est', w:10,
 simple:'A point estimate is your single best number for the parameter. It is right on average, but essentially never exactly right.',
 formal:'A point estimator is a statistic used to estimate a parameter: x̄ for μ, p̂ for p, s for σ, b for the slope β. A good estimator is unbiased (its sampling distribution is centred on the parameter) and efficient (small standard error). A point estimate alone is incomplete because it carries no information about precision; it must be reported with its standard error or, preferably, a confidence interval. The standard error is the estimated standard deviation of the estimator: s/√n for a mean, √(p̂(1 − p̂)/n) for a proportion.',
 defs:[['Estimator / estimate','The rule (x̄) versus the number it produces (68.2).'],
       ['Unbiased','E(estimator) = parameter.'],
       ['Efficiency','Smaller sampling variability for the same n.'],
       ['Standard error','The estimated standard deviation of the estimator.']],
 steps:[{h:'Reporting properly', b:'From n = 400 with 148 successes: p̂ = 0.37, SE = √(0.37 × 0.63/400) = 0.0241.<br>Report "p̂ = 0.37 (SE = 0.024)", or better, the 95% CI 0.37 ± 1.96(0.0241) = (0.323, 0.417).'}],
 mistakes:['Reporting a point estimate with no measure of uncertainty.','Treating x̄ as if it were μ in later statements.','Quoting more decimal places than the data justify.'],
 keyf:['sephat','semean'],
 checks:[{q:'n = 100, x̄ = 52, s = 12. Give the point estimate for μ and its standard error.',
   a:'Point estimate: x̄ = 52. Standard error: s/√n = 12/10 = 1.2.'}]},

'confidence-intervals':{t:'Confidence interval estimation', area:'est', w:10,
 simple:'Take the point estimate, and stretch it either side by enough standard errors to capture the parameter at your chosen success rate.',
 formal:'A C% confidence interval is estimate ± critical value × standard error. For a proportion: p̂ ± z*√(p̂(1 − p̂)/n), valid when np̂ ≥ 10 and n(1 − p̂) ≥ 10. For a mean with unknown σ: x̄ ± t*(s/√n) with df = n − 1, valid when the data are roughly normal or n ≥ 30. Width depends on three things: the confidence level (higher → wider), the sample size (larger → narrower, by √n) and the variability in the data (larger s → wider). A two-sided C% interval and a two-sided test at α = 1 − C agree: values outside the interval are exactly those that would be rejected.',
 defs:[['Critical value','z* or t*, the number of standard errors matching the confidence level.'],
       ['Interval width','2 × margin of error.'],
       ['Capture rate','The long-run percentage of intervals containing the parameter.']],
 steps:[{h:'Comparing two groups with intervals', b:'Group A: 95% CI for mean score (68.1, 74.9). Group B: (73.5, 80.2).<br>The intervals overlap, so the data do not clearly separate the group means; a formal two-sample test is required rather than an eyeball comparison. Non-overlapping intervals do imply a significant difference, but overlapping intervals do not imply the absence of one.'},
        {h:'Interval–test duality', b:'A 95% CI for μ of (63.9, 72.1) excludes 75, so H₀: μ = 75 would be rejected at α = 0.05 in a two-sided test. It contains 65, so H₀: μ = 65 would not be rejected.'}],
