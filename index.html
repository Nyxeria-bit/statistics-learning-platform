const RLABS = [
{id:'rmd-intro',w:1,t:'Introduction to RMarkdown',a:'rprog',
 goal:'Produce a reproducible document where narrative text, R code and its output live in one file, so every number in your project can be regenerated from the raw data.',
 explain:['The YAML header at the top (between the --- lines) sets the title, author and output format.','Text outside chunks is ordinary Markdown: # heading, **bold**, *italic*, - bullet.','Code lives in chunks opened with three backticks and {r}, and closed with three backticks.','Chunk options control what the reader sees: echo = FALSE hides the code, eval = FALSE stops it running, include = FALSE runs it silently.','Knitting runs the whole file top to bottom in a fresh session — if it knits, it is reproducible.'],
 code:'---\ntitle: "Statistics Project"\nauthor: "Your name"\noutput: html_document\n---\n\n# Introduction\n\nThis report examines income and health status.\n\n```{r setup, include=FALSE}\nknitr::opts_chunk$set(echo = TRUE, warning = FALSE)\n```\n\n```{r summary-stats}\nd <- read.csv("survey.csv")\nsummary(d$income)\n```',
 out:'   Min. 1st Qu.  Median    Mean 3rd Qu.    Max.\n    120     640    1150    1462    1890    9800',
 task:'Write the YAML header and one chunk that reads a file called project.csv, then prints the number of rows and the number of columns.',
 solution:'---\ntitle: "Project"\noutput: html_document\n---\n\n```{r}\nd <- read.csv("project.csv")\nnrow(d)\nncol(d)\n```\n\ndim(d) would also give both numbers at once.',
 predict:{q:'A chunk is marked {r, echo=FALSE}. What appears in the knitted document?',o:['The code only','The output only','Both code and output','Neither'],c:1,
  why:'echo = FALSE suppresses the code but the chunk still runs and its output is printed. To hide both, use include = FALSE.'},
 errors:['"cannot open file" — the .Rmd file and the data file are not in the same folder, or the name is misspelled (R is case sensitive).','An unclosed chunk (missing the final three backticks) makes knitting fail with a confusing parse error.','Objects created in the console but not in a chunk exist in your session but not in the knit — knitting starts from a clean session.']},

{id:'r-intro',w:1,t:'Introduction to R',a:'rprog',
 goal:'Learn the objects you will use all semester: vectors, data frames, and the functions that summarise them.',
 explain:['<- assigns a value to a name. c() combines values into a vector.','A data frame is a table of columns; d$income extracts one column as a vector.','str(d) shows the structure and type of every column — run it immediately after reading any file.','Square brackets subset: d[1:5, ] is the first five rows, d[, c("age","income")] selects columns.','Functions take arguments; many accept na.rm = TRUE to ignore missing values.'],
 code:'x <- c(4, 8, 6, 10, 12)\nmean(x)\nsd(x)\nsummary(x)\n\nd <- read.csv("survey.csv")\nstr(d)\nhead(d, 3)\ntable(d$region)',
 out:'[1] 8\n[1] 3.162278\n   Min. 1st Qu.  Median    Mean 3rd Qu.    Max.\n      4       6       8       8      10      12',
 task:'Create a vector of the values 12, 15, 11, 18, 30 and compute its mean, median and standard deviation. Which of the three moves most if you change 30 to 300?',
 solution:'y <- c(12, 15, 11, 18, 30)\nmean(y)   # 17.2\nmedian(y) # 15\nsd(y)     # 7.66\n\nChanging 30 to 300: mean jumps to 71.2 and sd to 126.6, while the median stays at 15. The median is resistant; the mean and SD are not.',
 predict:{q:'What does mean(c(2, 4, NA, 6)) return?',o:['4','NA','3','An error'],c:1,
  why:'A single NA propagates through the arithmetic. Use mean(c(2,4,NA,6), na.rm = TRUE), which gives 4.'},
 errors:['"object \'x\' not found" — the name was never assigned, or was spelled differently (R is case sensitive: Income ≠ income).','Using = inside c() instead of commas.','Forgetting quotes around file names and character values.']},

{id:'r-histogram',w:1,t:'Generating histograms in R',a:'rprog',
 goal:'Display the distribution of a quantitative variable and judge its shape, centre, spread and outliers.',
 explain:['hist(x) draws the histogram; breaks = suggests how many bins to use.','main, xlab and ylab must be set on any graph you submit — default labels like "d$income" are not acceptable in a report.','freq = FALSE switches the y-axis from counts to density, which lets you overlay a curve.','Compare two or three bin widths before deciding: too few bins hide a second peak, too many produce noise.','boxplot(x) complements the histogram by displaying the five-number summary and flagged outliers.'],
 code:'hist(d$income,\n     breaks = 20,\n     main = "Distribution of monthly income",\n     xlab = "Monthly income (GH\\u20B5)",\n     col = "grey80")\n\nboxplot(d$income, horizontal = TRUE,\n        main = "Monthly income", xlab = "GH\\u20B5")',
 out:'(A right-skewed histogram: tall bars at low incomes, a long thin tail to the right, and a boxplot with several points beyond the upper fence.)',
 task:'Draw a histogram of age with 15 bins and a proper title and axis label. Then describe the distribution in one sentence using shape, centre, spread and outliers.',
 solution:'hist(d$age, breaks = 15,\n     main = "Distribution of respondent age",\n     xlab = "Age (years)")\n\nsummary(d$age); sd(d$age, na.rm = TRUE)\n\nExample description: "Age is roughly symmetric and unimodal, centred near 38 years, with an IQR of about 20 years and no outliers."',
 predict:{q:'You change breaks = 5 to breaks = 50 on a dataset of 200 incomes. What is the likely effect?',o:['The distribution becomes normal','More detail but a noisier, spikier shape','Outliers are removed','The mean changes'],c:1,
  why:'Bin count changes only the display resolution, never the data. With 200 observations spread over 50 bins, many bins hold very few cases, so the shape looks ragged.'},
 errors:['hist() on a categorical variable — use barplot(table(x)) instead.','"x must be numeric" — the column was read as a factor or character; check str(d) and convert.','Leaving the default main and xlab in a submitted graph.']},

{id:'r-empirical',w:2,t:'Testing the Empirical Rule in R',a:'rprog',
 goal:'Check empirically whether about 68%, 95% and 99.7% of a variable falls within 1, 2 and 3 standard deviations of the mean — and see how badly the rule fails on skewed data.',
 explain:['Store the mean and SD, then build logical comparisons that are TRUE or FALSE for each observation.','mean() of a logical vector returns the proportion of TRUEs, because TRUE counts as 1.','abs((x - m)/s) < 1 is exactly the condition |z| < 1.','Repeat with 2 and 3 to complete the rule.','Compare a roughly symmetric variable with a skewed one to see when the rule holds.'],
 code:'x <- d$score\nm <- mean(x, na.rm = TRUE)\ns <- sd(x, na.rm = TRUE)\nz <- abs((x - m)/s)\n\nmean(z < 1, na.rm = TRUE)   # target ~0.68\nmean(z < 2, na.rm = TRUE)   # target ~0.95\nmean(z < 3, na.rm = TRUE)   # target ~0.997',
 out:'[1] 0.681\n[1] 0.954\n[1] 0.998',
 task:'Run the same three lines on a strongly right-skewed variable such as income. Are the proportions still close to 68/95/99.7, and which one departs most?',
 solution:'x <- d$income\nm <- mean(x, na.rm = TRUE); s <- sd(x, na.rm = TRUE)\nz <- abs((x - m)/s)\nc(mean(z < 1, na.rm = TRUE), mean(z < 2, na.rm = TRUE), mean(z < 3, na.rm = TRUE))\n\nTypical result for skewed income: about 0.86, 0.94, 0.97. The one-SD proportion is far above 68% because the long right tail inflates s, packing most observations well within one SD of the mean. The rule requires approximate normality.',
 predict:{q:'What does mean(c(TRUE, TRUE, FALSE, TRUE)) return?',o:['3','0.75','TRUE','An error'],c:1,
  why:'Logical values are coerced to 1 and 0, so the mean is 3/4 = 0.75 — the proportion of TRUEs. This is the trick that makes the whole exercise two lines long.'},
 errors:['Omitting na.rm = TRUE, which makes every proportion NA.','Forgetting abs(), which counts only the lower tail and gives roughly half the expected proportion.','Recomputing m and s inside each line after changing the variable — keep them in step with x.']},

{id:'r-sampling',w:3,t:'Simulating random samples in R',a:'rprog',
 goal:'Draw random samples, see sampling variability directly, and demonstrate the law of large numbers.',
 explain:['sample(x, size, replace) draws from a vector; replace = TRUE allows repeats.','set.seed(123) fixes the random number generator so your results are reproducible — required for submitted work.','replicate(n, expr) repeats an expression n times and collects the results.','The histogram of many sample means is a simulated sampling distribution.','As the number of repetitions grows, the empirical proportion converges to the true probability.'],
 code:'set.seed(123)\n\n# one sample of 10 from the data\nsample(d$income, 10)\n\n# 1000 sample means, each from n = 25\nmeans <- replicate(1000, mean(sample(d$income, 25)))\nhist(means, main = "1000 sample means (n = 25)", xlab = "Sample mean income")\nmean(means); sd(means)\n\n# law of large numbers with a coin\nflips <- sample(c("H","T"), 5000, replace = TRUE)\nmean(flips == "H")',
 out:'[1] 0.4986\nmean(means) ≈ the population mean; sd(means) ≈ population SD / 5',
 task:'Simulate rolling a fair die 2,000 times and estimate P(roll ≥ 5). Compare your estimate with the exact value.',
 solution:'set.seed(1)\nrolls <- sample(1:6, 2000, replace = TRUE)\nmean(rolls >= 5)\n\nExact value: 2/6 = 0.3333. The simulation typically lands within about 0.02 of it. Increasing to 200,000 rolls tightens the estimate — the law of large numbers.',
 predict:{q:'You run sample(1:6, 10) without replace = TRUE. What happens?',o:['Ten random rolls of a die','A random permutation of 1 to 6, then an error','Ten values but with no repeats','A warning and NA values'],c:1,
  why:'Without replacement you cannot take 10 items from a set of 6. R stops with "cannot take a sample larger than the population when \'replace = FALSE\'". Dice rolls require replace = TRUE.'},
 errors:['Omitting set.seed(), so your report shows different numbers each time it is knitted.','Forgetting replace = TRUE when simulating repeatable events.','Confusing the SD of the data with the SD of the simulated means — the latter is the standard error and is roughly σ/√n.']},

{id:'r-graphing',w:4,t:'Detailed graphing in R',a:'rprog',
 goal:'Produce presentation-quality graphs with correct titles, axis labels, ordering and grouping.',
 explain:['Every graph in a submitted report needs main, xlab and ylab in the variable\'s real-world language.','barplot(table(x)) plots categorical counts; wrap in sort() to order bars by size.','par(mfrow = c(1,2)) puts two graphs side by side for comparison.','boxplot(y ~ group, data = d) gives the standard C→Q display.','las = 1 makes axis labels horizontal and readable; col sets fill colours.'],
 code:'par(mfrow = c(1, 2))\n\nbarplot(sort(table(d$region), decreasing = TRUE),\n        main = "Respondents by region", xlab = "Region",\n        ylab = "Number of respondents", las = 1)\n\nboxplot(income ~ region, data = d,\n        main = "Income by region", xlab = "Region",\n        ylab = "Monthly income (GH\\u20B5)")\n\npar(mfrow = c(1, 1))',
 out:'(Two panels: a descending bar chart of region counts, and side-by-side boxplots of income for each region on a common scale.)',
 task:'Produce a single figure with two panels: a histogram of age and a boxplot of age by sex. Label everything properly.',
 solution:'par(mfrow = c(1, 2))\nhist(d$age, main = "Age distribution", xlab = "Age (years)")\nboxplot(age ~ sex, data = d,\n        main = "Age by sex", xlab = "Sex", ylab = "Age (years)")\npar(mfrow = c(1, 1))',
 predict:{q:'You forget to reset par(mfrow = c(1,1)) after plotting. What happens next?',o:['R throws an error','Later plots keep splitting into the same grid','The plots are deleted','Nothing changes'],c:1,
  why:'par() settings persist for the graphics device, so every subsequent plot goes into the next panel of the 1×2 grid until you reset it.'},
 errors:['Category labels overlapping — use las = 2 or shorten the labels.','boxplot(d$income, d$region) instead of the formula form, which draws two unrelated boxplots.','Leaving default labels such as "d$income" on the axes.']},

{id:'r-distributions',w:5,t:'Probability distributions in R',a:'rprog',
 goal:'Compute exact binomial and other discrete probabilities instead of expanding factorials by hand.',
 explain:['R uses a four-letter convention: d = density or exact probability, p = cumulative (left tail), q = quantile (inverse), r = random draws.','dbinom(k, n, p) gives P(X = k) exactly.','pbinom(q, n, p) gives P(X ≤ q), so upper tails need 1 - pbinom(q - 1, ...).','Summing dbinom over a range is an equivalent and often clearer way to answer "between" questions.','The same four-letter pattern applies to every distribution in the course.'],
 code:'# X ~ B(10, 0.7)\ndbinom(8, 10, 0.7)          # P(X = 8)\npbinom(7, 10, 0.7)          # P(X <= 7)\n1 - pbinom(7, 10, 0.7)      # P(X >= 8)\nsum(dbinom(8:10, 10, 0.7))  # same thing\n\n# mean and SD\n10*0.7; sqrt(10*0.7*0.3)\n\nbarplot(dbinom(0:10, 10, 0.7), names.arg = 0:10,\n        main = "B(10, 0.7)", xlab = "Number of successes", ylab = "Probability")',
 out:'[1] 0.2334744\n[1] 0.6172172\n[1] 0.3827828\n[1] 0.3827828\n[1] 7\n[1] 1.449138',
 task:'A drug works for 60% of patients. In 15 patients, find P(exactly 9 recover), P(at most 7 recover) and P(more than 10 recover).',
 solution:'dbinom(9, 15, 0.6)        # 0.2066\npbinom(7, 15, 0.6)        # 0.2131\n1 - pbinom(10, 15, 0.6)   # 0.2173  ("more than 10" = X >= 11)\n\nNote the boundary: "more than 10" excludes 10, so subtract P(X <= 10).',
 predict:{q:'Which gives P(X ≥ 8) for X ~ B(10, 0.7)?',o:['pbinom(8, 10, 0.7)','1 - pbinom(8, 10, 0.7)','1 - pbinom(7, 10, 0.7)','dbinom(8, 10, 0.7)'],c:2,
  why:'P(X ≥ 8) = 1 − P(X ≤ 7). Using 1 - pbinom(8, ...) would give P(X ≥ 9), silently dropping the value 8 — the single most common R error in this topic.'},
 errors:['Off-by-one on the cumulative boundary for "at least" and "more than".','Mixing up dbinom (exact value) and pbinom (cumulative).','Passing the probability and the size in the wrong order — the signature is (x, size, prob).']},

{id:'r-clt',w:7,t:'Simulating the Central Limit Theorem',a:'rprog',
 goal:'See the sampling distribution of x̄ become normal as n grows, even when the population is strongly skewed.',
 explain:['Build a skewed population with rexp() so the effect is visible.','replicate() draws many samples of a fixed size and records each mean.','Plot the population and the sampling distributions for several n on one screen.','Check that the simulated SD of the means matches σ/√n.','The population never changes — only the distribution of the statistic does.'],
 code:'set.seed(42)\npop <- rexp(100000, rate = 1/10)   # skewed population, mean 10\n\npar(mfrow = c(2, 2))\nhist(pop, main = "Population (skewed)", xlab = "Value")\n\nfor (n in c(5, 30, 100)) {\n  means <- replicate(2000, mean(sample(pop, n)))\n  hist(means, main = paste("Sample means, n =", n), xlab = "Sample mean")\n}\npar(mfrow = c(1, 1))\n\nsd(replicate(2000, mean(sample(pop, 100))))  # compare with sd(pop)/sqrt(100)',
 out:'[1] 1.0043      # simulated SE\nsd(pop)/sqrt(100) ≈ 1.00',
 task:'Repeat the simulation with n = 2 and n = 50. At which sample size does the histogram of means stop looking skewed, and what happens to its width?',
 solution:'for (n in c(2, 50)) {\n  means <- replicate(2000, mean(sample(pop, n)))\n  hist(means, main = paste("n =", n), xlab = "Sample mean")\n  print(c(n = n, mean = mean(means), se = sd(means)))\n}\n\nAt n = 2 the histogram is still clearly right-skewed. By n = 50 it is close to symmetric and bell-shaped. The centre stays at about 10 throughout, while the width shrinks from about 10/√2 = 7.1 to 10/√50 = 1.4.',
 predict:{q:'As n increases in this simulation, what happens to the centre and the spread of the histogram of sample means?',o:['Centre rises, spread rises','Centre stays at μ, spread shrinks','Centre stays at μ, spread stays the same','Centre falls, spread shrinks'],c:1,
  why:'x̄ is unbiased, so the centre remains at μ for every n. The standard error σ/√n shrinks as n grows, which is exactly what the narrowing histogram shows.'},
 errors:['Confusing sd(pop) with sd(means) — the second is the standard error, smaller by a factor of √n.','Using too few replications (say 50), so the simulated shape is too noisy to judge.','Forgetting set.seed(), so the figure changes on every knit.']},

{id:'r-normal',w:9,t:'Computing the normal distribution in R',a:'rprog',
 goal:'Replace normal tables with pnorm and qnorm, and get the tails and inverse problems right every time.',
 explain:['pnorm(x, mean, sd) returns the area to the LEFT of x.','For an upper tail use 1 - pnorm(x, mean, sd), or lower.tail = FALSE.','For an interval, subtract: pnorm(b, ...) - pnorm(a, ...).','qnorm(p, mean, sd) is the inverse: it returns the value at percentile p.','Calling pnorm(z) with no mean and sd uses the standard normal, which is what you need after standardising by hand.'],
 code:'# X ~ N(72, 8)\npnorm(85, 72, 8)                 # P(X <= 85)\n1 - pnorm(85, 72, 8)             # P(X > 85)\npnorm(80, 72, 8) - pnorm(60, 72, 8)   # P(60 < X < 80)\nqnorm(0.90, 72, 8)               # 90th percentile\n\n# after standardising by hand\nz <- (85 - 72)/8\npnorm(z)',
 out:'[1] 0.9479...\n[1] 0.0520...\n[1] 0.7745...\n[1] 82.2524\n[1] 0.9479...',
 task:'Heights are N(168, 6) cm. Find the proportion below 160 cm, the proportion between 165 and 175 cm, and the height exceeded by only 2.5% of people.',
 solution:'pnorm(160, 168, 6)                    # 0.0912\npnorm(175, 168, 6) - pnorm(165, 168, 6)  # 0.5825\nqnorm(0.975, 168, 6)                  # 179.76\n\nThe last answer is essentially μ + 2σ, matching the Empirical Rule\'s 2.5% upper tail.',
 predict:{q:'What does qnorm(0.95) return, and what does it mean?',o:['0.95 — the probability itself','1.645 — the z-score with 95% of the area below it','1.96 — the two-sided 95% critical value','0.05 — the remaining tail'],c:1,
  why:'qnorm inverts pnorm on the standard normal, so it returns the z with 95% of the area to its left: 1.645. The familiar 1.96 is qnorm(0.975), used for two-sided 95% intervals.'},
 errors:['Using pnorm when the question asks for a value (use qnorm) and vice versa.','Forgetting 1 - for upper-tail questions.','Omitting mean and sd, which silently applies N(0,1) to unstandardised data.']},

{id:'r-ci',w:10,t:'Confidence interval estimation in R',a:'rprog',
 goal:'Produce confidence intervals for a mean and a proportion, and read the output correctly.',
 explain:['t.test(x) reports a 95% confidence interval for μ by default; conf.level changes it.','prop.test(successes, n) gives an interval for a proportion.','You can also build the interval by hand to see the structure: estimate ± critical value × SE.','The interval and the two-sided test agree: values outside the interval would be rejected.','Report the interval in context and in the units of the variable, never as bare numbers.'],
 code:'# mean, sigma unknown\nt.test(d$income)                      # 95% CI for mu\nt.test(d$income, conf.level = 0.99)   # 99% CI\n\n# proportion\nprop.test(342, 600)                   # CI for p\n\n# by hand, for a proportion\nphat <- 342/600\nse <- sqrt(phat*(1-phat)/600)\nphat + c(-1, 1)*qnorm(0.975)*se',
 out:'95 percent confidence interval:\n 0.5296  0.6096\nsample estimates:\n        p \n     0.57',
 task:'From a sample with n = 25, x̄ = 68, s = 10, build a 95% confidence interval for μ by hand in R using qt(), then state its interpretation.',
 solution:'n <- 25; xbar <- 68; s <- 10\nse <- s/sqrt(n)                 # 2\ntstar <- qt(0.975, df = n - 1)  # 2.0639\nxbar + c(-1, 1)*tstar*se        # 63.87  72.13\n\nInterpretation: we are 95% confident the population mean lies between 63.9 and 72.1 — meaning that if this procedure were repeated on many samples, 95% of the intervals produced would contain μ.',
 predict:{q:'You change conf.level from 0.95 to 0.99 in t.test(). What happens to the interval?',o:['It narrows','It widens','It stays the same','The sample mean changes'],c:1,
  why:'A higher confidence level uses a larger critical value, so the margin of error and the width increase. The point estimate is untouched.'},
 errors:['Reading the interval as covering 95% of individuals rather than plausible values of the parameter.','Using prop.test on a quantitative variable, or t.test on a 0/1 coded proportion when prop.test is intended.','Reporting the interval without units or context.']},

{id:'r-univariate',w:10,t:'Univariate graphs for the project',a:'rprog',
 goal:'Describe each project variable on its own before touching any relationship, as required in the Results section.',
 explain:['Categorical variables: table() for counts, prop.table() for percentages, barplot() for the display.','Quantitative variables: summary() plus sd(), then hist() and boxplot().','round(100*prop.table(table(x)), 1) gives clean percentages for a report.','useNA = "ifany" in table() reveals missing values you might otherwise never see.','Every variable named in a research question needs a univariate description first.'],
 code:'# categorical\ntable(d$region, useNA = "ifany")\nround(100*prop.table(table(d$region)), 1)\nbarplot(table(d$region), main = "Respondents by region",\n        xlab = "Region", ylab = "Count")\n\n# quantitative\nsummary(d$income)\nsd(d$income, na.rm = TRUE)\nhist(d$income, main = "Monthly income", xlab = "GH\\u20B5")',
 out:'Greater Accra      Ashanti     Northern \n         180          140           80 \n\nGreater Accra      Ashanti     Northern \n        45.0         35.0         20.0',
 task:'For one categorical and one quantitative variable in your own project dataset, produce a table of percentages and a labelled graph, then write the one-sentence description you would put in the Results section.',
 solution:'round(100*prop.table(table(d$sex)), 1)\nbarplot(table(d$sex), main = "Respondents by sex", xlab = "Sex", ylab = "Count")\n\nsummary(d$age); sd(d$age, na.rm = TRUE)\nhist(d$age, main = "Age distribution", xlab = "Age (years)")\n\nExample sentences: "The sample was 54.2% female and 45.8% male (n = 400)." / "Age was roughly symmetric, mean 38.4 years (SD 11.2), range 18 to 65."',
 predict:{q:'What does prop.table(table(x)) return?',o:['Raw counts','Proportions summing to 1','Percentages summing to 100','Cumulative counts'],c:1,
  why:'prop.table divides each count by the total, giving proportions. Multiply by 100 for percentages — a step people forget before labelling an axis "%".'},
 errors:['Reporting counts where the marker asked for percentages.','Missing values silently excluded because useNA was not set.','summary() on a categorical variable stored as a number, which returns a meaningless mean.']},

{id:'r-bivariate',w:10,t:'Bivariate graphs in R',a:'rprog',
 goal:'Produce the correct bivariate display for each of the three cases, driven by the variable types.',
 explain:['C→Q: boxplot(y ~ group, data = d) and tapply(y, group, mean) for group means.','C→C: a two-way table with prop.table(..., 1) for row percentages, plotted with barplot(..., beside = TRUE).','Q→Q: plot(x, y) with abline(lm(y ~ x)) to add the fitted line.','In prop.table, margin 1 conditions on rows and margin 2 on columns — pick the one that conditions on the explanatory variable.','Always label axes with the real variable names and units.'],
 code:'# C -> Q\nboxplot(income ~ region, data = d,\n        main = "Income by region", xlab = "Region", ylab = "GH\\u20B5")\ntapply(d$income, d$region, mean, na.rm = TRUE)\n\n# C -> C  (row percentages: condition on residence)\ntab <- table(d$residence, d$momo)\nround(100*prop.table(tab, 1), 1)\nbarplot(prop.table(tab, 1), beside = TRUE, legend = TRUE,\n        main = "Mobile money use by residence", ylab = "Proportion")\n\n# Q -> Q\nplot(d$hours, d$score, main = "Score against study hours",\n     xlab = "Hours studied", ylab = "Exam score")\nabline(lm(score ~ hours, data = d), col = "red")\ncor(d$hours, d$score, use = "complete.obs")',
 out:'        Uses MoMo  Does not\nUrban        60.0      40.0\nRural        30.0      70.0\n\n[1] 0.6213  # correlation',
 task:'For your project\'s main research question, produce the correct bivariate graph and its matching numerical summary, then write one interpretive sentence.',
 solution:'If C\u2192Q: boxplot(y ~ x, data = d) with tapply group means.\nIf C\u2192C: round(100*prop.table(table(d$x, d$y), 1), 1) with a grouped barplot.\nIf Q\u2192Q: plot(x, y) + abline(lm(y ~ x)) with cor(x, y).\n\nExample sentence: "Mobile money use was 30 percentage points higher among urban respondents (60.0%) than rural respondents (30.0%)."',
 predict:{q:'prop.table(tab, 2) instead of prop.table(tab, 1) gives you:',o:['The same table','Column percentages instead of row percentages','Raw counts','An error'],c:1,
  why:'Margin 2 conditions on the columns. If your explanatory variable defines the rows, margin 2 answers a different question and will usually be the wrong comparison to report.'},
 errors:['Plotting counts rather than conditional percentages for C→C.','Putting the response on the x-axis of a scatterplot.','cor() returning NA because of missing values — add use = "complete.obs".']},

{id:'r-project-bivariate',w:11,t:'Bivariate inference and moderation in R',a:'rprog',
 goal:'Run the formal test that matches your bivariate case, and check whether a third variable moderates the relationship.',
 explain:['C→Q with two groups: t.test(y ~ group, data = d). With three or more: summary(aov(y ~ group, data = d)).','C→C: chisq.test(table(a, b)); inspect $expected to confirm all expected counts are at least 5.','Q→Q: cor.test(x, y) or summary(lm(y ~ x, data = d)) for the slope test and r².','Moderation: repeat the analysis within each level of the third variable using by(), or fit an interaction with y ~ x * moderator.','Report the statistic, df, p-value, effect size and direction — never the p-value alone.'],
 code:'t.test(income ~ residence, data = d)\nsummary(aov(income ~ region, data = d))\n\nct <- chisq.test(table(d$residence, d$momo))\nct; ct$expected\n\nsummary(lm(score ~ hours, data = d))\n\n# moderation: same analysis within each level\nby(d, d$residence, function(x) cor.test(x$income, x$health))',
 out:'Pearson\'s Chi-squared test\nX-squared = 36.364, df = 1, p-value = 1.6e-09\n\nCoefficients:\n            Estimate Std.Error t value Pr(>|t|)\nhours          2.310     0.402    5.75  1.2e-07\nMultiple R-squared: 0.384',
 task:'Run the test matching your own research question, then repeat it within the levels of a plausible moderator and compare the two results.',
 solution:'Overall:  cor.test(d$income, d$health)\nStratified: by(d, d$residence, function(x) cor.test(x$income, x$health))\n\nIf the overall r is 0.30 while the urban stratum gives 0.42 (p < .001) and the rural stratum 0.05 (p = .48), residence moderates the association and both strata must be reported — the pooled figure conceals the difference.',
 predict:{q:'chisq.test() warns "Chi-squared approximation may be incorrect". What is the usual cause?',o:['Too many observations','One or more expected counts below 5','Missing values','A non-random sample'],c:1,
  why:'The chi-square approximation needs all expected counts of at least 5. Inspect ct$expected and collapse sparse categories, or use a Fisher exact test for small tables.'},
 errors:['Feeding percentages into chisq.test() instead of raw counts.','Using paired = TRUE in t.test for independent groups.','Reading a significant slope from observational data as evidence of causation.']}
];

/* =========================================================================
   APP CORE — storage, state, helpers
   ========================================================================= */
const SKEY='sp:state:v1', NKEY='sp:notes:v1';
const mem={};
const Store={
  async get(k){
    if(window.storage&&window.storage.get){ try{const r=await window.storage.get(k); return r&&r.value?JSON.parse(r.value):null;}catch(e){} }
    try{const s=localStorage.getItem(k); if(s) return JSON.parse(s);}catch(e){}
    return mem[k]||null;
  },
  async set(k,v){
    const s=JSON.stringify(v); mem[k]=v;
    if(window.storage&&window.storage.set){ try{await window.storage.set(k,s); return true;}catch(e){} }
    try{localStorage.setItem(k,s); return true;}catch(e){}
    return false;
  }
};
const DEFAULT={v:1,lessons:{},checks:{},q:{},qseen:{},cards:{},rlabs:{},quizLog:[],exams:[],
  mistakes:[],streak:{last:null,count:0,best:0},last:null,project:{},done:{}};
let S=JSON.parse(JSON.stringify(DEFAULT));
let NOTES={};
let saveTimer=null;
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>Store.set(SKEY,S),350); }
function saveNotes(){ Store.set(NKEY,NOTES); }

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const pct=n=>Math.round(n)+'%';
const barCls=p=>p>=75?'g':(p>=45?'w':'b');
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function weekOf(n){return COURSE.find(w=>w.n===n);}
function lessonWeek(id){const w=COURSE.find(w=>w.lessons.includes(id));return w?w.n:null;}
function areaName(a){return AREAS[a]||a;}

/* ---------- progress + mastery ---------- */
function allLessons(){return COURSE.flatMap(w=>w.lessons);}
function areaLessons(a){return allLessons().filter(id=>LESSONS[id]&&LESSONS[id].area===a);}
function mastery(a){
  const ls=areaLessons(a); const done=ls.filter(id=>S.lessons[id]).length;
  const lf=ls.length?done/ls.length:0;
  const st=S.q[a]||{n:0,c:0};
  const acc=st.n?st.c/st.n:0;
  const conf=st.n/(st.n+4);
  return Math.round(100*(0.35*lf+0.65*acc*conf));
}
function masteryRows(){
  return Object.keys(AREAS).map(a=>({a,name:AREAS[a],m:mastery(a),n:(S.q[a]||{n:0}).n}))
    .filter(r=>areaLessons(r.a).length||QBANK.some(q=>q.a===r.a));
}
function overallMastery(){const r=masteryRows(); return r.length?Math.round(r.reduce((s,x)=>s+x.m,0)/r.length):0;}
function weekProgress(n){
  const w=weekOf(n); if(!w) return 0;
  const items=w.lessons.concat(w.rlabs); if(!items.length) return w.break?100:0;
  const d=w.lessons.filter(i=>S.lessons[i]).length+w.rlabs.filter(i=>S.rlabs[i]).length;
  return Math.round(100*d/items.length);
}
function courseProgress(){
  const items=COURSE.flatMap(w=>w.lessons.concat(w.rlabs));
  if(!items.length)return 0;
  const d=items.filter(i=>S.lessons[i]||S.rlabs[i]).length;
  return Math.round(100*d/items.length);
}
function currentWeek(){
  for(const w of COURSE){ if(w.break) continue; if(weekProgress(w.n)<100) return w.n; }
  return 15;
}
function weakAreas(k){
  return masteryRows().filter(r=>r.n>0||areaLessons(r.a).some(id=>S.lessons[id]))
    .sort((x,y)=>x.m-y.m).slice(0,k||3);
}
function dueCards(){
  const t=today();
  return CARDS.filter(c=>{const st=S.cards[c.id]; return !st||!st.due||st.due<=t;});
}
function touchStreak(){
  const t=today(), st=S.streak;
  if(st.last===t) return;
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  st.count=(st.last===y)?st.count+1:1;
  st.last=t; st.best=Math.max(st.best||0,st.count); save();
}
function setLast(route,label){ S.last={route,label}; save(); }

/* =========================================================================
   QUIZ + EXAM ENGINE
   ========================================================================= */
let Q=null;
function pickQuestions(opts){
  let pool=QBANK.slice();
  if(opts.areas&&opts.areas.length) pool=pool.filter(q=>opts.areas.includes(q.a));
  if(opts.week){ const w=weekOf(opts.week); const ar=[...new Set(w.lessons.map(id=>LESSONS[id]&&LESSONS[id].area).filter(Boolean))];
    pool=QBANK.filter(q=>ar.includes(q.a)); }
  if(opts.scope==='weak'){ const wa=weakAreas(4).map(r=>r.a); pool=QBANK.filter(q=>wa.includes(q.a)); }
  if(opts.scope==='mistakes'){ const ids=[...new Set(S.mistakes.map(m=>m.qid))]; pool=QBANK.filter(q=>ids.includes(q.id)); }
  if(!pool.length) pool=QBANK.slice();
  return shuffle(pool).slice(0,Math.min(opts.n||10,pool.length));
}
function startQuiz(opts){
  Q={list:pickQuestions(opts),i:0,ans:[],mode:opts.mode||'quiz',n:opts.n,
     mins:opts.mins||0,end:opts.mins?Date.now()+opts.mins*60000:0,submitted:false};
  touchStreak();
  render();
}
function normalise(s){return String(s||'').toLowerCase().replace(/[^a-z0-9. ]/g,' ').replace(/\s+/g,' ').trim();}
function gradeSA(q,ans){
  const a=normalise(ans); if(!a) return false;
  return (q.alts||[]).some(alt=>{
    const ws=alt.split(/\s+/); const hit=ws.filter(w=>a.includes(w)).length;
    return hit/ws.length>=0.5;
  });
}
function gradeQ(q,resp){
  if(q.ty==='num'){const v=parseFloat(String(resp).replace(/[^0-9.\-]/g,'')); return isFinite(v)&&Math.abs(v-q.ans)<=(q.tol||0.01);}
  if(q.ty==='sa') return gradeSA(q,resp);
  return Number(resp)===q.c;
}
function recordAnswer(q,resp,ok){
  S.q[q.a]=S.q[q.a]||{n:0,c:0}; S.q[q.a].n++; if(ok)S.q[q.a].c++;
  S.qseen[q.id]=S.qseen[q.id]||{n:0,c:0}; S.qseen[q.id].n++; if(ok)S.qseen[q.id].c++;
  if(!ok){
    const my=q.ty==='mc'||q.ty==='tf'?(q.o[Number(resp)]||'(no answer)'):String(resp||'(blank)');
    const correct=q.ty==='mc'||q.ty==='tf'?q.o[q.c]:(q.ty==='num'?String(q.ans):(q.alts?'See model answer':''));
    const likely=(q.wrong&&q.wrong[Number(resp)])?q.wrong[Number(resp)]:
      (q.ty==='num'?'Check each arithmetic step and confirm you used the right formula and denominator.':
       'Re-read what the question asked for — the quantity requested is often not the one first computed.');
    const sim=QBANK.filter(x=>x.a===q.a&&x.id!==q.id)[0];
    S.mistakes=S.mistakes.filter(m=>m.qid!==q.id);
    S.mistakes.push({qid:q.id,q:q.q,my,correct,why:q.why,area:q.a,likely,sim:sim?sim.id:null,date:today()});
    if(S.mistakes.length>120) S.mistakes=S.mistakes.slice(-120);
  }
  save();
}

    h+=head(`Question ${Q.i+1} of ${Q.list.length}`,'Quiz',`<span class="tag n">${esc(areaName(q.a))}</span>`);
  }
  h+='<div class="panel">';
  h+=`<div class="qmeta"><span>${esc(areaName(q.a))} · ${['easy','moderate','hard'][q.lv-1]}</span><span>${q.ty==='num'?'calculation':q.ty==='sa'?'short answer':q.ty==='tf'?'true / false':'multiple choice'}</span></div>`;
  h+=`<p style="font-size:1.03rem">${q.q}</p>`;
  const answered=a&&a.done;
  if(q.ty==='mc'||q.ty==='tf'){
    q.o.forEach((o,idx)=>{
      let cls='opt';
      if(answered&&!exam){ if(idx===q.c) cls+=' right'; else if(a.resp===idx) cls+=' wrong'; }
      else if(a&&a.resp===idx) cls+=' sel';
      h+=`<button class="${cls}" data-opt="${idx}" ${answered?'disabled':''}><span class="mk">${String.fromCharCode(65+idx)}</span>${o}</button>`;
    });
  } else {
    h+=`<input type="${q.ty==='num'?'text':'text'}" id="qresp" placeholder="${q.ty==='num'?'Your numeric answer':'Your answer in a sentence'}" value="${esc(a?a.resp:'')}" ${answered?'disabled':''}>`;
  }
  if(answered&&!exam){
    const ok=a.ok;
    h+=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'Correct.':'Not correct.'}</b> ${q.why}`;
    if(!ok&&q.wrong&&q.wrong[a.resp]) h+=`<br><br><b>Why your choice fails:</b> ${q.wrong[a.resp]}`;
    if(q.ty==='num'&&!ok) h+=`<br><br><b>Correct answer:</b> ${q.ans}`;
    if(q.ty==='sa'){h+=`<br><br><div class="row"><span class="small">Grade yourself:</span>
      <button class="btn sm quiet" data-selfmark="1">I got this right</button>
      <button class="btn sm quiet" data-selfmark="0">I got this wrong</button></div>`;}
    h+='</div>';
  }
  h+='<div class="row" style="margin-top:14px">';
  if(!answered) h+=`<button class="btn" id="qsubmit">${exam?'Save and continue':'Submit answer'}</button>`;
  else h+=`<button class="btn" id="qnext">${Q.i+1<Q.list.length?'Next question':'See results'}</button>`;
  if(exam&&Q.i>0&&!answered) h+='<button class="btn quiet" id="qback">Previous</button>';
  h+=`<button class="btn quiet" id="qquit">Leave quiz</button></div></div>`;
  return h;
}

function finishQuiz(){
  const total=Q.list.length, score=Q.ans.filter(a=>a&&a.ok).length;
  const scope=[...new Set(Q.list.map(q=>areaName(q.a)))].slice(0,3).join(', ');
  if(Q.mode==='exam') S.exams.push({date:today(),score,total,mins:Q.mins});
  S.quizLog.push({date:today(),scope:Q.mode==='exam'?'Exam · '+scope:scope,score,total});
  if(S.quizLog.length>40)S.quizLog=S.quizLog.slice(-40);
  Q.done=true; save();
}
function tickTimer(){
  if(!Q||!Q.end||Q.done) return;
  const el=document.getElementById('tmr'); if(!el) return;
  const left=Math.max(0,Q.end-Date.now());
  const m=Math.floor(left/60000), s=Math.floor((left%60000)/1000);
  el.textContent=`${m}:${String(s).padStart(2,'0')}`;
  el.classList.toggle('low',left<120000);
  if(left<=0){ gradeExamAll(); }
}
function gradeExamAll(){
  Q.list.forEach((q,i)=>{
    const a=Q.ans[i]||{resp:null};
    const ok=a.resp===null||a.resp===undefined?false:gradeQ(q,a.resp);
    Q.ans[i]={resp:a.resp,done:true,ok};
    recordAnswer(q,a.resp,ok);
  });
  finishQuiz(); render();
}

let FC=null;
function cardDeck(area){
  let pool=CARDS.filter(c=>!area||c.a===area);
  const t=today();
  const due=pool.filter(c=>{const s=S.cards[c.id];return !s||!s.due||s.due<=t;});
  return shuffle(due.length?due:pool);
}
function rateCard(id,grade){
  const s=S.cards[id]||{ease:2.5,int:0,reps:0,lapses:0};
  if(grade===0){s.int=0;s.lapses++;s.ease=Math.max(1.3,s.ease-0.2);}
  else if(grade===1){s.int=Math.max(1,Math.round(s.int*1.2)||1);s.ease=Math.max(1.3,s.ease-0.15);}
  else if(grade===2){s.int=s.int?Math.round(s.int*s.ease):1;}
  else {s.int=s.int?Math.round(s.int*s.ease*1.4):3;s.ease=s.ease+0.1;}
  s.reps++;
  const d=new Date(Date.now()+Math.max(0,s.int)*864e5);
  s.due=d.toISOString().slice(0,10); s.last=today();
  S.cards[id]=s; save();
}

let TUT={msgs:[],plan:null,step:0,tries:0,problem:'',api:null};
function detectPlan(text){
  const t=text.toLowerCase(); let best=null,score=0;
  TUTORPLANS.forEach(p=>{const s=p.k.filter(k=>t.includes(k)).length; if(s>score){score=s;best=p;}});
  return best;
}
function tutorPush(role,text){TUT.msgs.push({role,text});}
function viewTutor(){
  let h=head('Problem tutor','Work through a problem step by step');
  h+=`<div class="panel small muted">Paste a statistics problem and the tutor walks you through it — identifying the topic, asking what you think the first step is, and giving hints one at a time. The full solution stays hidden until you have attempted the problem or ask for it outright.</div>`;
  h+='<div class="panel"><div class="chat" id="chat">';
  if(!TUT.msgs.length){

  }
  TUT.msgs.forEach(m=>{
    h+=`<div class="msg ${m.role==='me'?'me':''}"><div class="who">${m.role==='me'?'You':'T'}</div><div class="body">${m.role==='me'?esc(m.text):m.text}</div></div>`;
  });
  h+='</div><hr>';
  h+=`<textarea id="tutin" rows="3" placeholder="${TUT.plan?'Your attempt at this step…':'Paste your problem here…'}"></textarea>

  if(TUT.plan){

      <div class="row" style="margin-top:10px">${areaLessonsForTopic(TUT.plan.topic).map(id=>`<span class="pill" data-go="#/lesson/${id}">${esc(LESSONS[id].t)}</span>`).join('')}</div></div>`;

function areaLessonsForTopic(topic){
  const map={'Normal distribution':['normal-dist','continuous-dist'],'Binomial distribution':['binomial','random-variables'],
    'Conditional probability':['cond-prob','independence'],'Probability rules':['prob-events','prob-intro'],
    'Confidence intervals':['confidence-intervals','estimation'],'Hypothesis testing':['hypothesis-testing'],
    'Sampling distributions':['sampling-distributions','clt'],'Regression and correlation':['qq-inference','examining-relationships'],
    'Chi-square test':['cc-inference'],'Describing distributions':['examining-distributions','variability']};
  return (map[topic]||[]).filter(id=>LESSONS[id]);

async function tutorSend(text){
  if(!text.trim()) return;
  tutorPush('me',text);
  if(!TUT.plan){
    TUT.problem=text;
    TUT.plan=detectPlan(text);
    TUT.step=0;
    if(!TUT.plan){
      tutorPush('t','<p>I could not pin the topic down from the wording. Which of these is it closest to?</p><ul class="tight">'+
        TUTORPLANS.map(p=>`<li>${p.topic}</li>`).join('')+'</ul><p>Reply with the topic name and the numbers in the problem, and we will start.</p>');
    } else {
      tutorPush('t',`<p><b>Topic: ${TUT.plan.topic}.</b></p><p>${TUT.plan.steps[0].ask}</p><p class="small muted">Have a go — I will not give the answer until you have tried or asked for it.</p>`);
    }
  } else {
    const st=TUT.plan.steps[TUT.step];
    TUT.tries++;
    let reply=`<p>${st.hint}</p>`;
    TUT.step++;
    if(TUT.step<TUT.plan.steps.length){
      reply+=`<p><b>Next:</b> ${TUT.plan.steps[TUT.step].ask}</p>`;
    } else {
      reply+='<p>That is the last step. Write out your final answer in a full sentence with units and context — that is what earns the marks. If you want the complete worked reasoning, use “Show the full solution”.</p>';
    }
    tutorPush('t',reply);
  }
  render();
  tryAPI();
}
async function tryAPI(){
  if(TUT.api===false) return;
  try{
    const sys="You are a Socratic statistics tutor for an introductory university course (probability, distributions, sampling, estimation, hypothesis testing, inference for relationships, and R). NEVER give the final answer unless the student explicitly asks for the full solution or has already made an attempt at every step. Identify the topic, ask what the student thinks the next step is, give one progressive hint at a time, correct mistakes gently and explain the underlying concept. Keep replies under 120 words. Use plain HTML (<p>, <b>, <ul>) and no markdown.";
    const msgs=TUT.msgs.map(m=>({role:m.role==='me'?'user':'assistant',content:m.text.replace(/<[^>]+>/g,' ')}));
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,system:sys,messages:msgs})});
    if(!r.ok) throw new Error('api');
    const data=await r.json();
    const txt=(data.content||[]).map(c=>c.type==='text'?c.text:'').join('').trim();
    if(txt){ TUT.api=true; TUT.msgs[TUT.msgs.length-1]={role:'t',text:txt}; render(); }
  }catch(e){ TUT.api=false; }
}
function tutorSolution(){
  if(!TUT.plan) return;
  let h='<p><b>Full worked route for this problem type:</b></p><ol class="steps">';
  TUT.plan.steps.forEach(s=>{h+=`<li>${s.ask}<br><span class="muted small">${s.hint}</span></li>`;});
  h+='</ol><p class="small">Apply each step to your own numbers. The relevant lesson pages are linked below the chat if a step is not making sense.</p>';
  tutorPush('t',h); TUT.step=TUT.plan.steps.length; render();
}

function searchAll(q){
  q=q.toLowerCase().trim(); if(!q) return null;
  const res={lessons:[],formulas:[],cards:[],questions:[],rlabs:[],notes:[],weeks:[]};
  Object.keys(LESSONS).forEach(id=>{const L=LESSONS[id];
    const blob=(L.t+' '+L.simple+' '+L.formal+' '+(L.defs||[]).map(d=>d.join(' ')).join(' ')+' '+areaName(L.area)).toLowerCase();
    if(blob.includes(q)) res.lessons.push(id);});
  FORMULAS.forEach(f=>{if((f.n+' '+f.f+' '+f.use+' '+f.ex).toLowerCase().includes(q)) res.formulas.push(f);});
  CARDS.forEach(c=>{if((c.f+' '+c.b+' '+c.cat).toLowerCase().includes(q)) res.cards.push(c);});
  QBANK.forEach(x=>{if((x.q+' '+(x.why||'')).toLowerCase().includes(q)) res.questions.push(x);});
  RLABS.forEach(r=>{if((r.t+' '+r.goal+' '+r.code+' '+r.explain.join(' ')).toLowerCase().includes(q)) res.rlabs.push(r);});
  Object.keys(NOTES).forEach(w=>(NOTES[w]||[]).forEach(n=>{if((n.title+' '+n.text).toLowerCase().includes(q)) res.notes.push({w,n});}));
  COURSE.forEach(w=>{if((w.title+' '+w.oli.join(' ')+' '+w.tutorials.join(' ')+' '+w.project.join(' ')).toLowerCase().includes(q)) res.weeks.push(w);});
  return res;
}

  if(r.questions.length){h+='<div class="panel"><h3>Practice questions</h3><p class="small muted">Answers are not shown here — open a quiz to attempt them.</p>';

    h+=`<button class="btn sm ghost" data-go="#/quiz?areas=${[...new Set(r.questions.map(x=>x.a))].join(',')}&auto=1">Quiz me on these</button></div>`;}

function parseHash(){
  const raw=(location.hash||'#/dash').slice(1);
  const [path,qs]=raw.split('?');
  const parts=path.split('/').filter(Boolean);
  const params={};
  (qs||'').split('&').filter(Boolean).forEach(p=>{const [k,v]=p.split('='); params[decodeURIComponent(k)]=decodeURIComponent(v||'');});
  return {parts,params};
}
function go(route){
  if(route.startsWith('#/quiz')&&Q&&Q.done) Q=null;
  if(location.hash===route) render(); else location.hash=route;
  if(window.innerWidth<=860) $('#sidebar').classList.remove('open');
}
function render(){
  const {parts,params}=parseHash();
  const p0=parts[0]||'dash';
  let html='';
  try{
    switch(p0){
      case 'dash': html=viewDash(); break;
      case 'week': html=viewWeek(parseInt(parts[1]||'1',10)); break;
      case 'lesson': html=viewLesson(parts[1]); break;
      case 'quiz':
        if(Q&&Q.done) html=viewQuizResults();
        else if(Q) html=viewQuizRun();
        else if(params.auto||params.scope||params.areas){
          startQuiz({areas:(params.areas||'').split(',').filter(Boolean),scope:params.scope,n:parseInt(params.n||'10',10)});
          return;
        }
        else html=viewQuizSetup(params);
        break;
      case 'exam':
        if(Q&&Q.done) html=viewQuizResults();
        else if(Q) html=viewQuizRun();
        else html=viewExam();
        break;
      case 'cards': html=viewCards(params); break;
      case 'rlab': html=parts[1]?viewRLab(parts[1]):viewRLabList(); break;
      case 'tutor': html=viewTutor(); break;
      case 'mastery': html=viewMastery(); break;
      case 'mistakes': html=viewMistakes(); break;
      case 'formulas': html=viewFormulas(params); break;
      case 'project': html=viewProject(); break;
      case 'notes': html=viewNotes(params); break;
      case 'note': html=viewNote(parts[1],parts[2]); break;
      case 'search': html=viewSearch(params); break;
      default: html=viewDash();
    }
  }catch(err){
    html=`<div class="panel"><h3>Something failed to render</h3><p class="small">${esc(err.message)}</p>
      <button class="btn" data-go="#/dash">Back to the dashboard</button></div>`;
  }
  $('#view').innerHTML=html;
  markActive();
  const chat=document.getElementById('chat'); if(chat) chat.scrollTop=chat.scrollHeight;
  window.scrollTo(0,0);
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go]');
  if(t){ go(t.getAttribute('data-go')); return; }

  const rev=e.target.closest('[data-reveal]');
  if(rev){ const el=document.getElementById(rev.getAttribute('data-reveal'));
    if(el){el.style.display=el.style.display==='none'?'block':'none'; rev.textContent=el.style.display==='none'?'Show the answer':'Hide the answer';} return; }

  const ld=e.target.closest('[data-lesson-done]');
  if(ld){ const id=ld.getAttribute('data-lesson-done'); S.lessons[id]=!S.lessons[id]; if(!S.lessons[id])delete S.lessons[id];
    touchStreak(); save(); renderNav(); render(); return; }

  const rd=e.target.closest('[data-rlab-done]');
  if(rd){ const id=rd.getAttribute('data-rlab-done'); S.rlabs[id]=!S.rlabs[id]; if(!S.rlabs[id])delete S.rlabs[id];
    touchStreak(); save(); renderNav(); render(); return; }

  const dn=e.target.closest('[data-done]');
  if(dn){ const k=dn.getAttribute('data-done'); S.done[k]=dn.checked; save(); return; }

  /* ---- quiz interactions ---- */
  const opt=e.target.closest('[data-opt]');
  if(opt&&Q){ const i=Q.i; Q.ans[i]=Object.assign({},Q.ans[i],{resp:Number(opt.getAttribute('data-opt'))}); render(); return; }

  if(e.target.id==='qsubmit'&&Q){
    const q=Q.list[Q.i]; let resp=Q.ans[Q.i]?Q.ans[Q.i].resp:null;
    const inp=document.getElementById('qresp'); if(inp) resp=inp.value;
    if(resp===null||resp===undefined||resp===''){ if(!confirm('Submit with no answer?')) return; }
    if(Q.mode==='exam'){
      Q.ans[Q.i]={resp};
      if(Q.i+1<Q.list.length){Q.i++; render();} else { if(confirm('Submit the exam for marking?')) gradeExamAll(); }
    } else {
      const ok=gradeQ(q,resp);
      Q.ans[Q.i]={resp:q.ty==='mc'||q.ty==='tf'?Number(resp):resp,done:true,ok};
      recordAnswer(q,resp,ok); renderNav(); render();
    }
    return;
  }
  if(e.target.id==='qnext'&&Q){
    if(Q.i+1<Q.list.length){Q.i++; render();} else {finishQuiz(); renderNav(); render();}
    return;
  }
  if(e.target.id==='qback'&&Q){ if(Q.i>0){Q.i--; render();} return; }
  if(e.target.id==='qquit'&&Q){ if(confirm('Leave this quiz? Answers already submitted are kept.')){Q=null; go('#/dash');} return; }
  if(e.target.id==='qstart'){
    const sel=document.getElementById('qa');
    const areas=[...sel.selectedOptions].map(o=>o.value);
    startQuiz({areas,n:parseInt(document.getElementById('qn').value,10)});
    return;
  }
  if(e.target.id==='estart'){
    startQuiz({mode:'exam',n:parseInt(document.getElementById('en').value,10),mins:parseInt(document.getElementById('em').value,10)});
    return;
  }
  const sm=e.target.closest('[data-selfmark]');
  if(sm&&Q){
    const q=Q.list[Q.i], want=sm.getAttribute('data-selfmark')==='1', a=Q.ans[Q.i];
    if(a.ok!==want){
      S.q[q.a]=S.q[q.a]||{n:0,c:0};
      S.q[q.a].c=Math.max(0,S.q[q.a].c+(want?1:-1));
      a.ok=want;
      if(want) S.mistakes=S.mistakes.filter(m=>m.qid!==q.id); else recordAnswer(q,a.resp,false);
      save(); renderNav(); render();
    }
    return;
  }

  /* ---- flashcards ---- */
  if(e.target.closest('#cardface')&&FC){ FC.flip=!FC.flip; render(); return; }
  const rt=e.target.closest('[data-rate]');
  if(rt&&FC){ const c=FC.deck[FC.i%FC.deck.length];
    rateCard(c.id,Number(rt.getAttribute('data-rate')));
    FC.i++; FC.flip=false; touchStreak();
    if(FC.i>=FC.deck.length) FC.deck=cardDeck(FC.area);
    render(); return; }

  /* ---- R lab prediction ---- */
  const rp=e.target.closest('[data-rpred]');
  if(rp){ const [id,idx]=rp.getAttribute('data-rpred').split(':'); const L=RLABS.find(r=>r.id===id);
    const ok=Number(idx)===L.predict.c;
    document.querySelectorAll(`[data-rpred^="${id}:"]`).forEach(b=>{
      const i=Number(b.getAttribute('data-rpred').split(':')[1]);
      if(i===L.predict.c) b.classList.add('right'); else if(i===Number(idx)) b.classList.add('wrong');
      b.disabled=true;});
    const box=document.getElementById('rpred-'+id);
    box.style.display='block';
    box.className='fb '+(ok?'ok':'no');
    box.innerHTML=`<b>${ok?'Correct.':'Not quite.'}</b> ${L.predict.why}`;
    return; }

  /* ---- notes ---- */
  if(e.target.id==='nadd'){
    const w=document.getElementById('nw').value;
    const title=document.getElementById('nt').value.trim()||('Notes — Week '+w);
    const topics=[...document.getElementById('ntop').selectedOptions].map(o=>o.value);
    const text=document.getElementById('ntext').value;
    if(!text.trim()){ alert('Paste the note content first, or upload a text file.'); return; }
    const id='n'+Date.now().toString(36);
    NOTES[w]=NOTES[w]||[]; NOTES[w].push({id,title,topics,text,added:today()});
    saveNotes(); touchStreak(); go('#/note/'+w+'/'+id);
    return;
  }
  const del=e.target.closest('[data-delnote]');
  if(del){ const [w,id]=del.getAttribute('data-delnote').split(':');
    if(confirm('Delete this note? This cannot be undone.')){ NOTES[w]=(NOTES[w]||[]).filter(n=>n.id!==id); saveNotes(); render(); }
    return; }

  if(e.target.id==='clearmist'){ if(confirm('Clear every saved mistake?')){S.mistakes=[]; save(); render();} return; }

  /* ---- tutor ---- */
  if(e.target.id==='tutsend'){ const v=document.getElementById('tutin').value; tutorSend(v); return; }
  if(e.target.id==='tuthint'&&TUT.plan){
    const st=TUT.plan.steps[Math.min(TUT.step,TUT.plan.steps.length-1)];
    tutorPush('t',`<p><b>Hint.</b> ${st.hint}</p><p class="small muted">Try the step again before moving on.</p>`); render(); return; }
  if(e.target.id==='tutsol'){ if(confirm('Show the full worked route? Try each step first — that is where the learning is.')) tutorSolution(); return; }
  if(e.target.id==='tutreset'){ TUT={msgs:[],plan:null,step:0,tries:0,problem:'',api:TUT.api}; render(); return; }

  if(e.target.id==='menubtn'){ $('#sidebar').classList.toggle('open'); return; }
  if(window.innerWidth<=860&&!e.target.closest('#sidebar')&&!e.target.closest('#menubtn')) $('#sidebar').classList.remove('open');
});

/* ---------- randomness and statistics utilities ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let RNG=Math.random;
function seedRNG(s){RNG=mulberry32(s);}
function rnd(){return RNG();}
function rint(a,b){return a+Math.floor(rnd()*(b-a+1));}
function pick(a){return a[Math.floor(rnd()*a.length)];}
function rnorm(mu,sd){let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();
  return mu+sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function rexpv(rate){return -Math.log(1-rnd())/rate;}
function normCDF(z){const t=1/(1+0.2316419*Math.abs(z)),d=0.3989423*Math.exp(-z*z/2);
  const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
  return z>0?1-p:p;}
function normInv(p){
  if(p<=0)return -6; if(p>=1)return 6;
  const a=[-39.696830,220.946098,-275.928510,138.357751,-30.664798,2.506628],
        b=[-54.476098,161.585836,-155.698979,66.801311,-13.280681],
        c=[-0.007784894,-0.32239645,-2.400758,-2.549732,4.374664,2.938163],
        d=[0.007784695,0.32246712,2.445134,3.754408];
  const pl=0.02425; let q,r;
  if(p<pl){q=Math.sqrt(-2*Math.log(p));
    return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
  if(p>1-pl){q=Math.sqrt(-2*Math.log(1-p));
    return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
  q=p-0.5; r=q*q;
  return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}
function lchoose(n,k){let s=0;for(let i=1;i<=k;i++)s+=Math.log(n-k+i)-Math.log(i);return s;}
function nchoose(n,k){return Math.round(Math.exp(lchoose(n,k)));}
function binomPMF(k,n,p){if(k<0||k>n)return 0;
  return Math.exp(lchoose(n,k)+k*Math.log(p)+(n-k)*Math.log(1-p));}
function binomCDF(k,n,p){let s=0;for(let i=0;i<=Math.floor(k);i++)s+=binomPMF(i,n,p);return Math.min(1,s);}
function mn(a){return a.reduce((x,y)=>x+y,0)/a.length;}
function sdv(a){const m=mn(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-1));}
function qtile(a,q){const s=a.slice().sort((x,y)=>x-y),i=(s.length-1)*q,lo=Math.floor(i),hi=Math.ceil(i);
  return s[lo]+(s[hi]-s[lo])*(i-lo);}
function corrOf(x,y){const mx=mn(x),my=mn(y);let sxy=0,sxx=0,syy=0;
  for(let i=0;i<x.length;i++){sxy+=(x[i]-mx)*(y[i]-my);sxx+=(x[i]-mx)**2;syy+=(y[i]-my)**2;}
  return sxy/Math.sqrt(sxx*syy);}
function lsFit(x,y){const r=corrOf(x,y),b=r*sdv(y)/sdv(x),a=mn(y)-b*mn(x);return {a,b,r};}
function tStar(df){ // two-sided 95% critical values, adequate for practice
  const tbl={1:12.706,2:4.303,3:3.182,4:2.776,5:2.571,6:2.447,7:2.365,8:2.306,9:2.262,10:2.228,
   12:2.179,15:2.131,20:2.086,24:2.064,30:2.042,40:2.021,60:2.000,120:1.980};
  const keys=Object.keys(tbl).map(Number).sort((a,b)=>a-b);
  for(const k of keys) if(df<=k) return tbl[k];
  return 1.96;}

/* ---------- SVG chart builders (used by the graph games) ---------- */
function svgFrame(inner,w,h,title){

}
function axisLbl(x,y,t,anchor,size){return `<text x="${x}" y="${y}" font-size="${size||11}" fill="#4a5a70" font-family="sans-serif" text-anchor="${anchor||'middle'}">${esc(t)}</text>`;}
function binData(data,k){
  const lo=Math.min(...data),hi=Math.max(...data),w=(hi-lo)/k||1,c=new Array(k).fill(0);
  data.forEach(v=>{let i=Math.floor((v-lo)/w); if(i>=k)i=k-1; if(i<0)i=0; c[i]++;});
  return {lo,hi,w,c};
}
function svgHist(data,opt){

function svgScatter(x,y,opt){
  opt=opt||{}; const W=430,H=250,L=44,B=34;
  const xl=Math.min(...x),xh=Math.max(...x),yl=Math.min(...y),yh=Math.max(...y);

  if(opt.line){const f=lsFit(x,y);

function svgBox(groups,opt){

function svgBars(labels,values,opt){

  const bw=(W-L-16)/labels.length;
  let g='';
  labels.forEach((l,i)=>{const bh=(H-B-16)*(values[i]-base)/((mx-base)||1);
    g+=`<rect x="${L+i*bw+bw*0.15}" y="${H-B-bh}" width="${bw*0.7}" height="${Math.max(1,bh)}" fill="${opt.col||'#27488f'}" opacity=".85"/>`;
    g+=axisLbl(L+i*bw+bw/2,H-B+15,l,'middle',10);});
  g+=`<line x1="${L}" y1="${H-B}" x2="${W-8}" y2="${H-B}" stroke="#4a5a70"/><line x1="${L}" y1="10" x2="${L}" y2="${H-B}" stroke="#4a5a70"/>`;
  g+=axisLbl(L-8,H-B+4,fmt(base,0),'end',10);
  g+=axisLbl(L-8,20,fmt(mx,0),'end',10);
  g+=axisLbl((W+L)/2,H-6,opt.xlab||'');
  return svgFrame(g,W,H,'bar chart');
}
function svgNormal(mu,sd,shade){
  const W=460,H=200,L=30,B=34;
  const lo=mu-4*sd,hi=mu+4*sd;
  const px=v=>L+(W-L-14)*(v-lo)/(hi-lo);
  const dens=v=>Math.exp(-((v-mu)**2)/(2*sd*sd));
  const py=d=>H-B-(H-B-18)*d;
  let path='',shadePath='';
  for(let i=0;i<=180;i++){const v=lo+(hi-lo)*i/180; path+=(i?'L':'M')+fmt(px(v),1)+' '+fmt(py(dens(v)),1)+' ';}
  if(shade){
    const a=Math.max(lo,shade[0]===null?lo:shade[0]), b=Math.min(hi,shade[1]===null?hi:shade[1]);
    shadePath='M'+fmt(px(a),1)+' '+fmt(py(0),1)+' ';
    for(let i=0;i<=90;i++){const v=a+(b-a)*i/90; shadePath+='L'+fmt(px(v),1)+' '+fmt(py(dens(v)),1)+' ';}
    shadePath+='L'+fmt(px(b),1)+' '+fmt(py(0),1)+' Z';
  }
  let g=shade?`<path d="${shadePath}" fill="#27488f" opacity=".22"/>`:'';
  g+=`<path d="${path}" fill="none" stroke="#27488f" stroke-width="2"/>`;
  g+=`<line x1="${L}" y1="${H-B}" x2="${W-8}" y2="${H-B}" stroke="#4a5a70"/>`;
  [-2,-1,0,1,2].forEach(k=>{const v=mu+k*sd;
    g+=`<line x1="${px(v)}" y1="${H-B}" x2="${px(v)}" y2="${H-B+4}" stroke="#4a5a70"/>`+axisLbl(px(v),H-B+16,fmt(v,sd<2?1:0));});
  if(shade&&shade[0]!==null&&isFinite(shade[0])) g+=`<line x1="${px(shade[0])}" y1="18" x2="${px(shade[0])}" y2="${H-B}" stroke="#a82b46" stroke-dasharray="3 3"/>`;
  if(shade&&shade[1]!==null&&isFinite(shade[1])) g+=`<line x1="${px(shade[1])}" y1="18" x2="${px(shade[1])}" y2="${H-B}" stroke="#a82b46" stroke-dasharray="3 3"/>`;
  return svgFrame(g,W,H,'normal curve');
}
function svgCIs(intervals,truth,lo,hi){
  const W=440,H=Math.min(260,26+intervals.length*10),L=30;
  const px=v=>L+(W-L-14)*(v-lo)/((hi-lo)||1);
  let g=`<line x1="${px(truth)}" y1="6" x2="${px(truth)}" y2="${H-18}" stroke="#0e7f6f" stroke-width="1.5"/>`;
  intervals.forEach((iv,i)=>{const y=12+i*((H-30)/intervals.length);
    const hit=iv[0]<=truth&&truth<=iv[1];
    g+=`<line x1="${px(iv[0])}" y1="${y}" x2="${px(iv[1])}" y2="${y}" stroke="${hit?'#7d8ba0':'#a82b46'}" stroke-width="${hit?1.4:2}"/>`;});
  g+=axisLbl(px(truth),H-4,'true parameter','middle',10);
  return svgFrame(g,W,H,'repeated confidence intervals');
}

const POPGEN={
  normal:()=>{const mu=rint(40,160),sd=rint(5,18);return {d:Array.from({length:220},()=>rnorm(mu,sd)),k:'normal',mu,sd};},
  right:()=>{const r=1/rint(6,20);return {d:Array.from({length:220},()=>rexpv(r)),k:'right'};},
  left:()=>{const r=1/rint(6,20),m=rint(80,120);return {d:Array.from({length:220},()=>m-rexpv(r)),k:'left'};},
  uniform:()=>{const a=rint(0,20),b=a+rint(30,80);return {d:Array.from({length:260},()=>a+rnd()*(b-a)),k:'uniform'};},
  bimodal:()=>{const m1=rint(20,40),m2=m1+rint(30,50);
    return {d:Array.from({length:240},()=>rnd()<0.5?rnorm(m1,5):rnorm(m2,6)),k:'bimodal'};},
  binomial:()=>{const n=rint(10,25),p=[0.2,0.3,0.5,0.7][rint(0,3)];
    return {d:Array.from({length:240},()=>{let s=0;for(let i=0;i<n;i++)s+=rnd()<p?1:0;return s;}),k:'binomial',n,p};},
  sampling:()=>{const r=1/12,n=rint(30,60);
    return {d:Array.from({length:240},()=>mn(Array.from({length:n},()=>rexpv(r)))),k:'sampling',n};}
};
